שראל.","priceLabel":"20 ₪","includedBonus":false,"excerpt":"הרבי יצא עם רעייתו, אחיו ופמליה של בני משפחה ומלווים. לפי הידיעה, הקבוצה בחרה במסלול יבשתי כדי לחסוך ממנו את קשיי ההפלגה, ותכננה לשהות בארץ שישה שבועות."},{"slug":"sighet-wedding","offer":3,"title":"ויז׳ניץ וסאטמר נפגשות בחתונה בסיגט","meta":"ויז׳ניץ · 1935","teaser":"מה משך שתי חצרות חסידיות לחתונה אחת? דיווח מסיגט מתאר את חתונת משפחות הגר וטייטלבוים ואת המפגש בין החצרות.","priceLabel":"20 ₪","includedBonus":false,"excerpt":"ביום שישי אחר הצהריים הגיעו לסיגט גם אורחים מהכפרים הסמוכים. הכלה הייתה קרובת משפחתו של רב העיר, והדיווח מתאר כיצד החתונה הביאה אליה רבנים מכל רחבי מרמרוש."},{"slug":"belz-funeral","offer":9,"title":"מה קרה אחרי הלוויית הרבי מבלז?","meta":"בלז · 1926","teaser":"מה בחר הכתב לתאר אחרי שהמלווים הגיעו לקבורה? הדיווח עוקב אחר הלוויית רבי ישכר דוב מבלז וממשיך אל השעות שאחריה.","priceLabel":"20 ₪","includedBonus":false,"excerpt":"סוכנות הידיעות תיארה קהל גדול של חסידים ורבנים שהגיעו ללוות את רבי ישכר דוב. הידיעה ממשיכה מן הקבורה אל ההכרעה על הנהגת החצר, שהתקבלה לפי הדיווח מיד אחריה."},{"slug":"belz-marienbad","offer":19,"title":"סעודה שלישית עם הרבי מבלז במריינבאד","meta":"בלז · 1927","teaser":"מה שמע הכתב בשולחן השבת במריינבאד? דיווח מ־1927 מתאר את סעודה שלישית אצל הרבי מבלז, את הזמירות ואת ההמתנה לדברי תורה.","priceLabel":"30 ₪","includedBonus":false,"excerpt":"עיירת המרפא משכה מבקרים מכל העולם. בשבת אחר הצהריים התאספו החסידים בווילה שבה שהה הרבי, והכתב תיאר את המעבר מאור היום לסעודה שנמשכה אל תוך הערב."},{"slug":"satmar-rabbinate","offer":1,"title":"כשרבי יואל טייטלבוים הוצע לרבנות סאטמר","meta":"סאטמר · 1928","teaser":"איך חיפשה קהילת סאטמר רב חדש? הדיווח חוזר לדיונים בקהילה לאחר פטירת רבה, כשהועלה שמו של רבי יואל טייטלבוים.","priceLabel":"30 ₪","includedBonus":false,"excerpt":"שלושים יום לאחר פטירת הרב הקודם נדרשה הקהילה למצוא לו מחליף. לפי העיתון, הוויכוח על המועמדות העלה מחדש מחלוקת ותיקה, ושני המחנות נערכו להצבעה."},{"slug":"satmar-installation","offer":2,"title":"יום הכתרת רבי יואל ט
