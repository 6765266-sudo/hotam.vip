<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>חותם שנשאר לדורות</title>

  <style>
    :root{
      --bg:#e9e0d6;
      --disk:#0b0b0b;
      --disk2:#101010;

      --diskSize: min(92vw, 820px);
      --ringR: calc(var(--diskSize) * 0.36);

      --cardW: clamp(170px, calc(var(--diskSize) * 0.23), 240px);
      --cardH: clamp(100px, calc(var(--diskSize) * 0.14), 150px);

      --hub: clamp(120px, calc(var(--diskSize) * 0.22), 190px);
      --hubInner: clamp(62px, calc(var(--diskSize) * 0.11), 90px);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", Arial;
      background: radial-gradient(1200px 800px at 50% 35%, #f3ece4 0%, var(--bg) 55%, #e3d7cb 100%);
      min-height:100vh;
      display:grid;
      place-items:center;
      overflow-x:hidden;
      color:#111;
    }

    body:before{
      content:"";
      position:fixed; inset:0;
      background:
        radial-gradient(900px 600px at 30% 20%, rgba(0,0,0,.05), transparent 60%),
        radial-gradient(900px 600px at 70% 80%, rgba(0,0,0,.06), transparent 60%),
        repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 2px, rgba(0,0,0,.02) 2px 4px);
      mix-blend-mode: multiply;
      opacity:.28;
      pointer-events:none;
    }

    .stage{
      width: var(--diskSize);
      height: var(--diskSize);
      position:relative;
      filter: drop-shadow(0 22px 45px rgba(0,0,0,.25));
    }

    .disk{
      width:100%;
      height:100%;
      border-radius:50%;
      position:absolute; inset:0;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.08) 0 8%, transparent 9% 100%),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.03) 0 35%, rgba(0,0,0,.15) 60%, rgba(0,0,0,.35) 100%),
        repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.05) 0 2px, rgba(255,255,255,.00) 2px 7px),
        linear-gradient(145deg, var(--disk2), var(--disk));
      overflow:hidden;
    }

    /* מרכז */
    .hub{
      position:absolute;
      left:50%; top:50%;
      width: var(--hub);
      height: var(--hub);
      transform: translate(-50%,-50%);
      border-radius:50%;
      background: radial-gradient(circle, rgba(255,255,255,.92) 0%, rgba(255,255,255,.88) 35%, rgba(235,235,235,.95) 100%);
      box-shadow: 0 10px 25px rgba(0,0,0,.25);
      display:grid;
      place-items:center;
      z-index:5;
    }

    .hubInner{
      width: var(--hubInner);
      height: var(--hubInner);
      border-radius:50%;
      background: rgba(30,30,30,.28);
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.22);
      display:grid;
      place-items:center;
      cursor:pointer;
      transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
      color:#fff;
      user-select:none;
    }
    .hubInner:hover{
      background: rgba(255,255,255,.22);
      box-shadow: 0 0 0 7px rgba(255,255,255,.08), inset 0 0 0 1px rgba(255,255,255,.25);
      transform: scale(1.06);
    }

    .hubInner .btnWrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:4px;
      line-height:1;
    }
    .hubInner .icon{
      font-size:20px;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,.35));
    }
    .hubInner .txt{
      font-weight:900;
      font-size:12px;
      letter-spacing:.4px;
      opacity:.96;
    }

    /* טקסט בעיגול סביב הכפתור */
    .ringText{
      position:absolute;
      left:50%; top:50%;
      width: calc(var(--hub) * 1.85);
      height: calc(var(--hub) * 1.85);
      transform: translate(-50%,-50%);
      z-index:6;
      pointer-events:none;
      opacity:.86;
    }
    .ringText text{
      fill: rgba(255,255,255,.70);
      font-weight:800;
      font-size: 13px;
      letter-spacing: 2px;
    }

    /* כרטיסים */
    .card{
      position:absolute;
      left:50%; top:50%;
      width: var(--cardW);
      height: var(--cardH);
      transform:
        translate(-50%,-50%)
        translate(calc(cos(var(--a)) * var(--ringR)), calc(sin(var(--a)) * var(--ringR)));
      border-radius:16px;
      overflow:hidden;
      background: rgba(0,0,0,.20);
      box-shadow: 0 10px 26px rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.06);
      z-index:3;
    }

    .card img,
    .card video{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      filter: contrast(1.02) saturate(.95);
    }

    /* ✅ כיתוב: תמיד ימין-למטה, בלי רקע בכלל, מקסימום 2 שורות */
    .label{
      position:absolute;
      right:10px;
      bottom:10px;
      left:auto;
      top:auto;
      max-width: 80%;
      z-index:2;
      pointer-events:none;
      text-align:right;
    }

    .title, .sub{
      margin:0;
      color:#fff;
      text-shadow: 0 2px 10px rgba(0,0,0,.75);
      display:-webkit-box;
      -webkit-box-orient: vertical;
      overflow:hidden;
      text-overflow: ellipsis;
      -webkit-line-clamp: 2; /* מקסימום 2 שורות */
      line-height: 1.15;
    }

    .title{
      font-weight:900;
      font-size: clamp(12px, 1.4vw, 16px);
    }
    .sub{
      font-weight:800;
      opacity:.95;
      font-size: clamp(10px, 1.1vw, 13px);
      margin-top:2px;
    }

    /* 8 זוויות (שעון) */
    .a0{ --a: -90deg; }  /* 12 */
    .a1{ --a: -45deg; }  /* 1-2 */
    .a2{ --a: 0deg; }    /* 3 */
    .a3{ --a: 45deg; }   /* 4-5 */
    .a4{ --a: 90deg; }   /* 6 */
    .a5{ --a: 135deg; }  /* 7-8 */
    .a6{ --a: 180deg; }  /* 9 */
    .a7{ --a: 225deg; }  /* 10-11 */

    @media (max-width: 520px){
      :root{
        --diskSize: 96vw;
        --ringR: calc(var(--diskSize) * 0.34);
        --cardW: clamp(140px, calc(var(--diskSize) * 0.28), 200px);
        --cardH: clamp(86px, calc(var(--diskSize) * 0.16), 120px);
        --hub: clamp(95px, calc(var(--diskSize) * 0.20), 140px);
        --hubInner: clamp(56px, calc(var(--diskSize) * 0.11), 74px);
      }
      .ringText text{ font-size: 12px; letter-spacing: 1.6px; }
      .hubInner .icon{ font-size:18px; }
      .hubInner .txt{ font-size:11px; }
      .label{ max-width: 85%; right:8px; bottom:8px; }
      .title{ -webkit-line-clamp: 2; }
      .sub{ -webkit-line-clamp: 2; }
    }
  </style>
</head>

<body>
  <div class="stage">
    <div class="disk"></div>

    <!-- 12: זיכרון אבות -->
    <div class="card a0">
      <video src="assets/faith1.mp4" muted autoplay loop playsinline></video>
      <div class="label">
        <p class="title">זיכרון אבות</p>
        <p class="sub">שלא יֵאבד</p>
      </div>
    </div>

    <!-- 1-2: חותם שנשאר לדורות -->
    <div class="card a1">
      <img src="assets/still1_real.jpg" alt="still1" />
      <div class="label">
        <p class="title">חותם שנשאר לדורות</p>
        <p class="sub">שהנכדים ידעו</p>
      </div>
    </div>

    <!-- 3: להעביר מורשת -->
    <div class="card a2">
      <video src="assets/faith2.mp4" muted autoplay loop playsinline></video>
      <div class="label">
        <p class="title">להעביר מורשת</p>
        <p class="sub">מדור לדור</p>
      </div>
    </div>

    <!-- 4-5: שרשרת הדורות -->
    <div class="card a3">
      <img src="assets/still2_real.jpg" alt="still2" />
      <div class="label">
        <p class="title">שרשרת הדורות</p>
        <p class="sub">סבא ונכד</p>
      </div>
    </div>

    <!-- 6: מסירות נפש -->
    <div class="card a4">
      <video src="assets/faith3.mp4" muted autoplay loop playsinline></video>
      <div class="label">
        <p class="title">מסירות נפש</p>
        <p class="sub">רגע שמתחבר</p>
      </div>
    </div>

    <!-- 7-8: כי הם חיינו -->
    <div class="card a5">
      <img src="assets/still3_real.jpg" alt="still3" />
      <div class="label">
        <p class="title">כי הם חיינו</p>
        <p class="sub">להמחיש את מתיקות התורה</p>
      </div>
    </div>

    <!-- 9: שבת -->
    <div class="card a6">
      <video src="assets/faith4.mp4" muted autoplay loop playsinline></video>
      <div class="label">
        <p class="title">שבת</p>
        <p class="sub">עונג, רוגע, שלווה</p>
      </div>
    </div>

    <!-- 10-11: תפילין -->
    <div class="card a7">
      <img src="assets/still4_real.jpg" alt="still4" />
      <div class="label">
        <p class="title">תפילין</p>
        <p class="sub">האות שמחבר</p>
      </div>
    </div>

    <!-- מרכז -->
    <div class="hub">
      <svg class="ringText" viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <path id="circlePath" d="M100,100 m-78,0 a78,78 0 1,1 156,0 a78,78 0 1,1 -156,0"/>
        </defs>
        <text>
          <textPath href="#circlePath" startOffset="50%" text-anchor="middle">
            זיכרון אבות • משפחה • חותם שנשאר לדורות • להעביר מורשת • מסירות נפש • מתיקות התורה • שבת • תפילין •
          </textPath>
        </text>
      </svg>

      <div class="hubInner" id="pressBtn" title="התחל">
        <div class="btnWrap">
          <div class="icon">👆</div>
          <div class="txt">התחל</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // אם autoplay נחסם – הפעלה בלחיצה
    document.getElementById('pressBtn').addEventListener('click', () => {
      document.querySelectorAll('video').forEach(v => {
        v.muted = true;
        const p = v.play();
        if (p && p.catch) p.catch(()=>{});
      });
    });
  </script>
</body>
</html>
