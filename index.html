<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>hotam.vip</title>

  <style>
    :root{
      /* ====== כוונון מהיר ====== */
      --shift-x: 10px;
      --shift-y: 0px;

      --disc-size: clamp(560px, 86vmin, 940px);

      /* רדיוס המיקום של הכרטיסים */
      --ring-radius: clamp(230px, 33vmin, 360px);

      /* גודל כרטיס */
      --slot-w: clamp(190px, 22vmin, 260px);
      --slot-h: clamp(112px, 13vmin, 150px);
      --slot-radius: 18px;

      /* מרכז DVD */
      --hub-size: clamp(92px, 12vmin, 140px); /* עיגול "לחץ" */
      --hub-ring: clamp(165px, 22vmin, 240px); /* רדיוס הטקסט המעגלי */

      --bg: #efe7db;
      --disc: #070707;

      --shadow: 0 18px 45px rgba(0,0,0,0.35);
      --soft: 0 10px 25px rgba(0,0,0,0.25);
      --font: system-ui, -apple-system, "Segoe UI", Arial, "Heebo", "Rubik", sans-serif;
    }

    /* מובייל */
    @media (max-width: 720px){
      :root{
        --shift-x: 0px;
        --shift-y: 0px;
        --disc-size: 94vmin;
        --ring-radius: clamp(165px, 31vmin, 260px);
        --slot-w: clamp(150px, 44vw, 190px);
        --slot-h: clamp(92px, 26vw, 120px);
        --hub-size: clamp(84px, 16vmin, 120px);
        --hub-ring: clamp(145px, 26vmin, 210px);
      }
    }

    html,body{height:100%;}
    body{
      margin:0;
      font-family: var(--font);
      background: radial-gradient(1200px 700px at 50% 35%, #fff6ea 0%, var(--bg) 55%, #e8ddcf 100%);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    .stage{
      width:100vw;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 18px;
      box-sizing:border-box;
    }

    .disc-wrap{
      position:relative;
      width: var(--disc-size);
      height: var(--disc-size);
      transform: translate(var(--shift-x), var(--shift-y));
    }

    /* הדיסק עצמו */
    .disc{
      position:absolute;
      inset:0;
      border-radius:50%;
      background:
        repeating-radial-gradient(circle at 50% 50%, var(--disc) 0 6px, rgba(255,255,255,0.02) 6px 7px),
        radial-gradient(circle at 50% 50%, #111 0%, #050505 60%, #000 100%);
      box-shadow: var(--shadow);
    }

    /* ====== הקסם: קליפ עגול שמכניס הכל "לתוך הדיסק" ====== */
    .disc-clip{
      position:absolute;
      inset:0;
      border-radius:50%;
      overflow:hidden;              /* <- זה גורם לכך ששום דבר לא יוצא החוצה */
      pointer-events:none;          /* שלא יתפוס קליקים */
    }
    /* אבל כדי שעדיין נוכל ללחוץ על כרטיסים/כפתור מרכז – נחזיר קליקים פנימה */
    .disc-clip > *{ pointer-events:auto; }

    /* Slots */
    .slot{
      position:absolute;
      left:50%;
      top:50%;
      width: var(--slot-w);
      height: var(--slot-h);
      transform:
        translate(-50%,-50%)
        rotate(var(--a))
        translateX(var(--ring-radius))
        rotate(calc(var(--a) * -1));
      border-radius: var(--slot-radius);
      overflow:hidden;
      background: rgba(255,255,255,0.06);
      box-shadow: var(--soft);
      outline: 1px solid rgba(255,255,255,0.08);
    }

    .media{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
      transform: scale(1.01);
    }

    .slot::before{
      content:"";
      position:absolute;
      inset:0;
      background: linear-gradient(180deg, rgba(0,0,0,0.18) 0%, rgba(0,0,0,0.02) 45%, rgba(0,0,0,0.62) 100%);
      pointer-events:none;
      z-index: 2;
    }

    .label{
      position:absolute;
      right: 12px;
      left: 12px;
      bottom: 10px;
      z-index: 3;
      color:#fff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.55);
    }
    .label .h{ font-weight: 800; font-size: 14px; margin:0; line-height: 1.1; }
    .label .p{ margin: 4px 0 0; font-size: 12px; opacity: 0.9; line-height: 1.2; }

    .fallback{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background: rgba(0,0,0,0.55);
      color: rgba(255,255,255,0.9);
      font-size: 12px;
      z-index: 5;
      padding: 10px;
      text-align:center;
    }

    /* ====== מרכז כמו DVD + טקסט מסביב ====== */
    .hub{
      position:absolute;
      left:50%;
      top:50%;
      width: var(--hub-size);
      height: var(--hub-size);
      transform: translate(-50%,-50%);
      border-radius:50%;
      background:
        radial-gradient(circle at 35% 30%, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0.16) 40%, rgba(255,255,255,0.08) 100%);
      outline: 1px solid rgba(255,255,255,0.22);
      box-shadow: 0 10px 24px rgba(0,0,0,0.25);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      user-select:none;
    }
    .hub span{
      color: rgba(255,255,255,0.92);
      font-weight: 900;
      letter-spacing: 0.5px;
      font-size: clamp(14px, 1.8vmin, 18px);
      text-shadow: 0 2px 10px rgba(0,0,0,0.55);
    }

    .ring-text{
      position:absolute;
      left:50%;
      top:50%;
      transform: translate(-50%,-50%);
      width: calc(var(--hub-ring) * 2);
      height: calc(var(--hub-ring) * 2);
      pointer-events:none;
      opacity: 0.95;
    }

    .ring-text text{
      fill: rgba(255,255,255,0.92);
      font-weight: 800;
      font-size: 14px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }

    .ring-sub text{
      fill: rgba(255,255,255,0.75);
      font-weight: 700;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div class="stage">
    <div class="disc-wrap">
      <div class="disc"></div>

      <!-- הכל בפנים: הכרטיסים + מרכז -->
      <div class="disc-clip">
        <div id="slotsRoot"></div>

        <!-- טקסט מעגלי סביב המרכז -->
        <svg class="ring-text" viewBox="0 0 400 400" aria-hidden="true">
          <defs>
            <path id="circlePath1" d="M200,200 m-150,0 a150,150 0 1,1 300,0 a150,150 0 1,1 -300,0" />
            <path id="circlePath2" d="M200,200 m-115,0 a115,115 0 1,1 230,0 a115,115 0 1,1 -230,0" />
          </defs>

          <text>
            <textPath href="#circlePath1" startOffset="50%" text-anchor="middle">
              חותם שנשאר לדורות
            </textPath>
          </text>

          <g class="ring-sub">
            <text>
              <textPath href="#circlePath2" startOffset="50%" text-anchor="middle">
                זכרונות ערכיים • אמונה • משפחה • זיכרון
              </textPath>
            </text>
          </g>
        </svg>

        <!-- מרכז DVD -->
        <div class="hub" onclick="alert('כאן יגיע השאלון/המשך');" title="לחץ להתחלה">
          <span>לחץ</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const ASSET_BASE = "./assets/";

    // שמות הקבצים לפי הריפו שלך
    const items = [
      { type: "video", src: "faith1.mp4", title: "אמונה", sub: "רגע קטן מאיר" },
      { type: "video", src: "faith2.mp4", title: "בית של פעם", sub: "שבת, אור ושקט" },
      { type: "video", src: "faith3.mp4", title: "לימוד", sub: "דף ועוד דף" },
      { type: "video", src: "faith4.mp4", title: "שבת", sub: "אור בבית" },

      { type: "image", src: "still1_real.jpg", title: "זיכרון חי", sub: "שלא הולך לאיבוד" },
      { type: "image", src: "still2_real.jpg", title: "משפחה", sub: "מכתב שנשמר" },
      { type: "image", src: "still3_real.jpg", title: "לב", sub: "רגע שמחבר" },
      { type: "image", src: "still4_real.jpg", title: "חותם", sub: "שנשאר לדורות" },
    ];

    // 8 נקודות סביב הדיסק (יציב)
    const angles = [270, 315, 0, 45, 90, 135, 180, 225];

    const slotsRoot = document.getElementById("slotsRoot");

    function makeSlot(item, angleDeg){
      const slot = document.createElement("div");
      slot.className = "slot";
      slot.style.setProperty("--a", angleDeg + "deg");

      const label = document.createElement("div");
      label.className = "label";
      label.innerHTML = `
        <p class="h">${escapeHtml(item.title || "")}</p>
        <p class="p">${escapeHtml(item.sub || "")}</p>
      `;

      const fullSrc = ASSET_BASE + item.src;

      if(item.type === "video"){
        const v = document.createElement("video");
        v.className = "media";
        v.src = fullSrc;
        v.muted = true;
        v.loop = true;
        v.playsInline = true;
        v.autoplay = true;
        v.preload = "metadata";

        v.addEventListener("canplay", () => {
          const p = v.play();
          if (p && typeof p.catch === "function") p.catch(() => {});
        });
        v.addEventListener("error", () => showFallback(slot, "וידאו לא נטען (בדוק שם/סיומת)"));
        slot.appendChild(v);
      } else {
        const img = document.createElement("img");
        img.className = "media";
        img.src = fullSrc;
        img.alt = item.title || "תמונה";
        img.loading = "lazy";
        img.decoding = "async";
        img.addEventListener("error", () => showFallback(slot, "תמונה לא נטענה (בדוק שם/סיומת)"));
        slot.appendChild(img);
      }

      slot.appendChild(label);
      return slot;
    }

    function showFallback(slot, text){
      if (slot.querySelector(".fallback")) return;
      const fb = document.createElement("div");
      fb.className = "fallback";
      fb.textContent = text;
      slot.appendChild(fb);
    }

    function escapeHtml(str){
      return String(str).replace(/[&<>"']/g, s => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[s]));
    }

    items.slice(0, 8).forEach((item, i) => {
      slotsRoot.appendChild(makeSlot(item, angles[i] ?? i*45));
    });
  </script>
</body>
</html>
