<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>hotam.vip</title>

  <style>
    :root{
      --bg: #efe7db;

      /* דיסק */
      --disc-size: clamp(560px, 86vmin, 940px);
      --disc: #070707;
      --shadow: 0 18px 45px rgba(0,0,0,0.35);

      /* טבעת הכרטיסים */
      --ring-radius: clamp(240px, 33vmin, 360px); /* בסיס */
      --depth-radius: 26px;     /* כמה “קדימה/אחורה” ברדיוס */
      --depth-scale: 0.28;      /* כמה שינוי גודל בין אחורה לקדימה */
      --depth-lift: 14px;       /* הרמה/הורדה עדינה לתלת־ממד */

      /* כרטיס */
      --slot-w: clamp(190px, 22vmin, 260px);
      --slot-h: clamp(112px, 13vmin, 150px);
      --slot-radius: 18px;

      /* מרכז תלת־ממד */
      --center-main-w: clamp(240px, 34vmin, 360px);
      --center-main-h: clamp(160px, 22vmin, 240px);
      --center-mini-w: clamp(160px, 22vmin, 240px);
      --center-mini-h: clamp(46px, 6vmin, 64px);

      --font: system-ui, -apple-system, "Segoe UI", Arial, "Heebo", "Rubik", sans-serif;
    }

    @media (max-width: 720px){
      :root{
        --disc-size: 94vmin;
        --ring-radius: clamp(175px, 31vmin, 265px);
        --slot-w: clamp(150px, 44vw, 190px);
        --slot-h: clamp(92px, 26vw, 120px);

        --depth-radius: 18px;
        --depth-scale: 0.22;
        --depth-lift: 10px;

        --center-main-w: clamp(220px, 70vw, 320px);
        --center-main-h: clamp(150px, 42vw, 210px);
      }
    }

    html,body{height:100%;}
    body{
      margin:0;
      font-family: var(--font);
      background: radial-gradient(1200px 700px at 50% 35%, #fff6ea 0%, var(--bg) 55%, #e8ddcf 100%);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    .stage{
      width:100vw;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 18px;
      box-sizing:border-box;
    }

    .disc-wrap{
      position:relative;
      width: var(--disc-size);
      height: var(--disc-size);
    }

    .disc{
      position:absolute;
      inset:0;
      border-radius:50%;
      background:
        repeating-radial-gradient(circle at 50% 50%, var(--disc) 0 6px, rgba(255,255,255,0.02) 6px 7px),
        radial-gradient(circle at 50% 50%, #111 0%, #050505 60%, #000 100%);
      box-shadow: var(--shadow);
    }

    /* הכל נשאר בתוך הדיסק */
    .clip{
      position:absolute;
      inset:0;
      border-radius:50%;
      overflow:hidden;
      pointer-events:none;
    }
    .clip > *{ pointer-events:auto; }

    /* כרטיס */
    .slot{
      position:absolute;
      left:50%;
      top:50%;
      width: var(--slot-w);
      height: var(--slot-h);
      border-radius: var(--slot-radius);
      overflow:hidden;
      background: rgba(255,255,255,0.06);
      outline: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 14px 28px rgba(0,0,0,0.28);
      transform:
        translate(-50%,-50%)
        rotate(var(--a))
        translateX(calc(var(--ring-radius) + var(--dr)))
        rotate(calc(var(--a) * -1))
        translateY(var(--dy))
        scale(var(--s));
      z-index: var(--z);
      will-change: transform;
    }

    .media{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
      transform: scale(1.01);
    }

    .slot::before{
      content:"";
      position:absolute;
      inset:0;
      background: linear-gradient(180deg, rgba(0,0,0,0.16) 0%, rgba(0,0,0,0.03) 45%, rgba(0,0,0,0.62) 100%);
      pointer-events:none;
      z-index: 2;
    }

    .label{
      position:absolute;
      right: 12px;
      left: 12px;
      bottom: 10px;
      z-index: 3;
      color:#fff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.55);
    }
    .label .h{ font-weight: 900; font-size: 14px; margin:0; line-height: 1.1; }
    .label .p{ margin: 4px 0 0; font-size: 12px; opacity: 0.9; line-height: 1.2; }

    .fallback{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background: rgba(0,0,0,0.55);
      color: rgba(255,255,255,0.9);
      font-size: 12px;
      z-index: 5;
      padding: 10px;
      text-align:center;
    }

    /* מרכז תלת־ממד */
    .center{
      position:absolute;
      left:50%;
      top:50%;
      transform: translate(-50%,-50%);
      display:grid;
      place-items:center;
      gap: 12px;
      z-index: 999;
      pointer-events:auto;
    }

    .center-main{
      width: var(--center-main-w);
      height: var(--center-main-h);
      border-radius: 26px;
      background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.22), rgba(255,255,255,0.08));
      outline: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 22px 48px rgba(0,0,0,0.35);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding: 18px;
      box-sizing:border-box;
      backdrop-filter: blur(6px);
    }

    .center-main h1{
      margin:0;
      color:#fff;
      font-size: clamp(20px, 2.8vmin, 30px);
      font-weight: 1000;
      letter-spacing: .3px;
      text-shadow: 0 8px 24px rgba(0,0,0,0.65);
      text-align:center;
      line-height:1.15;
    }

    .center-main p{
      margin: 10px 0 0;
      color: rgba(255,255,255,0.85);
      font-weight: 700;
      font-size: clamp(12px, 1.6vmin, 14px);
      text-align:center;
    }

    .center-mini{
      width: var(--center-mini-w);
      height: var(--center-mini-h);
      border-radius: 999px;
      background: rgba(160,160,160,0.22);
      outline: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 14px 28px rgba(0,0,0,0.30);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      user-select:none;
    }
    .center-mini span{
      color:#fff;
      font-weight: 1000;
      font-size: clamp(14px, 1.9vmin, 18px);
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }
  </style>
</head>

<body>
  <div class="stage">
    <div class="disc-wrap">
      <div class="disc"></div>

      <div class="clip">
        <div id="slotsRoot"></div>

        <div class="center">
          <div class="center-main">
            <!-- “חצי מעל חצי מתחת” = שתי שורות, זה נותן תחושת תלת-ממד -->
            <h1>חותם שנשאר<br>לדורות</h1>
            <p>זכרונות ערכיים • אמונה • משפחה • זיכרון</p>
          </div>

          <div class="center-mini" onclick="alert('כאן יתחיל שאלון/תהליך');" title="לחץ">
            <span>לחץ</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const ASSET_BASE = "./assets/";

    // ======= סדר הכרטיסים =======
    const items = [
      { type: "video", src: "faith1.mp4", title: "אמונה", sub: "רגע קטן מאיר" },
      { type: "video", src: "faith2.mp4", title: "בית של פעם", sub: "שבת, אור ושקט" },
      { type: "video", src: "faith3.mp4", title: "לימוד", sub: "דף ועוד דף" },
      { type: "video", src: "faith4.mp4", title: "שבת", sub: "אור בבית" },

      { type: "image", src: "still1_real.jpg", title: "זיכרון חי", sub: "שלא הולך לאיבוד" },
      { type: "image", src: "still2_real.jpg", title: "משפחה", sub: "מכתב שנשמר" },
      { type: "image", src: "still3_real.jpg", title: "לב", sub: "רגע שמחבר" },
      { type: "image", src: "still4_real.jpg", title: "חותם", sub: "שנשאר לדורות" },
    ];

    // ======= "שעון" שווה שווה =======
    // 8 מקומות -> כל 45 מעלות. START_ANGLE קובע איפה יושב “פריט 1”.
    // אצלנו: 270 = למעלה. 0 = ימין. 90 = למטה. 180 = שמאל.
    const COUNT = 8;
    const STEP = 360 / COUNT;
    const START_ANGLE = 270; // שנה ל-315/0/45 אם אתה רוצה סיבוב

    // ======= תלת-ממד אוטומטי =======
    // עומק לפי סינוס: למטה גדול יותר (קדימה), למעלה קטן יותר (אחורה)
    // אפשר גם "בוסט" ידני לפריטים מסוימים (למשל 0 ו-1)
    const manualBoost = {
      0: 0.08,  // הפריט הראשון יותר גדול
      1: 0.05   // השני גם יותר גדול
    };

    const slotsRoot = document.getElementById("slotsRoot");

    function makeSlot(item, angleDeg, index){
      const slot = document.createElement("div");
      slot.className = "slot";
      slot.style.setProperty("--a", angleDeg + "deg");

      // depth: bottom(90deg)=+1, top(270deg)=-1
      const rad = angleDeg * Math.PI / 180;
      const depth = Math.sin(rad);

      const depthRadius = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--depth-radius")) || 26;
      const depthScale  = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--depth-scale"))  || 0.28;
      const depthLift   = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--depth-lift"))   || 14;

      const t = (depth + 1) / 2; // 0..1
      let scale = 0.86 + depthScale * t; // top קטן, bottom גדול
      scale += (manualBoost[index] || 0);

      const dr = (depthRadius * depth);      // bottom יוצא טיפה החוצה, top נכנס טיפה פנימה
      const dy = (depthLift * depth) + "px"; // bottom ירד טיפה, top עלה טיפה
      const z  = Math.round(100 + 120 * t);  // bottom מעל כולם

      slot.style.setProperty("--s", scale.toFixed(3));
      slot.style.setProperty("--dr", dr.toFixed(1) + "px");
      slot.style.setProperty("--dy", dy);
      slot.style.setProperty("--z", z);

      const label = document.createElement("div");
      label.className = "label";
      label.innerHTML = `
        <p class="h">${escapeHtml(item.title || "")}</p>
        <p class="p">${escapeHtml(item.sub || "")}</p>
      `;

      const fullSrc = ASSET_BASE + item.src;

      if(item.type === "video"){
        const v = document.createElement("video");
        v.className = "media";
        v.src = fullSrc;
        v.muted = true;
        v.loop = true;
        v.playsInline = true;
        v.autoplay = true;
        v.preload = "metadata";

        v.addEventListener("canplay", () => {
          const p = v.play();
          if (p && typeof p.catch === "function") p.catch(() => {});
        });
        v.addEventListener("error", () => showFallback(slot, "וידאו לא נטען (בדוק שם/סיומת)"));
        slot.appendChild(v);
      } else {
        const img = document.createElement("img");
        img.className = "media";
        img.src = fullSrc;
        img.alt = item.title || "תמונה";
        img.loading = "lazy";
        img.decoding = "async";
        img.addEventListener("error", () => showFallback(slot, "תמונה לא נטענה (בדוק שם/סיומת)"));
        slot.appendChild(img);
      }

      slot.appendChild(label);
      return slot;
    }

    function showFallback(slot, text){
      if (slot.querySelector(".fallback")) return;
      const fb = document.createElement("div");
      fb.className = "fallback";
      fb.textContent = text;
      slot.appendChild(fb);
    }

    function escapeHtml(str){
      return String(str).replace(/[&<>"']/g, s => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[s]));
    }

    // בנייה
    for(let i=0; i<COUNT; i++){
      const angle = (START_ANGLE + i*STEP) % 360;
      slotsRoot.appendChild(makeSlot(items[i], angle, i));
    }
  </script>
</body>
</html>
