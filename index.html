<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hotam.vip</title>
  <style>
    :root{
      --bg: #efe7dc;
      --disc: #0f0f10;
      --disc2: #101012;
      --ringText: rgba(255,255,255,.72);
      --ringTextGlow: rgba(255,255,255,.18);
      --centerOuter: rgba(255,255,255,.88);
      --centerInner: rgba(120,120,120,.35);
      --btn: rgba(255,255,255,.10);
      --btnHover: rgba(255,255,255,.18);
      --shadow: 0 22px 55px rgba(0,0,0,.35);
    }

    *{ box-sizing: border-box; }
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background: radial-gradient(1200px 800px at 50% 30%, #fff6ea 0%, var(--bg) 55%, #e6ddcf 100%);
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      color:#111;
    }

    .stage{
      width:min(980px, 92vw);
      aspect-ratio: 1 / 1;
      position:relative;
      display:grid;
      place-items:center;
    }

    /* הדיסק */
    .disc{
      width:100%;
      height:100%;
      border-radius:50%;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.06) 0 18%, transparent 18% 100%),
        repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.06) 0 2px, rgba(255,255,255,.00) 2px 8px),
        radial-gradient(circle at 50% 50%, var(--disc) 0%, var(--disc2) 70%, #070708 100%);
      box-shadow: var(--shadow);
      position:relative;
      overflow:hidden;
    }

    /* טבעת הטקסט המסתובבת */
    .ring{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      pointer-events:none;
    }

    .ring svg{
      width:52%;
      height:52%;
      overflow:visible;
      filter: drop-shadow(0 1px 0 var(--ringTextGlow));
    }

    /* כאן האנימציה */
    .ring-spin{
      transform-origin: 50% 50%;
      animation: spin 12s linear infinite;
    }
    /* אם תרצה הפוך כיוון – החלף ל: spinReverse */
    .ring-spin.reverse{
      animation: spinReverse 12s linear infinite;
    }

    @keyframes spin{
      from{ transform: rotate(0deg); }
      to{ transform: rotate(360deg); }
    }
    @keyframes spinReverse{
      from{ transform: rotate(360deg); }
      to{ transform: rotate(0deg); }
    }

    /* מרכז הדיסק */
    .center{
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      width:34%;
      aspect-ratio:1/1;
      border-radius:50%;
      background: radial-gradient(circle at 50% 45%, #ffffff 0 45%, rgba(255,255,255,.78) 45% 70%, rgba(255,255,255,.0) 70% 100%);
      display:grid;
      place-items:center;
      box-shadow: 0 10px 30px rgba(0,0,0,.28);
    }

    .center .inner{
      width:42%;
      aspect-ratio:1/1;
      border-radius:50%;
      background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.28), var(--centerInner));
      display:grid;
      place-items:center;
      position:relative;
    }

    /* כפתור התחלה */
    .start{
      border:none;
      cursor:pointer;
      background: var(--btn);
      color: rgba(255,255,255,.92);
      padding:10px 16px;
      border-radius:999px;
      font-weight:700;
      letter-spacing:.2px;
      display:flex;
      align-items:center;
      gap:8px;
      box-shadow: 0 10px 22px rgba(0,0,0,.35);
      transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
      user-select:none;
    }
    .start:hover{
      background: var(--btnHover);
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(0,0,0,.38);
    }
    .start:active{
      transform: translateY(0px) scale(.98);
    }

    .hand{
      font-size:18px;
      line-height:1;
      filter: drop-shadow(0 1px 0 rgba(0,0,0,.25));
    }

    /* תמונות מסביב (דמו/placeholder — תשאיר כפי שיש לך בקוד שלך) */
    .slot{
      position:absolute;
      width: 22%;
      aspect-ratio: 16 / 9;
      border-radius: 14px;
      overflow:hidden;
      box-shadow: 0 18px 30px rgba(0,0,0,.35);
      background: rgba(255,255,255,.06);
      backdrop-filter: blur(2px);
    }
    .slot img, .slot video{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    /* מיקומים כמו שעון (דמו) */
    .p12{ left:50%; top:6.5%; transform:translateX(-50%); }
    .p2 { right:8%; top:18%; }
    .p3 { right:2%; top:41%; }
    .p5 { right:12%; bottom:14%; }
    .p6 { left:50%; bottom:6.5%; transform:translateX(-50%); }
    .p7 { left:12%; bottom:14%; }
    .p9 { left:2%; top:41%; }
    .p10{ left:8%; top:18%; }

    /* רספונסיביות לטלפון — כדי שהמרכז לא יגדל מדי */
    @media (max-width: 640px){
      .stage{ width: 96vw; }
      .center{ width:40%; }
      .ring svg{ width:60%; height:60%; }
      .slot{ width: 28%; border-radius: 12px; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="disc">

      <!-- דמו תמונות/וידאו (תוכל להחליף לנתיבים שלך) -->
      <div class="slot p12"><img src="assets/faith1.mp4" alt="" onerror="this.src='assets/still1_real.jpg'"></div>
      <div class="slot p2"><img src="assets/still2_real.jpg" alt=""></div>
      <div class="slot p3"><img src="assets/faith2.mp4" alt="" onerror="this.src='assets/still3_real.jpg'"></div>
      <div class="slot p5"><img src="assets/still4_real.jpg" alt=""></div>
      <div class="slot p6"><img src="assets/faith3.mp4" alt="" onerror="this.src='assets/still1_real.jpg'"></div>
      <div class="slot p7"><img src="assets/still2_real.jpg" alt=""></div>
      <div class="slot p9"><img src="assets/faith4.mp4" alt="" onerror="this.src='assets/still3_real.jpg'"></div>
      <div class="slot p10"><img src="assets/still4_real.jpg" alt=""></div>

      <!-- טבעת טקסט מסתובבת -->
      <div class="ring" aria-hidden="true">
        <svg viewBox="0 0 300 300">
          <defs>
            <!-- רדיוס הטבעת -->
            <path id="circlePath" d="M150,150 m-108,0 a108,108 0 1,1 216,0 a108,108 0 1,1 -216,0" />
          </defs>

          <!-- הקבוצה מסתובבת, הטקסט עצמו נשאר על המסלול -->
          <g class="ring-spin" id="ringSpin">
            <text fill="var(--ringText)" font-size="16" font-weight="700" letter-spacing="1.2">
              <textPath href="#circlePath" startOffset="50%" text-anchor="middle">
                חותם שנשאר לדורות • מי היו סבא וסבתא? • סיפורי משפחה ומורשת • המחשת סיפורי גבורה ומסירות נפש •
              </textPath>
            </text>
          </g>
        </svg>
      </div>

      <!-- מרכז + כפתור -->
      <div class="center">
        <div class="inner">
          <button class="start" id="startBtn" type="button" title="להתחיל">
            <span class="hand">👆</span>
            <span>התחל</span>
          </button>
        </div>
      </div>

    </div>
  </div>

  <script>
    // יעד הכפתור – שנה לפורום שלך:
    const FORM_URL = "form.html"; // או "https://hotam.vip/form" וכו'
    document.getElementById("startBtn").addEventListener("click", () => {
      window.location.href = FORM_URL;
    });

    // אם תרצה לשלוט במהירות/כיוון בלחיצה (אופציונלי)
    // לדוגמה: Shift+קליק מחליף כיוון
    const ring = document.getElementById("ringSpin");
    document.getElementById("startBtn").addEventListener("click", (e) => {
      if (e.shiftKey) ring.classList.toggle("reverse");
    });
  </script>
</body>
</html>
