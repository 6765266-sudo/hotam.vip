<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>hotam.vip</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap');

    :root{
      --bg:#efe7db;

      /* מהירות סיבוב הטקסט המעגלי (קטן יותר = מהר יותר) */
      --spinDur: 18s;

      /* tiles */
      --tileW: clamp(110px, 13.5vw, 185px);
      --tileH: clamp(64px, 8.6vw, 110px);

      /* טבעת הטקסט */
      --ringSize: clamp(270px, 44vmin, 540px);

      --uiFont: "Heebo","Assistant","Rubik",Arial,sans-serif;
      --sideColor: #444;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100svh;
      background: radial-gradient(1200px 700px at 50% 35%, #f6f0e7 0%, var(--bg) 55%, #e8dfd1 100%);
      font-family: var(--uiFont);
      overflow:hidden;
    }

    .page{
      min-height:100svh;
      display:grid;
      place-items:center;
      padding: 18px;
    }

    /* ====== DESKTOP LAYOUT ====== */
    .frame{
      width: min(98vw, 1400px);
      display:grid;
      grid-template-columns: auto 1fr; /* דיסק + טקסט מימין */
      align-items:center;
      column-gap: clamp(14px, 3vw, 70px);
    }

    /* בלוק טקסט יחיד מימין (דסקטופ בלבד) */
    .rightBlock{
      display:none;
      color: var(--sideColor);
      direction: rtl;
      text-align: right;
      align-self:center;
      max-width: 28vw;
      font-size: clamp(16px, 2.1vw, 28px);
      line-height: 1.15;
      user-select:none;
    }
    .rightBlock .l1,
    .rightBlock .l2{
      white-space: nowrap;         /* בדיוק שורה אחת לכל שורה */
      overflow: hidden;
      text-overflow: ellipsis;
      display:block;
    }
    .rightBlock .l1{ font-weight: 700; }
    .rightBlock .l2{ font-weight: 400; }

    .stampWord{
      font-weight: 900;
      font-style: italic;
      display:inline-block;
      transform: rotate(5deg);
      transform-origin: center;
    }

    /* ====== MOBILE COPY (למעלה/למטה כמו שעובד עכשיו) ====== */
    .mobile-top,
    .mobile-bottom{
      display:none;
      text-align:center;
      color: var(--sideColor);
      font-family: var(--uiFont);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      user-select:none;
      font-size: clamp(16px, 4.8vw, 22px); /* אותו גודל לשניהם */
      line-height: 1.2;
    }
    .mobile-top{ font-weight: 700; }
    .mobile-bottom{ font-weight: 400; }

    /* ====== STAGE (כמו שהיה) ====== */
    .stage{
      width: min(92vmin, 920px);
      aspect-ratio: 1/1;
      position:relative;
      display:grid;
      place-items:center;
    }

    /* הדיסק */
    .disc{
      position:absolute;
      inset:0;
      border-radius:50%;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.06) 0 34%, rgba(0,0,0,.0) 35% 100%),
        repeating-radial-gradient(circle at 50% 50%,
          rgba(255,255,255,.035) 0 2px,
          rgba(0,0,0,.0) 2px 7px
        ),
        radial-gradient(circle at 50% 50%,
          #141414 0%,
          #0c0c0c 52%,
          #080808 100%
        );
      box-shadow: 0 28px 60px rgba(0,0,0,.25);
      z-index: 1;
    }

    /* tiles */
    .tiles{
      position:absolute;
      inset:0;
      z-index: 4; /* tiles מעל הטקסט העגול בדסקטופ */
      pointer-events:none;
    }
    .tile{
      position:absolute;
      width: var(--tileW);
      height: var(--tileH);
      border-radius: 16px;
      overflow:hidden;
      box-shadow: 0 14px 30px rgba(0,0,0,.35);
      background:#111;
      pointer-events:auto;
    }
    .tile .media{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
    }

    .tile::after{
      content:"";
      position:absolute;
      inset:auto 0 0 0;
      height: 54%;
      background: linear-gradient(to top, rgba(0,0,0,.52), rgba(0,0,0,0));
      pointer-events:none;
    }

    /* טקסט: ימין-למטה, 2 שורות */
    .cap{
      position:absolute;
      right: 10px;
      bottom: 10px;
      left: 10px;
      text-align:right;
      color:#fff;
      text-shadow: 0 2px 10px rgba(0,0,0,.75);
      font-weight: 900;
      line-height: 1.08;
      pointer-events:none;
      direction: rtl;
      unicode-bidi: plaintext;
      font-family: var(--uiFont);
    }
    .cap .t1{
      font-size: clamp(12px, 1.7vmin, 15px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cap .t2{
      margin-top: 4px;
      font-size: clamp(10px, 1.45vmin, 13px);
      font-weight: 800;
      opacity: .95;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ====== טבעת טקסט מסתובבת ====== */
    .ring{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      pointer-events:none;
      z-index: 3; /* בדסקטופ: מתחת ל-tiles כדי לא לעלות על התמונות */
    }
    .ring svg{
      width: var(--ringSize);
      height: var(--ringSize);
      display:block;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,.55));
    }
    .ring-spin{
      transform-origin: 150px 150px;
      animation: spin var(--spinDur) linear infinite;
      will-change: transform;
    }
    @keyframes spin{
      from{ transform: rotate(0deg); }
      to{ transform: rotate(360deg); }
    }

    /* מרכז דיסק */
    .center{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      z-index: 6;
      pointer-events:none;
    }
    .hub{
      width: clamp(175px, 27vmin, 290px);
      height: clamp(175px, 27vmin, 290px);
      border-radius:50%;
      background:
        radial-gradient(circle at 50% 50%,
          rgba(255,255,255,.88) 0%,
          rgba(230,230,230,.92) 35%,
          rgba(200,200,200,.95) 58%,
          rgba(245,245,245,.92) 75%,
          rgba(255,255,255,.85) 100%
        );
      box-shadow:
        inset 0 12px 30px rgba(0,0,0,.22),
        inset 0 -14px 22px rgba(255,255,255,.55);
      display:grid;
      place-items:center;
    }
    .hub-inner{
      width: 64%;
      height: 64%;
      border-radius:50%;
      background:
        radial-gradient(circle at 50% 50%,
          #f5f5f5 0%,
          #e2e2e2 45%,
          #cfcfcf 70%,
          #efefef 100%
        );
      box-shadow:
        inset 0 10px 22px rgba(0,0,0,.18),
        0 10px 26px rgba(0,0,0,.15);
      display:grid;
      place-items:center;
    }

    .start-btn{
      pointer-events:auto;
      width: 44%;
      height: 44%;
      border-radius: 999px;
      border: 0;
      cursor: pointer;
      display:grid;
      place-items:center;
      gap:6px;
      background: radial-gradient(circle at 50% 40%, #f7f7f7 0%, #e7e7e7 58%, #d6d6d6 100%);
      box-shadow:
        inset 0 10px 16px rgba(255,255,255,.9),
        inset 0 -12px 18px rgba(0,0,0,.14),
        0 10px 22px rgba(0,0,0,.18);
      text-decoration:none;
      color:#222;
      transition: transform .15s ease, filter .15s ease;
      font-family: var(--uiFont);
    }
    .start-btn:hover{ filter: brightness(1.06); transform: scale(1.02); }
    .start-btn:active{ transform: scale(.98); filter: brightness(1.03); }
    .hand{ font-size: clamp(18px, 2.2vmin, 24px); line-height: 1; }
    .start-text{ font-weight: 900; font-size: clamp(12px, 1.7vmin, 14px); }

    /* ====== SHOW RIGHT BLOCK (Desktop only) ====== */
    @media (min-width: 900px){
      .rightBlock{ display:block; }
      .mobile-top, .mobile-bottom{ display:none !important; }
    }

    /* ====== MOBILE ====== */
    @media (max-width: 899px){
      body{ overflow:auto; }
      .frame{
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
        row-gap: 10px;
        justify-items:center;
        width: min(96vw, 920px);
      }

      .rightBlock{ display:none !important; }
      .mobile-top, .mobile-bottom{ display:block; }

      :root{
        --tileW: clamp(105px, 34vw, 165px);
        --tileH: clamp(62px, 18vw, 98px);
        --ringSize: clamp(250px, 50vmin, 360px);
      }

      /* מובייל: עיגול נקי בלי "בליטות" */
      .stage{
        transform: scale(0.94);
        transform-origin: center center;
      }

      /* מובייל: הטקסט העגול חייב להיות קריא – מעל התמונות אם צריך */
      .ring{ z-index: 8; }
      .tiles{ z-index: 7; }
    }

    @media (prefers-reduced-motion: reduce){
      .ring-spin{ animation: none; }
    }

    /* iOS Safari: אם יש ג׳יבריש — fallback סטטי (עדיף סטטי תקין) */
    @supports (-webkit-touch-callout: none) {
      .ring-spin{ animation: none !important; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="frame">

      <main class="stage" id="stage">
        <div class="disc" aria-hidden="true"></div>

        <!-- מובייל: כותרת עליונה -->
        <div class="mobile-top">הפעם זה לא עוד אלבום תמונות.</div>

        <!-- טבעת טקסט: מפריד אחד קבוע (" • ") בין כל ביטוי -->
        <div class="ring" aria-hidden="true">
          <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
            <defs>
              <!-- פנימה כדי שלא יעלה על התמונות בדסקטופ -->
              <path id="circlePath"
                    d="M150,150 m-110,0 a110,110 0 1,1 220,0 a110,110 0 1,1 -220,0"/>
            </defs>

            <g class="ring-spin">
              <text
                fill="rgba(255,255,255,0.88)"
                font-size="16"
                font-weight="900"
                letter-spacing="0.3"
                direction="rtl"
                style="unicode-bidi:plaintext; font-family: var(--uiFont); paint-order:stroke; stroke: rgba(0,0,0,0.70); stroke-width:2px;">
                <textPath
                  href="#circlePath" xlink:href="#circlePath"
                  startOffset="50%" text-anchor="middle"
                  lengthAdjust="spacing"
                  textLength="700">
                  חותם שנשאר לדורות • מי היו סבא וסבתא • סיפורי משפחה ומורשת • המחשת גבורה ומסירות נפש • חותם שנשאר לדורות
                </textPath>
              </text>
            </g>
          </svg>
        </div>

        <!-- מרכז דיסק -->
        <div class="center">
          <div class="hub">
            <div class="hub-inner">
              <a class="start-btn" href="form.html" aria-label="התחל">
                <div class="hand">👆</div>
                <div class="start-text">התחל</div>
              </a>
            </div>
          </div>
        </div>

        <!-- 8 tiles -->
        <section class="tiles" id="tiles" aria-label="בחירה">
          <!-- 12 -->
          <article class="tile" data-angle="-90">
            <video class="media" src="assets/faith1.mp4" autoplay muted loop playsinline preload="metadata"></video>
            <div class="cap"><div class="t1">זיכרון אבות</div><div class="t2">שלא יאבד</div></div>
          </article>

          <!-- 1:30 -->
          <article class="tile" data-angle="-45">
            <img class="media" src="assets/still1_real.jpg" alt="" loading="lazy" />
            <div class="cap"><div class="t1">חותם שנשאר לדורות</div><div class="t2">שהנכדים ידעו</div></div>
          </article>

          <!-- 3 -->
          <article class="tile" data-angle="0">
            <video class="media" src="assets/faith2.mp4" autoplay muted loop playsinline preload="metadata"></video>
            <div class="cap"><div class="t1">להעביר מורשת</div><div class="t2">מדור לדור</div></div>
          </article>

          <!-- 4:30 -->
          <article class="tile" data-angle="45">
            <img class="media" src="assets/still3_real.jpg" alt="" loading="lazy" />
            <div class="cap"><div class="t1">מתיקות התורה</div><div class="t2">של סבא</div></div>
          </article>

          <!-- 6 -->
          <article class="tile" data-angle="90">
            <video class="media" src="assets/faith3.mp4" autoplay muted loop playsinline preload="metadata"></video>
            <div class="cap"><div class="t1">המחשת גבורה</div><div class="t2">ומסירות נפש</div></div>
          </article>

          <!-- 7:30 -->
          <article class="tile" data-angle="135">
            <img class="media" src="assets/still2_real.jpg" alt="" loading="lazy" />
            <div class="cap"><div class="t1">מורשת</div><div class="t2">סבא ונכד</div></div>
          </article>

          <!-- 9 -->
          <article class="tile" data-angle="180">
            <video class="media" src="assets/faith4.mp4" autoplay muted loop playsinline preload="metadata"></video>
            <div class="cap"><div class="t1">שבת בבית סבא</div><div class="t2">עונג, שלווה</div></div>
          </article>

          <!-- 10:30 -->
          <article class="tile" data-angle="-135">
            <img class="media" src="assets/still4_real.jpg" alt="" loading="lazy" />
            <div class="cap"><div class="t1">תפילין</div><div class="t2">האות שמחבר</div></div>
          </article>
        </section>

        <!-- מובייל: כותרת תחתונה -->
        <div class="mobile-bottom">
          הפעם זה <span class="stampWord">חותם</span> שנשאר לדורות.
        </div>
      </main>

      <!-- דסקטופ: בלוק אחד בצד ימין בלבד (2 שורות בדיוק) -->
      <aside class="rightBlock" aria-hidden="true">
        <span class="l1">הפעם זה לא עוד אלבום תמונות.</span>
        <span class="l2">הפעם זה <span class="stampWord">חותם</span> שנשאר לדורות.</span>
      </aside>

    </div>
  </div>

  <script>
    // iOS: ודא שהוידאו באמת מתנגן
    window.addEventListener('load', () => {
      document.querySelectorAll('video.media').forEach(v => {
        v.muted = true;
        v.playsInline = true;
        const p = v.play();
        if (p && p.catch) p.catch(()=>{});
      });
      layoutTiles();
    });

    // סימטריה מלאה: אותו רדיוס + 8 נקודות שוות (45°)
    function layoutTiles(){
      const stage = document.getElementById('stage');
      const rect = stage.getBoundingClientRect();
      const cx = rect.width / 2;
      const cy = rect.height / 2;
      const discR = rect.width / 2;

      const tiles = Array.from(document.querySelectorAll('.tile'));
      if (!tiles.length) return;

      // מידות tile בפועל
      const tRect = tiles[0].getBoundingClientRect();
      const tileW = tRect.width;
      const tileH = tRect.height;

      // מרווח ביטחון מהשפה ומהמרכז
      const padOuter = 22;

      // רדיוס מקסימלי כדי לא לצאת מחוץ לדיסק
      const maxSafe = discR - Math.max(tileW, tileH)/2 - padOuter;

      // רדיוס בסיסי (כמו שהיה)
      let r = discR * 0.78;

      // קלמפ בטוח
      r = Math.min(r, maxSafe);
      r = Math.max(r, discR * 0.68);

      tiles.forEach(tile => {
        const angDeg = Number(tile.dataset.angle || 0);
        const a = angDeg * Math.PI / 180;

        const x = cx + r * Math.cos(a) - tileW/2;
        const y = cy + r * Math.sin(a) - tileH/2;

        tile.style.left = `${x}px`;
        tile.style.top  = `${y}px`;
      });
    }

    window.addEventListener('resize', () => requestAnimationFrame(layoutTiles));
  </script>
</body>
</html>
