<!doctype html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>hotam.vip | חותם - מורשת נצחית</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #efe7db; --accent: #7a5a2b; --gold: #c5a059; }
        
        body { 
            margin: 0; background: var(--bg); 
            background-image: url("https://www.transparenttextures.com/patterns/aged-paper.png");
            font-family: 'Assistant', sans-serif; 
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }

        /* עטיפה מרכזית לכל האלמנטים */
        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 650px;
        }

        /* כותרת עוטפת צמודה מאוד */
        .header-arc {
            width: 100%;
            height: 100px;
            margin-bottom: -50px; /* מושך את הכותרת על הדיסק */
            z-index: 100;
        }

        .stage {
            position: relative;
            width: min(90vmin, 580px);
            aspect-ratio: 1/1;
            display: flex; justify-content: center; align-items: center;
        }

        /* גוף הדיסק */
        .disc-body {
            position: absolute; inset: 0;
            background: radial-gradient(circle, #222 0%, #050505 85%, #1a150f 100%);
            border-radius: 50%;
            box-shadow: 0 30px 80px rgba(0,0,0,0.6);
            border: 5px solid #111;
        }

        .disc-body::after {
            content: ""; position: absolute; inset: 0; border-radius: 50%;
            background: repeating-radial-gradient(circle, transparent 0, transparent 2px, rgba(255,255,255,0.02) 3px);
        }

        .gallery { position: absolute; inset: 0; z-index: 5; }

        .item {
            position: absolute;
            width: 22%; height: 16%;
            border-radius: 6px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
            background: #000;
        }

        .item video, .item img { width: 100%; height: 100%; object-fit: cover; }

        /* מיקומים פנימיים - חישוב מחמיר למניעת יציאה מהמסגרת */
        .pos-1 { top: 12%; left: 50%; transform: translateX(-50%); } 
        .pos-2 { top: 24%; right: 15%; } 
        .pos-3 { top: 50%; right: 12%; transform: translateY(-50%); } 
        .pos-4 { bottom: 24%; right: 15%; } 
        .pos-5 { bottom: 12%; left: 50%; transform: translateX(-50%); } 
        .pos-6 { bottom: 24%; left: 15%; } 
        .pos-7 { top: 50%; left: 12%; transform: translateY(-50%); } 
        .pos-8 { top: 24%; left: 15%; } 

        /* מלל מסתובב באמצע */
        .inner-spin {
            position: absolute; width: 44%; height: 44%;
            z-index: 10; animation: rotateRing 40s linear infinite;
        }
        @keyframes rotateRing { to { transform: rotate(360deg); } }

        /* כפתור התחל */
        .hub-btn {
            position: absolute; z-index: 20;
            width: 26%; height: 26%;
            background: radial-gradient(circle, #fff 50%, #eee 100%);
            border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            border: 4px solid #fff;
            text-decoration: none;
            transition: 0.2s;
        }
        .hub-btn:hover { transform: scale(1.05); }
        .hub-btn b { color: #000; font-size: 1.2rem; font-weight: 900; }

        svg { width: 100%; height: 100%; overflow: visible; }
        .curved-title { fill: #1a1a1a; font-size: 20px; font-weight: 800; }
        .accent-txt { fill: var(--accent); }
        .inner-txt { fill: rgba(255,255,255,0.85); font-size: 13px; font-weight: 700; }

        @media (max-width: 600px) {
            .header-arc { height: 80px; margin-bottom: -35px; }
            .curved-title { font-size: 16px; }
            .stage { width: 95vw; height: 95vw; }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="header-arc">
            <svg viewBox="0 0 500 100">
                <path id="curvePath" d="M 40,100 A 210,100 0 0,1 460,100" fill="none" />
                <text class="curved-title">
                    <textPath href="#curvePath" startOffset="50%" text-anchor="middle">
                        הפעם זה לא עוד אלבום תמונות. הפעם זה <tspan class="accent-txt">חותם</tspan> שנשאר לדורות.
                    </textPath>
                </text>
            </svg>
        </div>

        <div class="stage">
            <div class="disc-body"></div>
            
            <div class="gallery">
                <div class="item pos-1"><video autoplay muted loop playsinline><source src="faith1.mp4" type="video/mp4"></video></div>
                <div class="item pos-2"><img src="still1_real.jpg"></div>
                <div class="item pos-3"><img src="still3_real.jpg"></div>
                <div class="item pos-4"><video autoplay muted loop playsinline><source src="faith2.mp4" type="video/mp4"></video></div>
                <div class="item pos-5"><video autoplay muted loop playsinline><source src="faith3.mp4" type="video/mp4"></video></div>
                <div class="item pos-6"><img src="still2_real.jpg"></div>
                <div class="item pos-7"><video autoplay muted loop playsinline><source src="faith4.mp4" type="video/mp4"></video></div>
                <div class="item pos-8"><img src="still4_real.jpg"></div>
            </div>

            <div class="inner-spin">
                <svg viewBox="0 0 200 200">
                    <path id="innerCircle" d="M 100, 100 m -78, 0 a 78,78 0 1,1 156,0 a 78,78 0 1,1 -156,0" fill="none"/>
                    <text class="inner-txt">
                        <textPath href="#innerCircle">
                             • סיפורי משפחה ומורשת • חותם שנשאר לדורות • זיכרון אבות שלא יאבד •
                        </textPath>
                    </text>
                </svg>
            </div>

            <a href="https://hotam.vip/forum" class="hub-btn">
                <b>התחל</b>
                <span style="font-size: 1.2rem;">📜</span>
            </a>
        </div>
    </div>

</body>
</html>
