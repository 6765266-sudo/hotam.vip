<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>חותם שנשאר לדורות</title>

<style>
body{
  margin:0;
  background:#f3ecdf;
  font-family: Heebo, Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.disk{
  position:relative;
  width:720px;
  height:720px;
  border-radius:50%;
  background:radial-gradient(circle,#111,#000);
  box-shadow:0 25px 60px rgba(0,0,0,.35);
}

/* ===== מרכז ===== */
.center{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:5;
}

.center-btn{
  width:72px;
  height:72px;
  border-radius:50%;
  background:rgba(255,255,255,.9);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  cursor:pointer;
  transition:.2s;
}

.center-btn:hover{
  transform:scale(1.06);
  background:#fff;
}

.center-text{
  margin-top:6px;
  font-size:13px;
  color:#eee;
}

/* ===== טקסט מעגלי ===== */
.circle-text{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:rgba(255,255,255,.75);
  font-size:14px;
  letter-spacing:1.2px;
  text-align:center;
  pointer-events:none;
  transform:rotate(-90deg);
}

/* ===== פריטים ===== */
.item{
  position:absolute;
  width:150px;
}

.item img,
.item video{
  width:100%;
  border-radius:14px;
  display:block;
}

/* כיתוב – ימין למטה, בלי רקע */
.item span{
  position:absolute;
  right:6px;
  bottom:6px;
  color:#fff;
  font-size:13px;
  line-height:1.15;
  text-align:right;
  text-shadow:0 2px 10px rgba(0,0,0,.8);
  max-width:90%;
}

.item span small{
  display:block;
  font-size:11px;
  opacity:.9;
}

/* ===== מיקומים (שעון) ===== */
.i1{top:10px;left:50%;transform:translateX(-50%);}
.i2{top:80px;right:40px;}
.i3{top:260px;right:10px;}
.i4{bottom:80px;right:40px;}
.i5{bottom:10px;left:50%;transform:translateX(-50%);}
.i6{bottom:80px;left:40px;}
.i7{top:260px;left:10px;}
.i8{top:80px;left:40px;}

/* ===== מובייל ===== */
@media(max-width:820px){
  .disk{width:95vw;height:95vw;}
  .item{width:120px;}
}
</style>
</head>

<body>

<div class="disk">

  <!-- טקסט מעגלי -->
  <div class="circle-text">
    חותם שנשאר לדורות • מי היו סבא וסבתא • סיפורי משפחה ומורשת • המחשת גבורה ומסירות נפש
  </div>

  <!-- מרכז -->
  <div class="center">
    <div class="center-btn" onclick="location.href='YOUR_FORM_LINK_HERE'">👆</div>
    <div class="center-text">התחלה</div>
  </div>

  <!-- 12 -->
  <div class="item i1">
    <video src="assets/faith1.mp4" muted autoplay loop playsinline></video>
    <span>זיכרון אבות<small>שלא יאבד</small></span>
  </div>

  <!-- 1 -->
  <div class="item i2">
    <img src="assets/still1_real.jpg">
    <span>חותם שנשאר לדורות<small>שהנכדים ידעו</small></span>
  </div>

  <!-- 3 -->
  <div class="item i3">
    <video src="assets/faith2.mp4" muted autoplay loop playsinline></video>
    <span>להעביר מורשת<small>מדור לדור</small></span>
  </div>

  <!-- 4–5 -->
  <div class="item i4">
    <img src="assets/still2_real.jpg">
    <span>שרשרת הדורות<small>סבא ונכד</small></span>
  </div>

  <!-- 6 -->
  <div class="item i5">
    <video src="assets/faith3.mp4" muted autoplay loop playsinline></video>
    <span>מסירות נפש<small>רגע שמתחבר</small></span>
  </div>

  <!-- 7 -->
  <div class="item i6">
    <img src="assets/still3_real.jpg">
    <span>כי הם חיינו<small>להמחיש חוויה</small></span>
  </div>

  <!-- 9 -->
  <div class="item i7">
    <video src="assets/faith4.mp4" muted autoplay loop playsinline></video>
    <span>שבת<small>עונג, רוגע, שלווה</small></span>
  </div>

  <!-- 10–11 -->
  <div class="item i8">
    <img src="assets/still4_real.jpg">
    <span>תפילין<small>האות שמחבר</small></span>
  </div>

</div>

</body>
</html>
