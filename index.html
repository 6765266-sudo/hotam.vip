<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hotam.vip</title>

  <style>
    :root{
      --bg: #efe7dc;

      --discA:#0f0f10;
      --discB:#101012;

      --ringText: rgba(255,255,255,.72);
      --ringGlow: rgba(255,255,255,.18);

      --hubOuter: rgba(255,255,255,.92);
      --hubMid: rgba(255,255,255,.80);
      --hubInner: rgba(120,120,120,.35);
      --hubShadow: 0 10px 30px rgba(0,0,0,.28);

      --btnBorder: rgba(0,0,0,.18);

      --capText: rgba(255,255,255,.95);
      --capShadow: 0 2px 10px rgba(0,0,0,.55);

      --shadow: 0 22px 55px rgba(0,0,0,.35);
    }

    *{ box-sizing: border-box; }
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background: radial-gradient(1200px 800px at 50% 30%, #fff6ea 0%, var(--bg) 55%, #e6ddcf 100%);
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    }

    .stage{
      width:min(980px, 92vw);
      aspect-ratio: 1 / 1;
      position:relative;
      display:grid;
      place-items:center;
    }

    .disc{
      width:100%;
      height:100%;
      border-radius:50%;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.06) 0 18%, transparent 18% 100%),
        repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.06) 0 2px, rgba(255,255,255,.00) 2px 8px),
        radial-gradient(circle at 50% 50%, var(--discA) 0%, var(--discB) 70%, #070708 100%);
      box-shadow: var(--shadow);
      position:relative;
      overflow:hidden;
    }

    /* טבעת טקסט מסתובבת — רק זה מסתובב */
    .ring{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      pointer-events:none;
      z-index: 3;
    }
    .ring svg{
      width:52%;
      height:52%;
      overflow:visible;
      filter: drop-shadow(0 1px 0 var(--ringGlow));
    }
    .ring-spin{
      transform-origin: 50% 50%;
      animation: spin 24s linear infinite; /* <-- מהירות: איטי יותר */
    }
    @keyframes spin{
      from{ transform: rotate(0deg); }
      to{ transform: rotate(360deg); }
    }

    /* מרכז הדיסק */
    .hub{
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      width:34%;
      aspect-ratio:1/1;
      border-radius:50%;
      background:
        radial-gradient(circle at 50% 45%, var(--hubOuter) 0 46%, var(--hubMid) 46% 74%, rgba(255,255,255,0) 74% 100%);
      display:grid;
      place-items:center;
      box-shadow: var(--hubShadow);
      z-index: 4;
    }
    .hub-inner{
      width:46%;
      aspect-ratio:1/1;
      border-radius:50%;
      background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.22), var(--hubInner));
      display:grid;
      place-items:center;
      box-shadow: inset 0 0 0 2px rgba(0,0,0,.08);
    }

    /* כפתור “התחל” עגול (כמו שהיה) */
    .start-circle{
      width:72%;
      aspect-ratio:1/1;
      border-radius:50%;
      border: 2px solid var(--btnBorder);
      background:
        radial-gradient(circle at 50% 35%, rgba(255,255,255,.14), rgba(255,255,255,.02)),
        linear-gradient(180deg, rgba(0,0,0,.26), rgba(0,0,0,.14));
      color: rgba(255,255,255,.92);
      cursor:pointer;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:6px;
      box-shadow:
        0 10px 22px rgba(0,0,0,.28),
        inset 0 0 0 1px rgba(255,255,255,.10);
      transition: transform .15s ease, background .15s ease, color .15s ease, box-shadow .15s ease;
      user-select:none;
      padding:10px;
    }
    .start-circle:hover{
      background:
        radial-gradient(circle at 50% 35%, rgba(255,255,255,.45), rgba(255,255,255,.16)),
        linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.10));
      color: rgba(30,30,30,.92);
      transform: translateY(-1px);
      box-shadow:
        0 14px 28px rgba(0,0,0,.30),
        inset 0 0 0 1px rgba(255,255,255,.18);
    }
    .start-circle:active{ transform: translateY(0) scale(.98); }
    .hand{ font-size:22px; line-height:1; }
    .label{ font-weight:800; font-size:14px; }

    /* קוביות מסביב */
    .slot{
      position:absolute;
      width: 22%;
      aspect-ratio: 16 / 9;
      border-radius: 14px;
      overflow:hidden;
      box-shadow: 0 18px 30px rgba(0,0,0,.35);
      background: rgba(255,255,255,.06);
      z-index: 2;
    }
    .slot img, .slot video{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    /* מלל על המדיה — ימין/למטה, בלי רקע שמסתיר (רק צל עדין) */
    .caption{
      position:absolute;
      right:10px;
      bottom:10px;
      left:10px; /* נותן מקום לשבירה מסודרת */
      display:flex;
      flex-direction:column;
      gap:2px;
      align-items:flex-end;
      text-align:right;
      pointer-events:none;
      color: var(--capText);
      text-shadow: var(--capShadow);
    }
    .cap-title{
      font-weight:900;
      font-size:14px;
      line-height:1.1;
      max-width:100%;
      display:-webkit-box;
      -webkit-line-clamp: 1; /* שורה אחת לכותרת */
      -webkit-box-orient: vertical;
      overflow:hidden;
    }
    .cap-sub{
      font-weight:700;
      font-size:12px;
      line-height:1.15;
      opacity:.95;
      max-width:100%;
      display:-webkit-box;
      -webkit-line-clamp: 1; /* שורה אחת לתת-כותרת */
      -webkit-box-orient: vertical;
      overflow:hidden;
    }

    /* מיקומים כמו שעון */
    .p12{ left:50%; top:6.5%; transform:translateX(-50%); }
    .p2 { right:8%; top:18%; }
    .p3 { right:2%; top:41%; }
    .p5 { right:12%; bottom:14%; }
    .p6 { left:50%; bottom:6.5%; transform:translateX(-50%); }
    .p7 { left:12%; bottom:14%; }
    .p9 { left:2%; top:41%; }
    .p10{ left:8%; top:18%; }

    /* רספונסיביות */
    @media (max-width: 640px){
      .stage{ width:96vw; }
      .hub{ width:40%; }
      .ring svg{ width:60%; height:60%; }
      .slot{ width: 28%; border-radius: 12px; }
      .cap-title{ font-size:13px; }
      .cap-sub{ font-size:11px; }
      .label{ font-size:13px; }
    }
  </style>
</head>

<body>
  <div class="stage">
    <div class="disc">

      <!-- 8 קוביות — שילוב וידאו/תמונות (כמו שהיה) -->

      <!-- 12:00 (וידאו) -->
      <div class="slot p12">
        <video src="assets/faith1.mp4" autoplay muted loop playsinline preload="metadata"></video>
        <div class="caption">
          <div class="cap-title">זיכרון אבות</div>
          <div class="cap-sub">שלא יאבד</div>
        </div>
      </div>

      <!-- 10:00 (תמונה) -->
      <div class="slot p10">
        <img src="assets/still1_real.jpg" alt="">
        <div class="caption">
          <div class="cap-title">תפילין</div>
          <div class="cap-sub">האות שמחבר</div>
        </div>
      </div>

      <!-- 2:00 (תמונה) -->
      <div class="slot p2">
        <img src="assets/still2_real.jpg" alt="">
        <div class="caption">
          <div class="cap-title">חותם שנשאר לדורות</div>
          <div class="cap-sub">שהנכדים ידעו</div>
        </div>
      </div>

      <!-- 3:00 (וידאו) -->
      <div class="slot p3">
        <video src="assets/faith2.mp4" autoplay muted loop playsinline preload="metadata"></video>
        <div class="caption">
          <div class="cap-title">להעביר מורשת</div>
          <div class="cap-sub">מדור לדור</div>
        </div>
      </div>

      <!-- 5:00 (תמונה) -->
      <div class="slot p5">
        <img src="assets/still3_real.jpg" alt="">
        <div class="caption">
          <div class="cap-title">שיירשת לדורות</div>
          <div class="cap-sub">סבא ונכד</div>
        </div>
      </div>

      <!-- 6:00 (וידאו) -->
      <div class="slot p6">
        <video src="assets/faith3.mp4" autoplay muted loop playsinline preload="metadata"></video>
        <div class="caption">
          <div class="cap-title">מסירות נפש</div>
          <div class="cap-sub">רגע שמתחבר</div>
        </div>
      </div>

      <!-- 7:00 (תמונה) -->
      <div class="slot p7">
        <img src="assets/still4_real.jpg" alt="">
        <div class="caption">
          <div class="cap-title">כי הם חיינו</div>
          <div class="cap-sub">להמחיש את החיבור</div>
        </div>
      </div>

      <!-- 9:00 (וידאו - שבת) -->
      <div class="slot p9">
        <video src="assets/faith4.mp4" autoplay muted loop playsinline preload="metadata"></video>
        <div class="caption">
          <div class="cap-title">שבת</div>
          <div class="cap-sub">עונג, רגע, שלווה</div>
        </div>
      </div>

      <!-- טבעת טקסט מסתובבת (רק היא מסתובבת) -->
      <div class="ring" aria-hidden="true">
        <svg viewBox="0 0 300 300">
          <defs>
            <path id="circlePath" d="M150,150 m-108,0 a108,108 0 1,1 216,0 a108,108 0 1,1 -216,0" />
          </defs>
          <g class="ring-spin">
            <text fill="var(--ringText)" font-size="16" font-weight="900" letter-spacing="1.2">
              <textPath href="#circlePath" startOffset="50%" text-anchor="middle">
                חותם שנשאר לדורות • מי היו סבא וסבתא? • סיפורי משפחה ומורשת • המחשת סיפורי גבורה ומסירות נפש •
              </textPath>
            </text>
          </g>
        </svg>
      </div>

      <!-- מרכז + כפתור -->
      <div class="hub">
        <div class="hub-inner">
          <button class="start-circle" id="startBtn" type="button" title="התחל">
            <div class="hand">👆</div>
            <div class="label">התחל</div>
          </button>
        </div>
      </div>

    </div>
  </div>

  <script>
    // יעד הכפתור – תעדכן אם הפורום אצלך בשם אחר
    const FORM_URL = "form.html";

    document.getElementById("startBtn").addEventListener("click", () => {
      window.location.href = FORM_URL;
    });
  </script>
</body>
</html>
