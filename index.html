<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>חותם שנשאר לדורות</title>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #efe8dd;
      --disc: #070707;
      --disc2:#0f0f10;
      --shadow: 0 28px 70px rgba(0,0,0,.35);
      --cardShadow: 0 18px 45px rgba(0,0,0,.45);
      --radius: 0.40; /* יחסי לגודל הדיסק (מיקום הכרטיסים) */
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family:"Heebo", system-ui, -apple-system, Segoe UI, Arial, sans-serif;
      background:
        radial-gradient(1200px 700px at 50% 30%, #faf6ef 0%, var(--bg) 55%, #e7ddcf 100%);
      color:#111;
      overflow-x:hidden;
    }

    .wrap{
      min-height:100svh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: clamp(14px, 3vw, 34px);
    }

    /* דיסק */
    .disc{
      width: clamp(320px, 92vw, 920px);
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      position: relative;
      box-shadow: var(--shadow);
      background:
        /* חריצים */
        repeating-radial-gradient(circle at 50% 50%,
          rgba(255,255,255,.09) 0px,
          rgba(255,255,255,.09) 1px,
          rgba(0,0,0,0) 6px,
          rgba(0,0,0,0) 10px
        ),
        radial-gradient(circle at 45% 35%, rgba(255,255,255,.12), rgba(255,255,255,0) 42%),
        radial-gradient(circle at 60% 65%, rgba(255,255,255,.08), rgba(255,255,255,0) 46%),
        radial-gradient(circle at 50% 50%, var(--disc2) 0%, var(--disc) 68%, #050505 100%);
      overflow: visible;
    }

    /* "שוליים" קצת כמו CD אמיתי */
    .disc:after{
      content:"";
      position:absolute;
      inset:-1.6%;
      border-radius:50%;
      background: radial-gradient(circle at 50% 50%,
        rgba(0,0,0,0) 64%,
        rgba(255,255,255,.06) 74%,
        rgba(0,0,0,0) 78%,
        rgba(0,0,0,.35) 100%
      );
      pointer-events:none;
      filter: blur(.2px);
      opacity:.85;
    }

    /* מרכז לבן */
    .label{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:none;
    }

    .labelInner{
      width: clamp(170px, 30vw, 340px); /* קטן יותר במובייל */
      aspect-ratio: 1/1;
      border-radius:50%;
      background:
        radial-gradient(circle at 50% 45%, #ffffff 0%, #f4f4f4 62%, #e9e9e9 100%);
      box-shadow:
        inset 0 2px 16px rgba(0,0,0,.12),
        0 18px 45px rgba(0,0,0,.22);
      display:flex;
      align-items:center;
      justify-content:center;
      padding: clamp(14px, 2.6vw, 26px);
      position:relative;
    }

    /* חור עדין באמצע כמו דיסק */
    .labelInner:before{
      content:"";
      position:absolute;
      width: clamp(22px, 4.2vw, 42px);
      aspect-ratio:1/1;
      border-radius:50%;
      background:
        radial-gradient(circle at 50% 50%, #bdbdbd 0%, #f7f7f7 45%, #d8d8d8 100%);
      box-shadow: inset 0 2px 10px rgba(0,0,0,.18);
      top:50%;
      left:50%;
      transform: translate(-50%,-50%);
      opacity:.65;
    }

    .labelContent{
      width:100%;
      text-align:center;
      pointer-events:auto; /* כדי שהכפתור יהיה קליק */
      z-index:2;
    }

    h1{
      margin:0 0 10px 0;
      font-weight:800;
      letter-spacing:-.2px;
      font-size: clamp(22px, 3.2vw, 42px);
      line-height:1.05;
    }
    .sub{
      margin:0 0 14px 0;
      font-weight:400;
      color:#333;
      font-size: clamp(12.5px, 1.55vw, 16px);
      line-height:1.5;
    }
    .cta{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      border:0;
      background:#111;
      color:#fff;
      padding: 12px 18px;
      border-radius:999px;
      font-weight:700;
      font-size: clamp(13px, 1.55vw, 15px);
      cursor:pointer;
      box-shadow: 0 12px 30px rgba(0,0,0,.24);
    }
    .cta:active{ transform: translateY(1px); }
    .mini{
      margin-top:10px;
      font-size:12px;
      color:#666;
    }

    /* משבצות */
    .slot{
      position:absolute;
      width: clamp(92px, 20vw, 190px);
      aspect-ratio: 16/10;
      border-radius: 14px;
      overflow:hidden;
      background: rgba(0,0,0,.55);
      box-shadow: var(--cardShadow);
      border: 1px solid rgba(255,255,255,.10);
      transform: translate(-50%, -50%);
    }

    .slot::after{
      content:"";
      position:absolute;
      inset:0;
      background: linear-gradient(to top, rgba(0,0,0,.46), rgba(0,0,0,0) 55%);
      pointer-events:none;
    }

    .slot .media{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
      filter: contrast(1.05) saturate(.95);
    }

    .slot .tag{
      position:absolute;
      right:10px;
      bottom:8px;
      left:10px;
      display:flex;
      flex-direction:column;
      gap:2px;
      z-index:2;
      color:#fff;
      text-shadow: 0 2px 10px rgba(0,0,0,.55);
    }
    .slot .tag b{
      font-size: 14px;
      font-weight:800;
      line-height:1.05;
    }
    .slot .tag span{
      font-size: 12px;
      opacity:.92;
      line-height:1.2;
    }

    /* מובייל – עוד טיפה תיקונים כדי שהמרכז לא יגדל מדי */
    @media (max-width: 520px){
      :root{ --radius: 0.37; } /* מקרב את הכרטיסים, שלא ייחתכו */
      .slot{ border-radius: 12px; }
      .slot .tag b{ font-size: 13px; }
      .slot .tag span{ font-size: 11px; }
      .cta{ padding: 11px 16px; }
    }

    /* נגישות: מי שמעדיף פחות תנועה */
    @media (prefers-reduced-motion: reduce){
      video{ animation:none !important; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="disc" id="disc">
      <!-- 8 slots -->
      <div class="slot" data-angle="0"   data-type="video" data-src="assets/faith1.mp4" data-title="אמונה" data-sub="רגע קטן מאיר"></div>
      <div class="slot" data-angle="45"  data-type="image" data-src="assets/still1.jpg" data-title="משפחה" data-sub="מכתב שנשמר"></div>
      <div class="slot" data-angle="90"  data-type="video" data-src="assets/faith2.mp4" data-title="בית של פעם" data-sub="שבת, אור ושקט"></div>
      <div class="slot" data-angle="135" data-type="image" data-src="assets/still2.jpg" data-title="חותם" data-sub="שנשאר לדורות"></div>
      <div class="slot" data-angle="180" data-type="video" data-src="assets/faith3.mp4" data-title="לימוד" data-sub="דף ועוד דף"></div>
      <div class="slot" data-angle="225" data-type="image" data-src="assets/still3.jpg" data-title="לב" data-sub="רגע שמחבר"></div>
      <div class="slot" data-angle="270" data-type="video" data-src="assets/faith4.mp4" data-title="שבת" data-sub="אור בבית"></div>
      <div class="slot" data-angle="315" data-type="image" data-src="assets/still4.jpg" data-title="זיכרון חי" data-sub="שלא הולך לאיבוד"></div>

      <!-- center label -->
      <div class="label">
        <div class="labelInner">
          <div class="labelContent">
            <h1>חותם שנשאר<br/>לדורות</h1>
            <p class="sub">זיכרונות ערכיים, אמונה, משפחה וזיכרון.</p>
            <button class="cta" onclick="alert('צור קשר – נוסיף כאן בהמשך טופס/וואטסאפ')">להתחיל בשאלון קצר</button>
            <div class="mini">© hotam.vip</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // בונה את הווידאו/תמונה בכל משבצת + מציב סביב הדיסק רספונסיבי
    const disc = document.getElementById('disc');
    const slots = Array.from(disc.querySelectorAll('.slot'));

    function buildMedia(slot){
      const type = slot.dataset.type;
      const src  = slot.dataset.src;

      slot.innerHTML = ""; // נקי

      let el;
      if(type === "video"){
        el = document.createElement("video");
        el.className = "media";
        el.src = src;
        el.autoplay = true;
        el.loop = true;
        el.muted = true;
        el.playsInline = true;
        el.preload = "metadata";
      } else {
        el = document.createElement("img");
        el.className = "media";
        el.src = src;
        el.alt = slot.dataset.title || "";
        el.loading = "lazy";
      }
      slot.appendChild(el);

      const tag = document.createElement("div");
      tag.className = "tag";
      const b = document.createElement("b");
      b.textContent = slot.dataset.title || "";
      const s = document.createElement("span");
      s.textContent = slot.dataset.sub || "";
      tag.appendChild(b);
      tag.appendChild(s);
      slot.appendChild(tag);
    }

    function placeSlots(){
      const rect = disc.getBoundingClientRect();
      const size = Math.min(rect.width, rect.height);
      const centerX = size / 2;
      const centerY = size / 2;

      // רדיוס יחסי + תיקון קטן לפי גודל הכרטיס
      const radiusFactor = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--radius')) || 0.4;

      slots.forEach(slot => {
        const angleDeg = parseFloat(slot.dataset.angle || "0");
        const angle = (angleDeg - 90) * Math.PI / 180; // כדי ש-0 יהיה למעלה
        const slotRect = slot.getBoundingClientRect();
        const slotW = slotRect.width || 140;

        const r = (size * radiusFactor) + (slotW * 0.18);

        const x = centerX + (Math.cos(angle) * r);
        const y = centerY + (Math.sin(angle) * r);

        // בתוך הדיסק: position absolute יחסית לדיסק
        slot.style.left = x + "px";
        slot.style.top  = y + "px";
      });
    }

    // init
    slots.forEach(buildMedia);

    // צריך אחרי שהמדיה נטענה כדי שהמידות יהיו מדויקות יותר
    window.addEventListener("load", () => {
      placeSlots();
      // ניסיון נוסף אחרי רגע (במיוחד במובייל)
      setTimeout(placeSlots, 250);
      setTimeout(placeSlots, 900);
    });

    window.addEventListener("resize", () => {
      placeSlots();
      setTimeout(placeSlots, 200);
    });
  </script>
</body>
</html>
