<!doctype html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>HOTAM VIP | להשאיר חותם שמרגש</title>
    <link rel="icon" type="image/png" href="gold-seal.png">
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;400;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #c5a059; --dark: #0a0a0a; }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; background-color: var(--dark); color: #fff; font-family: 'Assistant', sans-serif; scroll-behavior: smooth; overflow-x: hidden; }
        .hero { height: 100vh; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        .main-seal { width: 280px; max-width: 70%; height: auto; cursor: pointer; transition: 0.6s ease-in-out; filter: drop-shadow(0 0 15px rgba(197,160,89,0.2)); border-radius: 15px; margin: 0 auto 25px auto; }
        .main-seal:hover { transform: scale(1.05); filter: drop-shadow(0 0 40px var(--gold)); }
        .hero-tagline { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.4rem; letter-spacing: 4px; margin: 0; }
        .services { padding: 60px 4%; max-width: 1200px; margin: 0 auto; }
        .section-title { text-align: center; color: var(--gold); font-family: 'Playfair Display', serif; font-size: 1.8rem; margin-bottom: 40px; letter-spacing: 3px; }
        .featured-wrap { width: 100%; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .card { background: rgba(15,15,15,0.8); border: 1px solid #222; position: relative; aspect-ratio: 16/10; overflow: hidden; transition: 0.5s; display: flex; align-items: flex-end; text-decoration: none; cursor: pointer; }
        .card.big { aspect-ratio: 16/7; }
        .card:hover { border-color: var(--gold); transform: translateY(-5px); }
        .card iframe { position: absolute; top: 50%; left: 50%; width: 150%; height: 150%; transform: translate(-50%, -50%); pointer-events: none; opacity: 0.4; }
        .card:hover iframe { opacity: 0.8; }
        .card-label { position: relative; z-index: 2; width: 100%; background: linear-gradient(transparent, rgba(0,0,0,0.9)); padding: 15px 10px; color: var(--gold); font-size: 1rem; font-weight: 700; text-align: center; }
        .card.big .card-label { font-size: 1.4rem; padding: 25px 20px; }
        .cta-area { text-align: center; margin-top: 70px; padding: 0 20px; }
        .cta-title { color: #fff; font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 700; margin: 0 0 20px; letter-spacing: 2px; }
        .cta-sub { color: var(--gold); font-family: 'Assistant', sans-serif; font-size: 1rem; font-weight: 200; margin: 0 0 12px; letter-spacing: 2px; }
        .cta-small { color: #777; font-family: 'Assistant', sans-serif; font-size: 0.95rem; font-weight: 200; margin: 0 0 60px; letter-spacing: 1px; }
        .forum-btn { display: inline-block; padding: 18px 40px; border: 2px solid var(--gold); color: var(--gold); text-decoration: none; font-weight: 800; font-size: 1rem; transition: 0.4s; letter-spacing: 2px; }
        .forum-btn:hover { background: var(--gold); color: #000; }
        .contact-section { text-align: center; padding: 60px 20px 50px; border-top: 1px solid #222; }
        .contact-section p { color: var(--gold); font-family: 'Playfair Display', serif; font-size: 1.3rem; margin-bottom: 15px; letter-spacing: 2px; }
        .contact-section a { color: var(--gold); font-size: 1rem; text-decoration: none; border-bottom: 1px solid var(--gold); padding-bottom: 2px; display: inline-block; margin: 5px 0; }
        .contact-section a:hover { opacity: 0.7; }
        @media (max-width: 650px) {
            .grid { grid-template-columns: 1fr; }
            .main-seal { width: 180px; }
            .hero-tagline { font-size: 1rem; letter-spacing: 2px; }
            .cta-title { font-size: 1.4rem; }
            .card.big { aspect-ratio: 16/9; }
            .section-title { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <section class="hero">
        <img src="gold-seal.png" class="main-seal" alt="HOTAM VIP" onclick="document.getElementById('services-area').scrollIntoView({behavior:'smooth'})">
        <div class="hero-tagline">להמחיש את הרגש. להשאיר חותם.</div>
    </section>
    <section id="services-area" class="services">
        <div class="section-title">סרטי מורשת</div>
        <div id="featured-area" class="featured-wrap"></div>
        <div class="grid" id="videos-grid"></div>
        <div class="cta-area">
            <p class="cta-title">יש סיפור שרק אתה יודע.</p>
            <p class="cta-sub">מנהג שעובר בשושלת. מעשה גבורה שסבא סיפר פעם אחת.</p>
            <p class="cta-small">רגע שאם לא תעשה משהו — יעלם לעולמים.</p>
            <a href="forum.html" class="forum-btn">← רוצים להשאיר חותם?</a>
        </div>
    </section>
    <section class="contact-section">
        <p>צרו קשר</p>
        <a href="mailto:contact@hotam.vip">contact@hotam.vip</a><br>
        <a href="tel:0527687171">052-7687171</a>
    </section>
    <script>
        if ('scrollRestoration' in history) { history.scrollRestoration = 'manual'; }
        window.scrollTo(0, 0);
        fetch('videos.json')
            .then(r => r.json())
            .then(videos => {
                const featured = videos.find(v => v.featured);
                const rest = videos.filter(v => !v.featured);
                if (featured) {
                    document.getElementById('featured-area').innerHTML = `
                        <a href="https://youtu.be/${featured.id}" class="card big" target="_blank">
                            <iframe src="https://www.youtube.com/embed/${featured.id}?autoplay=1&mute=1&loop=1&controls=0&playlist=${featured.id}" frameborder="0" allowfullscreen></iframe>
                            <div class="card-label">${featured.title}</div>
                        </a>`;
                }
                document.getElementById('videos-grid').innerHTML = rest.map(v => `
                    <a href="https://youtu.be/${v.id}" class="card" target="_blank">
                        <iframe src="https://www.youtube.com/embed/${v.id}?autoplay=1&mute=1&loop=1&controls=0&playlist=${v.id}" frameborder="0" allowfullscreen></iframe>
                        <div class="card-label">${v.title}</div>
                    </a>`).join('');
            });
    </script>
</body>
</html>
