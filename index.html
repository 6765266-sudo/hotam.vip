<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>חותם שנשאר לדורות</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI";
      background: #f3ede3;
      color: #111;
    }

    .screen {
      display: none;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .screen.active {
      display: flex;
    }

    /* ===== דיסק ===== */
    .disk {
      position: relative;
      width: min(90vw, 600px);
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background:
        repeating-radial-gradient(
          circle,
          #111 0px,
          #111 2px,
          #000 4px
        );
      box-shadow: 0 30px 80px rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .disk-inner {
      position: absolute;
      width: 35%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: radial-gradient(circle, #fff, #ddd);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .start-btn {
      width: 80%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      border: none;
      background: #fff;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.2);
    }

    .circle-text {
      position: absolute;
      width: 100%;
      height: 100%;
      animation: spin 70s linear infinite;
      pointer-events: none;
    }

    .circle-text span {
      position: absolute;
      left: 50%;
      top: 50%;
      transform-origin: 0 260px;
      font-size: 15px;
      color: #ddd;
      white-space: nowrap;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* ===== דף ביניים ===== */
    .card {
      max-width: 720px;
      background: rgba(255,255,255,0.8);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.15);
      text-align: center;
    }

    .card h1 {
      margin-top: 0;
      font-size: 28px;
    }

    .card p {
      font-size: 18px;
      line-height: 1.5;
      opacity: 0.85;
    }

    .actions {
      margin-top: 24px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 22px;
      border-radius: 999px;
      border: none;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn.primary {
      background: #111;
      color: #fff;
    }

    .btn.ghost {
      background: #fff;
      color: #111;
      border: 1px solid rgba(0,0,0,0.2);
    }
  </style>
</head>

<body>

  <!-- ===== מסך 1: דיסק ===== -->
  <div id="screen-disk" class="screen active">
    <div class="disk">

      <div class="circle-text" id="circleText"></div>

      <div class="disk-inner">
        <button class="start-btn" onclick="goIntro()">התחל</button>
      </div>

    </div>
  </div>

  <!-- ===== מסך 2: דף ביניים ===== -->
  <div id="screen-intro" class="screen">
    <div class="card">
      <h1>רגע לפני שמתחילים</h1>
      <p>
        חשוב לך איך יזכרו אותך?<br>
        מה היית רוצה להשאיר לדורות?<br>
        אם זה נוגע בך – בוא נמשיך.
      </p>

      <div class="actions">
        <button class="btn primary" onclick="goForm()">המשך לטופס</button>
        <button class="btn ghost" onclick="goDisk()">חזרה לדיסק</button>
      </div>
    </div>
  </div>

  <script>
    const text = "חותם שנשאר לדורות • סיפורי משפחה ומורשת • מי היו סבא וסבתא • גבורה ומסירות נפש • ";
    const container = document.getElementById("circleText");
    const radius = 260;
    const chars = text.split("");
    const step = 360 / chars.length;

    chars.forEach((char, i) => {
      const span = document.createElement("span");
      span.textContent = char;
      span.style.transform =
        `rotate(${i * step}deg) translate(${radius}px) rotate(90deg)`;
      container.appendChild(span);
    });

    function goIntro() {
      document.getElementById("screen-disk").classList.remove("active");
      document.getElementById("screen-intro").classList.add("active");
      window.scrollTo(0,0);
    }

    function goDisk() {
      document.getElementById("screen-intro").classList.remove("active");
      document.getElementById("screen-disk").classList.add("active");
      window.scrollTo(0,0);
    }

    function goForm() {
      window.location.href =
        "https://docs.google.com/forms/d/e/1FAIpQLSd5-dHgB40tA5kSOAmLZh6dIbYjM1PRKpRpJyn3c7emd_bekQ/viewform?usp=header";
    }
  </script>

</body>
</html>
