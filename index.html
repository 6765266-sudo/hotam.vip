<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>חותם שנשאר לדורות</title>

  <!-- Fonts (Hebrew-friendly) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&family=Heebo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg1:#f4efe6;
      --bg2:#e8dfd1;
      --ink:#111;
      --card:#0a0a0a;
      --card2:#121212;
      --muted:rgba(255,255,255,.75);
      --muted2:rgba(0,0,0,.55);
      --shadow: 0 22px 60px rgba(0,0,0,.28);
      --slotShadow: 0 16px 40px rgba(0,0,0,.38);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: "Assistant","Heebo",system-ui,Arial;
      background:
        radial-gradient(1200px 800px at 50% 20%, rgba(255,255,255,.9), rgba(255,255,255,0) 60%),
        radial-gradient(900px 700px at 50% 80%, rgba(0,0,0,.06), rgba(0,0,0,0) 60%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      color:var(--ink);
      overflow-x:hidden;
    }

    .wrap{
      min-height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .stage{
      width:min(980px, 92vw);
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      padding:30px 0;
    }

    /* --- CD / Disc --- */
    .disc{
      position:relative;
      width:min(860px, 92vw);
      aspect-ratio:1/1;
      border-radius:50%;
      box-shadow: var(--shadow);
      background:
        radial-gradient(circle at 50% 50%,
          rgba(0,0,0,.0) 0%,
          rgba(0,0,0,.0) 28%,
          rgba(0,0,0,.22) 46%,
          rgba(0,0,0,.35) 66%,
          rgba(0,0,0,.55) 86%,
          rgba(0,0,0,.78) 100%),
        radial-gradient(circle at 50% 50%,
          rgba(255,255,255,.07) 0%,
          rgba(255,255,255,0) 55%),
        #0b0b0b;
      overflow:hidden;
    }

    /* grooves / rings */
    .disc::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:50%;
      background:
        repeating-radial-gradient(circle at 50% 50%,
          rgba(255,255,255,.10) 0px,
          rgba(255,255,255,.10) 1px,
          rgba(0,0,0,0) 6px,
          rgba(0,0,0,0) 10px);
      opacity:.30;
      mix-blend-mode: screen;
      pointer-events:none;
      filter: blur(.2px);
      transform: scale(1.02);
    }

    /* subtle outer lip like CD edge */
    .disc::after{
      content:"";
      position:absolute;
      inset:0;
      border-radius:50%;
      background:
        radial-gradient(circle at 50% 50%,
          rgba(0,0,0,0) 86%,
          rgba(255,255,255,.10) 89%,
          rgba(0,0,0,.65) 100%);
      pointer-events:none;
      opacity:.9;
    }

    /* --- Center label --- */
    .center{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:none;
    }

    .label{
      width: min(360px, 44vw);
      aspect-ratio:1/1;
      border-radius:50%;
      background:
        radial-gradient(circle at 50% 50%,
          rgba(255,255,255,.98) 0%,
          rgba(245,245,245,.98) 58%,
          rgba(230,230,230,.98) 100%);
      box-shadow:
        inset 0 18px 40px rgba(0,0,0,.12),
        0 16px 40px rgba(0,0,0,.22);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      position:relative;
      pointer-events:auto;
    }

    /* inner hole */
    .label::before{
      content:"";
      position:absolute;
      width: clamp(34px, 4.2vw, 52px);
      aspect-ratio:1/1;
      border-radius:50%;
      background:
        radial-gradient(circle at 50% 50%,
          rgba(0,0,0,.65) 0%,
          rgba(0,0,0,.75) 35%,
          rgba(0,0,0,.92) 100%);
      box-shadow:
        inset 0 6px 12px rgba(255,255,255,.10),
        0 8px 18px rgba(0,0,0,.25);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity:.85;
    }

    .labelContent{
      text-align:center;
      max-width: 90%;
      z-index:2;
    }

    .label h1{
      margin:0 0 10px;
      font-size: clamp(22px, 3.2vw, 36px);
      line-height:1.05;
      letter-spacing:.2px;
      font-weight:800;
    }
    .label p{
      margin:0 0 16px;
      font-size: clamp(13px, 1.55vw, 16px);
      color: rgba(0,0,0,.62);
      line-height:1.45;
      font-weight:600;
    }

    .ctaRow{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      pointer-events:auto;
    }

    .btn{
      border:0;
      cursor:pointer;
      border-radius:999px;
      padding: 12px 18px;
      background: #101010;
      color:#fff;
      font-weight:800;
      font-size: 14px;
      box-shadow: 0 14px 26px rgba(0,0,0,.20);
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .btn:hover{
      transform: translateY(-1px);
      box-shadow: 0 18px 34px rgba(0,0,0,.24);
      background:#000;
    }

    .smallNote{
      margin-top:10px;
      font-size:12px;
      color: rgba(0,0,0,.50);
      font-weight:700;
    }

    /* --- Slots around disc --- */
    .slots{
      position:absolute;
      inset:0;
    }

    .slot{
      position:absolute;
      width: clamp(132px, 18vw, 220px);
      aspect-ratio: 16/10;
      border-radius:16px;
      overflow:hidden;
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,0)) , #0b0b0b;
      box-shadow: var(--slotShadow);
      border: 1px solid rgba(255,255,255,.10);
      transform: translate(-50%, -50%);
    }

    .slot::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(120% 120% at 30% 10%, rgba(255,255,255,.10), rgba(255,255,255,0) 60%),
        radial-gradient(120% 120% at 70% 90%, rgba(0,0,0,.45), rgba(0,0,0,0) 55%);
      pointer-events:none;
    }

    .media{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      filter: contrast(1.05) saturate(0.9);
      transform: scale(1.02);
    }

    .slotTitle{
      position:absolute;
      right:10px;
      bottom:10px;
      left:10px;
      color: rgba(255,255,255,.92);
      font-weight:800;
      font-size: 13px;
      text-shadow: 0 3px 12px rgba(0,0,0,.85);
      z-index:2;
      line-height:1.15;
      pointer-events:none;
    }
    .slotSub{
      display:block;
      margin-top:4px;
      font-weight:700;
      font-size: 12px;
      color: rgba(255,255,255,.70);
    }

    /* Placeholders (when no media loaded) */
    .slot.placeholder{
      background:
        linear-gradient(140deg, rgba(255,255,255,.05), rgba(255,255,255,0)),
        #090909;
    }
    .slot.placeholder .slotTitle{opacity:.65}

    /* Responsive tweaks */
    @media (max-width: 720px){
      .wrap{padding:14px}
      .label{width:min(320px, 72vw)}
      .slot{width: clamp(110px, 30vw, 190px); border-radius:14px}
    }

    @media (max-width: 520px){
      .stage{padding:10px 0}
      .disc{width: 96vw}
      .label{width:min(290px, 78vw); padding:18px}
      .btn{padding:11px 16px}
      .slot{width: clamp(104px, 34vw, 170px)}
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="stage">
      <div class="disc" id="disc">
        <div class="slots" id="slots"></div>

        <div class="center">
          <div class="label">
            <div class="labelContent">
              <h1>חותם שנשאר לדורות</h1>
              <p>זכרונות ערכיים, אמונה, משפחה וזיכרון.</p>
              <div class="ctaRow">
                <button class="btn" onclick="alert('כאן תשים צור קשר / שאלון')">להתחיל בשאלון קצר</button>
              </div>
              <div class="smallNote">hotam.vip ©</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    /**
     * שים את הקבצים כאן לפי השמות שיש לך ב-assets/
     * תמונות חדשות:
     * still1_real.jpg, still2_real.jpg, still3_real.jpg, still4_real.jpg
     * וידאו:
     * faith1.mp4, faith2.mp4, faith3.mp4, faith4.mp4
     */
    const items = [
      // 8 "חלונות" סביב הדיסק
      { type: "video", src: "assets/faith1.mp4", title: "אמונה", sub: "רגע קטן שמאיר" },
      { type: "image", src: "assets/still1_real.jpg", title: "משפחה", sub: "מבט שנשמר" },

      { type: "video", src: "assets/faith2.mp4", title: "בית של פעם", sub: "שקט של שבת" },
      { type: "image", src: "assets/still2_real.jpg", title: "דורות", sub: "סבא ונכד" },

      { type: "video", src: "assets/faith3.mp4", title: "לימוד", sub: "דף ועוד דף" },
      { type: "image", src: "assets/still3_real.jpg", title: "לב", sub: "רגע שמחבר" },

      { type: "video", src: "assets/faith4.mp4", title: "שבת", sub: "אור בבית" },
      { type: "image", src: "assets/still4_real.jpg", title: "חותם", sub: "נשאר לדורות" },
    ];

    // זוויות (8 פריטים) מסביב לדיסק
    // 0 = למעלה, 90 = ימין, 180 = למטה, 270 = שמאל (בגלל RTL עדיין זה ויזואלי כרגיל)
    const angles = [0, 45, 90, 135, 180, 225, 270, 315];

    const slotsEl = document.getElementById("slots");

    function makeSlot(item){
      const slot = document.createElement("div");
      slot.className = "slot";

      if(item.type === "video"){
        const v = document.createElement("video");
        v.className = "media";
        v.src = item.src;
        v.muted = true;
        v.loop = true;
        v.autoplay = true;
        v.playsInline = true;
        v.preload = "metadata";
        slot.appendChild(v);

        // נסיון "להרים" autoplay גם בדפדפנים עקשנים
        v.addEventListener("canplay", () => {
          const p = v.play();
          if(p && typeof p.catch === "function") p.catch(()=>{});
        });
      } else if(item.type === "image"){
        const img = document.createElement("img");
        img.className = "media";
        img.src = item.src;
        img.alt = item.title || "";
        img.loading = "lazy";
        img.decoding = "async";
        slot.appendChild(img);

        // אם התמונה לא נטענת, תראה placeholder ברור
        img.onerror = () => {
          slot.classList.add("placeholder");
          slot.innerHTML = "";
          const t = document.createElement("div");
          t.className = "slotTitle";
          t.innerHTML = (item.title || "תמונה") + "<span class='slotSub'>קובץ לא נטען</span>";
          slot.appendChild(t);
        };
      } else {
        slot.classList.add("placeholder");
      }

      const title = document.createElement("div");
      title.className = "slotTitle";
      title.innerHTML = (item.title || "") + (item.sub ? `<span class="slotSub">${item.sub}</span>` : "");
      slot.appendChild(title);

      return slot;
    }

    function layoutSlots(){
      slotsEl.innerHTML = "";

      // רדיוס יחסי למיקום הסלוטים
      const disc = document.getElementById("disc");
      const rect = disc.getBoundingClientRect();
      const size = Math.min(rect.width, rect.height);

      // המרחק מהמרכז – לכוון לפי טעם
      const radius = size * 0.40;

      items.forEach((item, i) => {
        const ang = (angles[i % angles.length] - 90) * (Math.PI / 180); // -90 כדי ש-0 יהיה למעלה
        const x = 50 + (Math.cos(ang) * radius / size) * 100;
        const y = 50 + (Math.sin(ang) * radius / size) * 100;

        const slot = makeSlot(item);
        slot.style.left = x + "%";
        slot.style.top = y + "%";
        slotsEl.appendChild(slot);
      });
    }

    // רנדר ראשוני + רספונסיביות
    layoutSlots();
    window.addEventListener("resize", () => {
      clearTimeout(window.__rsz);
      window.__rsz = setTimeout(layoutSlots, 120);
    });
  </script>
</body>
</html>
