<!doctype html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>hotam.vip | חותם - מורשת נצחית</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #efe7db; --accent: #7a5a2b; --gold: #c5a059; }
        
        body { 
            margin: 0; background: var(--bg); 
            background-image: url("https://www.transparenttextures.com/patterns/aged-paper.png");
            font-family: 'Assistant', sans-serif; 
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }

        .container {
            width: min(95vw, 650px);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        svg { width: 100%; height: auto; overflow: visible; }

        /* אנימציית סיבוב למלל האמצעי */
        .spin { transform-origin: 300px 350px; animation: rotate 30s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* עיצוב המדיה בתוך הדיסק */
        .media-content { 
            object-fit: cover; 
            border-radius: 8px; 
            border: 2px solid rgba(255,255,255,0.15); 
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            background: #000;
        }

        .center-btn { cursor: pointer; transition: transform 0.2s ease; }
        .center-btn:hover { transform: scale(1.05); }

        /* אפקט כניסה יוקרתי */
        .fade-in { animation: fadeIn 1.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="container fade-in">
        <svg viewBox="0 0 600 700">
            <defs>
                <path id="headerCurve" d="M 60,110 A 240,90 0 0,1 540,110" />
                <path id="innerRing" d="M 300, 350 m -85, 0 a 85,85 0 1,1 170,0 a 85,85 0 1,1 -170,0" />
                <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="20" stdDeviation="15" flood-opacity="0.5"/>
                </filter>
            </defs>

            <text font-size="22" font-weight="800" fill="#1a1a1a">
                <textPath href="#headerCurve" startOffset="50%" text-anchor="middle">
                    הפעם זה לא עוד אלבום תמונות. הפעם זה <tspan fill="var(--accent)">חותם</tspan> שנשאר לדורות.
                </textPath>
            </text>

            <circle cx="300" cy="350" r="255" fill="#0a0a0a" filter="url(#shadow)" stroke="#1a1a1a" stroke-width="2" />
            <circle cx="300" cy="350" r="255" fill="radial-gradient(circle, #222 0%, #000 100%)" />
            
            <circle cx="300" cy="350" r="250" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="200" stroke-dasharray="1,3" />

            <foreignObject x="240" y="135" width="120" height="90">
                <video autoplay muted loop playsinline class="media-content" style="width:100%; height:100%;"><source src="faith1.mp4" type="video/mp4"></video>
            </foreignObject>

            <foreignObject x="420" y="210" width="120" height="90">
                <img src="still1_real.jpg" class="media-content" style="width:100%; height:100%;">
            </foreignObject>

            <foreignObject x="420" y="410" width="120" height="90">
                <video autoplay muted loop playsinline class="media-content" style="width:100%; height:100%;"><source src="faith2.mp4" type="video/mp4"></video>
            </foreignObject>

            <foreignObject x="240" y="485" width="120" height="90">
                <img src="still2_real.jpg" class="media-content" style="width:100%; height:100%;">
            </foreignObject>

            <foreignObject x="60" y="410" width="120" height="90">
                <video autoplay muted loop playsinline class="media-content" style="width:100%; height:100%;"><source src="faith3.mp4" type="video/mp4"></video>
            </foreignObject>

            <foreignObject x="60" y="210" width="120" height="90">
                <img src="still4_real.jpg" class="media-content" style="width:100%; height:100%;">
            </foreignObject>

            <g class="spin">
                <text fill="rgba(255,255,255,0.85)" font-size="13" font-weight="700">
                    <textPath href="#innerRing">
                        • סיפורי משפחה ומורשת • חותם שנשאר לדורות • זיכרון אבות שלא יאבד •
                    </textPath>
                </text>
            </g>

            <a href="https://hotam.vip/forum" class="center-btn">
                <circle cx="300" cy="350" r="68" fill="#ffffff" filter="drop-shadow(0 5px 15px rgba(0,0,0,0.4))" />
                <text x="300" y="342" text-anchor="middle" dominant-baseline="middle" fill="#000" font-weight="900" font-size="20">התחל</text>
                <text x="300" y="375" text-anchor="middle" dominant-baseline="middle" font-size="22">📜</text>
            </a>
        </svg>
    </div>

</body>
</html>
