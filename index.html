<style>
    .studio-gallery { padding: 80px 5%; background: #0a0a0a; text-align: center; }
    .studio-gallery h2 { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 2.5rem; margin-bottom: 40px; }
    
    .gallery-grid { 
        display: grid; 
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
        gap: 15px; 
    }
    
    .gallery-item { 
        position: relative; 
        aspect-ratio: 16/9; 
        background: #111; 
        overflow: hidden; 
        border: 1px solid #222;
    }
    
    /* כאן ירוצו קטעי הוידאו שלך בלולאה */
    .gallery-item video, .gallery-item img { 
        width: 100%; height: 100%; object-fit: cover; 
        filter: grayscale(0.5); transition: 0.5s;
    }
    
    .gallery-item:hover video, .gallery-item:hover img { 
        filter: grayscale(0); transform: scale(1.05); 
    }

    .gallery-item::before {
        content: "PLAY";
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        color: var(--gold); border: 1px solid var(--gold); padding: 5px 15px;
        font-size: 0.7rem; letter-spacing: 2px; z-index: 5; opacity: 0; transition: 0.3s;
    }
    .gallery-item:hover::before { opacity: 1; }
</style>

<section class="studio-gallery" id="studio">
    <h2>מבט מהסטודיו</h2>
    <div class="gallery-grid">
        <div class="gallery-item">
            <video autoplay muted loop playsinline><source src="faith1.mp4" type="video/mp4"></video>
        </div>
        <div class="gallery-item">
            <video autoplay muted loop playsinline><source src="faith2.mp4" type="video/mp4"></video>
        </div>
        <div class="gallery-item">
            <img src="still1_real.jpg" alt="סטודיו">
        </div>
        <div class="gallery-item">
            <video autoplay muted loop playsinline><source src="faith4.mp4" type="video/mp4"></video>
        </div>
    </div>
</section>
