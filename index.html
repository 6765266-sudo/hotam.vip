<!doctype html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>hotam.vip | חותם</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; background: #efe7db; 
            background-image: url("https://www.transparenttextures.com/patterns/aged-paper.png");
            font-family: 'Assistant', sans-serif; 
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden;
        }
        .container { width: min(95vw, 650px); aspect-ratio: 1 / 1.1; position: relative; }
        svg { width: 100%; height: 100%; overflow: visible; }
        
        /* אנימציה למלל המסתובב */
        .rotating-text { transform-origin: 300px 350px; animation: spin 40s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        /* עיצוב המדיה בתוך הדיסק */
        .media-box { object-fit: cover; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: #000; }
        .center-btn { cursor: pointer; transition: transform 0.2s; }
        .center-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>

<div class="container">
    <svg viewBox="0 0 600 700">
        <defs>
            <path id="headerArc" d="M 80,120 A 220,90 0 0,1 520,120" />
            <path id="innerCircle" d="M 300,350 m -80,0 a 80,80 0 1,1 160,0 a 80,80 0 1,1 -160,0" />
        </defs>

        <text font-size="22" font-weight="800" fill="#1a1a1a">
            <textPath href="#headerArc" startOffset="50%" text-anchor="middle">
                הפעם זה לא עוד אלבום תמונות. הפעם זה <tspan fill="#7a5a2b">חותם</tspan> שנשאר לדורות.
            </textPath>
        </text>

        <circle cx="300" cy="350" r="250" fill="radial-gradient(circle, #222 0%, #000 100%)" stroke="#111" stroke-width="5" />
        
        <circle cx="300" cy="350" r="248" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="2" stroke-dasharray="1,3" />

        <foreignObject x="245" y="130" width="110" height="80">
            <video autoplay muted loop playsinline class="media-box" style="width:100%; height:100%;"><source src="faith1.mp4" type="video/mp4"></video>
        </foreignObject>
        
        <foreignObject x="410" y="200" width="110" height="80">
            <img src="still1_real.jpg" class="media-box" style="width:100%; height:100%;">
        </foreignObject>

        <foreignObject x="410" y="420" width="110" height="80">
            <video autoplay muted loop playsinline class="media-box" style="width:100%; height:100%;"><source src="faith2.mp4" type="video/mp4"></video>
        </foreignObject>

        <foreignObject x="245" y="490" width="110" height="80">
            <img src="still2_real.jpg" class="media-box" style="width:100%; height:100%;">
        </foreignObject>

        <foreignObject x="80" y="420" width="110" height="80">
            <video autoplay muted loop playsinline class="media-box" style="width:100%; height:100%;"><source src="faith3.mp4" type="video/mp4"></video>
        </foreignObject>

        <foreignObject x="80" y="200" width="110" height="80">
            <video autoplay muted loop playsinline class="media-box" style="width:100%; height:100%;"><source src="faith4.mp4" type="video/mp4"></video>
        </foreignObject>

        <g class="rotating-text">
            <text fill="rgba(255,255,255,0.8)" font-size="13" font-weight="700">
                <textPath href="#innerCircle">
                    • סיפורי משפחה ומורשת • חותם שנשאר לדורות • זיכרון אבות •
                </textPath>
            </text>
        </g>

        <a href="https://hotam.vip/forum" class="center-btn">
            <circle cx="300" cy="350" r="65" fill="#ffffff" filter="drop-shadow(0 5px 10px rgba(0,0,0,0.4))" />
            <text x="300" y="345" text-anchor="middle" font-weight="900" font-size="20" fill="#000">התחל</text>
            <text x="300" y="375" text-anchor="middle" font-size="22">📜</text>
        </a>
    </svg>
</div>

</body>
</html>
