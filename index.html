<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hotam.vip</title>

  <style>
    :root{
      --bg: #efe7dc;

      --discA:#0f0f10;
      --discB:#101012;

      /* ✅ כרטיסים (הקטנתי קצת כדי שייכנס סימטרי) */
      --cardW: 20.5%;
      --cardRadius: 14px;

      /* ✅ רדיוס הסיבוב של הכרטיסים (מעט גדול יותר לסימטריה) */
      --orbit: 67%;

      /* טבעת טקסט */
      --ringText: rgba(255,255,255,.72);
      --ringGlow: rgba(255,255,255,.18);
      --ringFont: 15px;

      /* ✅ סיבוב איטי */
      --spinSeconds: 70s;

      /* מרכז דיסק */
      --hubSize: 24%;

      --shadow: 0 22px 55px rgba(0,0,0,.35);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background: radial-gradient(1200px 800px at 50% 30%, #fff6ea 0%, var(--bg) 55%, #e6ddcf 100%);
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    }

    /* ✅ ריבוע בטוח */
    .stage{
      width:min(980px, 92vw);
      position:relative;
    }
    .stage::before{
      content:"";
      display:block;
      padding-top:100%;
    }

    .disc{
      position:absolute;
      inset:0;
      border-radius:50%;
      background:
        repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.055) 0 2px, rgba(255,255,255,.00) 2px 8px),
        radial-gradient(circle at 50% 50%, var(--discA) 0%, var(--discB) 70%, #070708 100%);
      box-shadow: var(--shadow);
      overflow:hidden;
    }

    /* --- טבעת טקסט מסתובבת --- */
    .ring{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      pointer-events:none;
      z-index: 3;
    }
    .ring svg{
      width:48%;
      height:48%;
      overflow:visible;
      filter: drop-shadow(0 1px 0 var(--ringGlow));
    }
    .ring-spin{
      transform-origin: 50% 50%;
      animation: spin var(--spinSeconds) linear infinite;
    }
    @keyframes spin{
      from{ transform: rotate(0deg); }
      to{ transform: rotate(360deg); }
    }

    /* --- כרטיסים --- */
    .slot{
      position:absolute;
      width: var(--cardW);
      aspect-ratio: 16 / 9;
      border-radius: var(--cardRadius);
      overflow:hidden;
      box-shadow: 0 18px 30px rgba(0,0,0,.35);
      background: rgba(255,255,255,.06);
      z-index: 2;
      transform: translate(-50%,-50%);
    }
    .slot img, .slot video{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    /* כתוביות – שמאל למטה, בלי רקע, עד 2 שורות (אחת לכותרת ואחת לתת-כותרת) */
    .caption{
      position:absolute;
      left:10px;
      bottom:10px;
      right:10px;
      display:flex;
      flex-direction:column;
      gap:2px;
      align-items:flex-start;
      text-align:left;
      pointer-events:none;
      color: rgba(255,255,255,.95);
      text-shadow: 0 2px 10px rgba(0,0,0,.65);
    }
    .cap-title{
      font-weight:900;
      font-size:14px;
      line-height:1.1;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:100%;
    }
    .cap-sub{
      font-weight:800;
      font-size:12px;
      line-height:1.15;
      opacity:.95;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:100%;
    }

    /* --- מרכז דיסק --- */
    .hub{
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      width: var(--hubSize);
      aspect-ratio:1/1;
      border-radius:50%;
      z-index: 4;
      display:grid;
      place-items:center;
    }

    .hub-outer{
      width:100%;
      height:100%;
      border-radius:50%;
      background: radial-gradient(circle at 50% 45%,
        rgba(255,255,255,.90) 0 42%,
        rgba(255,255,255,.72) 42% 66%,
        rgba(255,255,255,.00) 66% 100%
      );
      box-shadow: 0 10px 30px rgba(0,0,0,.28);
      display:grid;
      place-items:center;
    }

    .hub-mid{
      width:62%;
      aspect-ratio:1/1;
      border-radius:50%;
      background: radial-gradient(circle at 50% 40%,
        rgba(255,255,255,.14),
        rgba(120,120,120,.46)
      );
      box-shadow: inset 0 0 0 2px rgba(0,0,0,.10);
      display:grid;
      place-items:center;
    }

    .start{
      width:72%;
      aspect-ratio:1/1;
      border-radius:50%;
      border: 2px solid rgba(0,0,0,.16);
      background:
        radial-gradient(circle at 50% 35%, rgba(255,255,255,.18), rgba(255,255,255,.03)),
        linear-gradient(180deg, rgba(0,0,0,.22), rgba(0,0,0,.10));
      color: rgba(255,255,255,.92);
      cursor:pointer;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:6px;
      padding:10px;
      box-shadow:
        0 10px 22px rgba(0,0,0,.25),
        inset 0 0 0 1px rgba(255,255,255,.10);
      transition: transform .15s ease, filter .15s ease;
      user-select:none;
    }
    .start:hover{ filter: brightness(1.10); transform: translateY(-1px); }
    .start:active{ transform: translateY(0) scale(.98); }

    .hand{ font-size:22px; line-height:1; }
    .start-label{ font-weight:900; font-size:14px; }
    .start-sub{ font-weight:800; font-size:11px; opacity:.9; }

    /* ✅ מובייל: קטנים יותר + רדיוס קצת גדול + פונט קטן כדי שלא ייחתך */
    @media (max-width: 640px){
      :root{
        --cardW: 25.5%;
        --orbit: 70%;
        --spinSeconds: 78s;
        --ringFont: 12.5px;
        --hubSize: 36%;
      }
      .ring svg{ width:60%; height:60%; }
      .cap-title{ font-size:13px; }
      .cap-sub{ font-size:11px; }
    }
  </style>
</head>

<body>
  <div class="stage">
    <div class="disc" id="disc">

      <!-- טבעת טקסט מסתובבת -->
      <div class="ring" aria-hidden="true">
        <svg viewBox="0 0 300 300">
          <defs>
            <path id="circlePath" d="M150,150 m-108,0 a108,108 0 1,1 216,0 a108,108 0 1,1 -216,0" />
          </defs>

          <g class="ring-spin">
            <text fill="var(--ringText)" font-size="var(--ringFont)" font-weight="900" letter-spacing="1.05">
              <textPath href="#circlePath" startOffset="50%" text-anchor="middle">
                חותם שנשאר לדורות • חותם שנשאר לתמיד • מי היו סבא וסבתא? • סיפורי משפחה ומורשת • המחשת גבורה ומסירות נפש •
              </textPath>
            </text>
          </g>
        </svg>
      </div>

      <!-- מרכז דיסק -->
      <div class="hub">
        <div class="hub-outer">
          <div class="hub-mid">
            <button class="start" id="startBtn" type="button" title="התחל">
              <div class="hand">👆</div>
              <div class="start-label">התחל</div>
              <div class="start-sub">חותם</div>
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    /*
      ✅ סימטריה מלאה: 8 פריטים סביב הדיסק כל 45°
      סדר לפי כיוון השעון:
      12, 1:30, 3, 4:30, 6, 7:30, 9, 10:30
    */
    const items = [
      { type:"video", src:"assets/faith1.mp4",      title:"זיכרון אבות",           sub:"שלא יאבד" },          // 12
      { type:"img",   src:"assets/still2_real.jpg", title:"חותם שנשאר לדורות",     sub:"שהנכדים ידעו" },      // 1:30
      { type:"video", src:"assets/faith2.mp4",      title:"מתיקות התורה",          sub:"של סבא" },             // 3
      { type:"img",   src:"assets/still3_real.jpg", title:"להעביר מורשת",          sub:"מדור לדור" },          // 4:30
      { type:"video", src:"assets/faith3.mp4",      title:"מסירות נפש",            sub:"רגע שמתחבר" },         // 6
      { type:"img",   src:"assets/still1_real.jpg", title:"תפילין",                sub:"האות שמחבר" },         // 7:30
      { type:"video", src:"assets/faith4.mp4",      title:"שבת",                   sub:"בבית סבא" },           // 9
      { type:"img",   src:"assets/still4_real.jpg", title:"שיירשת לדורות",         sub:"סבא ונכד" },           // 10:30
    ];

    // ✅ זוויות שוות (45°): מתחיל ב-12:00 (-90°)
    const anglesDeg = Array.from({length: 8}, (_, i) => -90 + i * 45);

    const disc = document.getElementById("disc");

    function createSlot(item){
      const slot = document.createElement("div");
      slot.className = "slot";

      if(item.type === "video"){
        const v = document.createElement("video");
        v.src = item.src;
        v.autoplay = true;
        v.muted = true;
        v.loop = true;
        v.playsInline = true;
        v.preload = "metadata";
        slot.appendChild(v);
      } else {
        const img = document.createElement("img");
        img.src = item.src;
        img.alt = "";
        slot.appendChild(img);
      }

      const cap = document.createElement("div");
      cap.className = "caption";

      const t = document.createElement("div");
      t.className = "cap-title";
      t.textContent = item.title;

      const s = document.createElement("div");
      s.className = "cap-sub";
      s.textContent = item.sub;

      cap.appendChild(t);
      cap.appendChild(s);
      slot.appendChild(cap);

      return slot;
    }

    function layout(){
      // ✅ רק לפי רוחב (יציב)
      const size = disc.clientWidth;
      const cx = size / 2;
      const cy = size / 2;

      const orbitStr = getComputedStyle(document.documentElement).getPropertyValue("--orbit").trim();
      const orbitPercent = parseFloat(orbitStr) || 67;
      const R = (size / 2) * (orbitPercent / 100);

      const slots = disc.querySelectorAll(".slot");
      slots.forEach((slot, i) => {
        const a = anglesDeg[i] * Math.PI / 180;
        const x = cx + R * Math.cos(a);
        const y = cy + R * Math.sin(a);
        slot.style.left = x + "px";
        slot.style.top  = y + "px";
      });
    }

    // build
    items.forEach(it => disc.appendChild(createSlot(it)));

    layout();
    window.addEventListener("resize", layout);
    window.addEventListener("load", () => requestAnimationFrame(layout));

    document.getElementById("startBtn").addEventListener("click", () => {
      window.location.href = "form.html";
    });
  </script>
</body>
</html>
