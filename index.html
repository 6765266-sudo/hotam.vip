<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>hotam.vip</title>

  <style>
    :root{
      --bg: #efe7db;

      /* דיסק */
      --disc-size: clamp(560px, 86vmin, 940px);
      --disc: #060606;
      --shadow: 0 18px 45px rgba(0,0,0,0.35);

      /* טבעת הכרטיסים */
      --ring-radius: clamp(240px, 33vmin, 360px);
      --depth-radius: 26px;
      --depth-scale: 0.28;
      --depth-lift: 14px;

      /* כרטיס */
      --slot-w: clamp(190px, 22vmin, 260px);
      --slot-h: clamp(112px, 13vmin, 150px);
      --slot-radius: 18px;

      /* מרכז */
      --center-ring: clamp(210px, 30vmin, 320px); /* קוטר טבעת הכיתוב */
      --press-size: clamp(64px, 9vmin, 86px);

      --font: system-ui, -apple-system, "Segoe UI", Arial, "Heebo", "Rubik", sans-serif;
    }

    @media (max-width: 720px){
      :root{
        --disc-size: 94vmin;
        --ring-radius: clamp(175px, 31vmin, 265px);

        --slot-w: clamp(150px, 44vw, 190px);
        --slot-h: clamp(92px, 26vw, 120px);

        --depth-radius: 18px;
        --depth-scale: 0.22;
        --depth-lift: 10px;

        --center-ring: clamp(190px, 62vw, 290px);
        --press-size: clamp(62px, 18vw, 82px);
      }
    }

    html,body{height:100%;}
    body{
      margin:0;
      font-family: var(--font);
      background: radial-gradient(1200px 700px at 50% 35%, #fff6ea 0%, var(--bg) 55%, #e8ddcf 100%);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    .stage{
      width:100vw;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 18px;
      box-sizing:border-box;
    }

    .disc-wrap{
      position:relative;
      width: var(--disc-size);
      height: var(--disc-size);
    }

    /* דיסק “עתיק” בלי תמונה חיצונית (חריצים + אבק + כתמי זמן) */
    .disc{
      position:absolute;
      inset:0;
      border-radius:50%;
      background:
        /* שריטות עדינות */
        repeating-linear-gradient(
          12deg,
          rgba(255,255,255,0.03) 0 2px,
          rgba(0,0,0,0.00) 2px 10px
        ),
        /* חריצים */
        repeating-radial-gradient(circle at 50% 50%,
          rgba(255,255,255,0.020) 0 6px,
          rgba(0,0,0,0.00) 6px 7px
        ),
        radial-gradient(circle at 30% 25%, rgba(255,240,220,0.06) 0%, rgba(0,0,0,0) 40%),
        radial-gradient(circle at 70% 75%, rgba(255,220,170,0.05) 0%, rgba(0,0,0,0) 45%),
        radial-gradient(circle at 50% 50%, #0b0b0b 0%, #050505 62%, #000 100%);
      box-shadow: var(--shadow);
      filter: saturate(0.95) contrast(1.05);
    }

    /* קליפ: הכל נשאר בתוך עיגול הדיסק */
    .clip{
      position:absolute;
      inset:0;
      border-radius:50%;
      overflow:hidden;
      pointer-events:none;
    }
    .clip > *{ pointer-events:auto; }

    /* כרטיסים */
    .slot{
      position:absolute;
      left:50%;
      top:50%;
      width: var(--slot-w);
      height: var(--slot-h);
      border-radius: var(--slot-radius);
      overflow:hidden;
      background: rgba(255,255,255,0.06);
      outline: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 14px 28px rgba(0,0,0,0.28);
      transform:
        translate(-50%,-50%)
        rotate(var(--a))
        translateX(calc(var(--ring-radius) + var(--dr)))
        rotate(calc(var(--a) * -1))
        translateY(var(--dy))
        scale(var(--s));
      z-index: var(--z);
      will-change: transform;
    }

    .media{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
      transform: scale(1.01);
      filter: contrast(1.05) saturate(0.92);
    }

    .slot::before{
      content:"";
      position:absolute;
      inset:0;
      background: linear-gradient(180deg, rgba(0,0,0,0.16) 0%, rgba(0,0,0,0.03) 45%, rgba(0,0,0,0.62) 100%);
      pointer-events:none;
      z-index: 2;
    }

    .label{
      position:absolute;
      right: 12px;
      left: 12px;
      bottom: 10px;
      z-index: 3;
      color:#fff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.55);
    }
    .label .h{ font-weight: 900; font-size: 14px; margin:0; line-height: 1.1; }
    .label .p{ margin: 4px 0 0; font-size: 12px; opacity: 0.9; line-height: 1.2; }

    .fallback{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background: rgba(0,0,0,0.55);
      color: rgba(255,255,255,0.9);
      font-size: 12px;
      z-index: 5;
      padding: 10px;
      text-align:center;
    }

    /* ===== מרכז עם כיתוב מעוגל סביב “לחץ” ===== */
    .center{
      position:absolute;
      left:50%;
      top:50%;
      transform: translate(-50%,-50%);
      width: var(--center-ring);
      height: var(--center-ring);
      display:grid;
      place-items:center;
      z-index: 999;
      pointer-events:auto;
    }

    /* רקע עדין מאחורי המרכז כדי להקריא טוב */
    .center::before{
      content:"";
      position:absolute;
      inset: 18%;
      border-radius: 28px;
      background: radial-gradient(circle at 50% 35%, rgba(255,255,255,0.14), rgba(255,255,255,0.06));
      outline: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 18px 44px rgba(0,0,0,0.28);
      backdrop-filter: blur(6px);
      pointer-events:none;
    }

    .center-inner{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      pointer-events:none;
    }

    .center-lines{
      position:absolute;
      top: 44%;
      transform: translateY(-50%);
      text-align:center;
      color:#fff;
      text-shadow: 0 6px 20px rgba(0,0,0,0.6);
      pointer-events:none;
      width: 80%;
    }

    .center-lines .title{
      font-weight: 1000;
      font-size: clamp(18px, 2.4vmin, 26px);
      margin:0 0 8px;
      line-height: 1.15;
    }
    .center-lines .sub{
      margin: 0;
      font-weight: 700;
      color: rgba(255,255,255,0.82);
      font-size: clamp(12px, 1.6vmin, 14px);
    }

    /* כפתור עגול “לחץ” */
    .press{
      position:absolute;
      top: 62%;
      transform: translateY(-50%);
      width: var(--press-size);
      height: var(--press-size);
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(170,170,170,0.18);
      box-shadow: 0 14px 28px rgba(0,0,0,0.32);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      user-select:none;
      pointer-events:auto;
      transition: filter .18s ease, box-shadow .18s ease, background .18s ease;
    }
    .press span{
      color:#fff;
      font-weight: 1000;
      font-size: clamp(14px, 1.8vmin, 18px);
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }

    /* SVG טבעת כיתוב */
    .ring-svg{
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events:none; /* לא לחסום לחיצות */
      filter: drop-shadow(0 8px 20px rgba(0,0,0,0.35));
    }

    .ring-text{
      fill: rgba(255,255,255,0.70); /* ברירת מחדל: קצת בהיר */
      font-weight: 900;
      letter-spacing: .6px;
    }
    .ring-text.small{
      fill: rgba(255,255,255,0.55);
      font-weight: 800;
    }

    /* כשהעכבר על הכפתור: הכפתור והטבעת מתבהרים */
    .center:hover .press,
    .press:hover{
      background: rgba(255,255,255,0.24);
      box-shadow: 0 18px 42px rgba(0,0,0,0.38), 0 0 28px rgba(255,255,255,0.10);
      filter: brightness(1.15);
    }
    .center:hover .ring-text{
      fill: rgba(255,255,255,0.92);
    }
    .center:hover .ring-text.small{
      fill: rgba(255,255,255,0.78);
    }

    .hint{
      position:absolute;
      top: 77%;
      transform: translateY(-50%);
      text-align:center;
      color: rgba(255,255,255,0.72);
      font-weight: 700;
      font-size: 12px;
      pointer-events:none;
      text-shadow: 0 2px 10px rgba(0,0,0,0.55);
    }
  </style>
</head>

<body>
  <div class="stage">
    <div class="disc-wrap">
      <div class="disc"></div>

      <div class="clip">
        <div id="slotsRoot"></div>

        <!-- מרכז -->
        <div class="center">
          <!-- טבעת כיתוב -->
          <svg class="ring-svg" viewBox="0 0 300 300" aria-hidden="true">
            <defs>
              <!-- מעגל לטקסט העליון -->
              <path id="circleTop" d="M150,150 m-105,0 a105,105 0 1,1 210,0 a105,105 0 1,1 -210,0" />
              <!-- מעגל לטקסט התחתון (אותו מסלול, אבל startOffset שונה) -->
              <path id="circleBottom" d="M150,150 m-105,0 a105,105 0 1,1 210,0 a105,105 0 1,1 -210,0" />
            </defs>

            <!-- כיתוב מעוגל: “חותם שנשאר לדורות” -->
            <text class="ring-text" font-size="16">
              <textPath href="#circleTop" startOffset="50%" text-anchor="middle">
                חותם שנשאר לדורות
              </textPath>
            </text>

            <!-- שני משפטים קטנים בתחתית המעגל -->
            <text class="ring-text small" font-size="12">
              <textPath href="#circleBottom" startOffset="50%" text-anchor="middle">
                זיכרון של עבר • זיכרון של עתיד
              </textPath>
            </text>
          </svg>

          <!-- טקסט באמצע (לא מעוגל) -->
          <div class="center-inner">
            <div class="center-lines">
              <p class="title">זוכרים. שומרים. מעבירים.</p>
              <p class="sub">אמונה • משפחה • זיכרון</p>
            </div>

            <div class="press" onclick="alert('כאן יתחיל שאלון/תהליך');" title="לחץ">
              <span>לחץ</span>
            </div>

            <div class="hint">ואם רוצים לראות עוד — לחץ כאן</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const ASSET_BASE = "./assets/";

    // סדר 8 פריטים (4 וידאו + 4 תמונות)
    const items = [
      { type: "video", src: "faith1.mp4", title: "אמונה", sub: "רגע קטן מאיר" },
      { type: "video", src: "faith2.mp4", title: "בית של פעם", sub: "שבת, אור ושקט" },
      { type: "video", src: "faith3.mp4", title: "לימוד", sub: "דף ועוד דף" },
      { type: "video", src: "faith4.mp4", title: "שבת", sub: "אור בבית" },

      { type: "image", src: "still1_real.jpg", title: "זיכרון חי", sub: "שנשאר לדורות" },
      { type: "image", src: "still2_real.jpg", title: "משפחה", sub: "מכתב שנשמר" },
      { type: "image", src: "still3_real.jpg", title: "לב", sub: "רגע שמחבר" },
      { type: "image", src: "still4_real.jpg", title: "חותם", sub: "שלא הולך לאיבוד" },
    ];

    // "שעון" שווה שווה
    const COUNT = 8;
    const STEP = 360 / COUNT;
    const START_ANGLE = 270; // 270=למעלה. 0=ימין. 90=למטה. 180=שמאל.

    // תלת-ממד + בוסט לפריטים ראשונים
    const manualBoost = { 0: 0.08, 1: 0.05 };

    const slotsRoot = document.getElementById("slotsRoot");

    function makeSlot(item, angleDeg, index){
      const slot = document.createElement("div");
      slot.className = "slot";
      slot.style.setProperty("--a", angleDeg + "deg");

      // עומק לפי סינוס: למטה גדול, למעלה קטן
      const rad = angleDeg * Math.PI / 180;
      const depth = Math.sin(rad); // -1..+1

      const rootStyle = getComputedStyle(document.documentElement);
      const depthRadius = parseFloat(rootStyle.getPropertyValue("--depth-radius")) || 26;
      const depthScale  = parseFloat(rootStyle.getPropertyValue("--depth-scale"))  || 0.28;
      const depthLift   = parseFloat(rootStyle.getPropertyValue("--depth-lift"))   || 14;

      const t = (depth + 1) / 2; // 0..1
      let scale = 0.86 + depthScale * t;
      scale += (manualBoost[index] || 0);

      const dr = (depthRadius * depth);      // bottom יוצא מעט החוצה
      const dy = (depthLift * depth) + "px"; // תנועה עדינה
      const z  = Math.round(100 + 120 * t);

      slot.style.setProperty("--s", scale.toFixed(3));
      slot.style.setProperty("--dr", dr.toFixed(1) + "px");
      slot.style.setProperty("--dy", dy);
      slot.style.setProperty("--z", z);

      const label = document.createElement("div");
      label.className = "label";
      label.innerHTML = `
        <p class="h">${escapeHtml(item.title || "")}</p>
        <p class="p">${escapeHtml(item.sub || "")}</p>
      `;

      const fullSrc = ASSET_BASE + item.src;

      if(item.type === "video"){
        const v = document.createElement("video");
        v.className = "media";
        v.src = fullSrc;
        v.muted = true;
        v.loop = true;
        v.playsInline = true;
        v.autoplay = true;
        v.preload = "metadata";

        v.addEventListener("canplay", () => {
          const p = v.play();
          if (p && typeof p.catch === "function") p.catch(() => {});
        });
        v.addEventListener("error", () => showFallback(slot, "וידאו לא נטען (בדוק שם/סיומת)"));
        slot.appendChild(v);
      } else {
        const img = document.createElement("img");
        img.className = "media";
        img.src = fullSrc;
        img.alt = item.title || "תמונה";
        img.loading = "lazy";
        img.decoding = "async";
        img.addEventListener("error", () => showFallback(slot, "תמונה לא נטענה (בדוק שם/סיומת)"));
        slot.appendChild(img);
      }

      slot.appendChild(label);
      return slot;
    }

    function showFallback(slot, text){
      if (slot.querySelector(".fallback")) return;
      const fb = document.createElement("div");
      fb.className = "fallback";
      fb.textContent = text;
      slot.appendChild(fb);
    }

    function escapeHtml(str){
      return String(str).replace(/[&<>"']/g, s => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[s]));
    }

    for(let i=0; i<COUNT; i++){
      const angle = (START_ANGLE + i*STEP) % 360;
      slotsRoot.appendChild(makeSlot(items[i], angle, i));
    }
  </script>
</body>
</html>
