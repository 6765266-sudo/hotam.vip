<!doctype html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>hotam.vip | חותם נצחי</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #efe7db; --accent: #7a5a2b; --gold: #c5a059; }
        
        body { 
            margin: 0; background: var(--bg); 
            background-image: url("https://www.transparenttextures.com/patterns/aged-paper.png");
            font-family: 'Assistant', sans-serif; 
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            overflow-x: hidden;
        }

        .container {
            display: flex; width: 100%; max-width: 1300px;
            align-items: center; justify-content: space-around; padding: 20px;
        }

        /* טקסט שמאלי (כמו בתמונה הישנה) */
        .side-text {
            flex: 0 0 300px; text-align: right;
        }

        .side-text h1 { font-size: 1.8rem; font-weight: 800; margin: 0; color: #333; }
        .side-text p { font-size: 1.2rem; color: #555; margin-top: 5px; }

        /* אזור הדיסק הגדול */
        .stage {
            position: relative;
            width: min(85vmin, 700px);
            aspect-ratio: 1/1;
            display: grid; place-items: center;
        }

        /* בסיס הדיסק עם חריצים */
        .disc-base {
            position: absolute; inset: 0;
            background: radial-gradient(circle, #222 0%, #000 100%);
            border-radius: 50%;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            background-image: repeating-radial-gradient(circle, transparent 0, transparent 2px, rgba(255,255,255,0.03) 3px);
        }

        /* גלריית התמונות על הדיסק */
        .photo-gallery {
            position: absolute; inset: 0;
            z-index: 5;
        }

        .photo {
            position: absolute;
            width: 18%; height: 12%;
            background-size: cover; background-position: center;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* מיקום התמונות במעגל (כמו בצילום המסך הישן) */
        .p1 { top: 10%; left: 50%; transform: translateX(-50%); }
        .p2 { top: 25%; right: 10%; }
        .p3 { bottom: 45%; right: 5%; }
        .p4 { bottom: 20%; right: 15%; }
        .p5 { bottom: 10%; left: 50%; transform: translateX(-50%); }
        .p6 { bottom: 20%; left: 15%; }
        .p7 { bottom: 45%; left: 5%; }
        .p8 { top: 25%; left: 10%; }

        /* טקסט מעגלי */
        .rotating-meta {
            position: absolute; width: 45%; height: 45%;
            z-index: 10; animation: spin 30s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* כפתור מרכז */
        .center-btn {
            position: absolute; z-index: 20;
            width: 22%; height: 22%;
            background: radial-gradient(circle, #fff 0%, #d1d1d1 100%);
            border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-decoration: none; box-shadow: 0 0 20px rgba(0,0,0,0.2);
            transition: 0.3s;
        }
        .center-btn:hover { transform: scale(1.1); }
        .center-btn span { color: #000; font-weight: 800; font-size: 1rem; }

        svg { width: 100%; height: 100%; overflow: visible; }
        text { fill: #fff; font-size: 14px; font-weight: bold; letter-spacing: 1px; }

        @media (max-width: 800px) {
            .container { flex-direction: column-reverse; }
            .side-text { text-align: center; flex: none; margin-top: 20px; }
            .stage { width: 90vw; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="side-text">
            <h1>הפעם זה לא עוד אלבום תמונות.</h1>
            <p>הפעם זה <span style="color:var(--accent); font-weight:bold;">חותם</span> שנשאר לדורות.</p>
        </div>

        <div class="stage">
            <div class="disc-base"></div>
            
            <div class="photo-gallery">
                <div class="photo p1" style="background-image: url('https://picsum.photos/200/150?1');"></div>
                <div class="photo p2" style="background-image: url('https://picsum.photos/200/150?2');"></div>
                <div class="photo p3" style="background-image: url('https://picsum.photos/200/150?3');"></div>
                <div class="photo p4" style="background-image: url('https://picsum.photos/200/150?4');"></div>
                <div class="photo p5" style="background-image: url('https://picsum.photos/200/150?5');"></div>
                <div class="photo p6" style="background-image: url('https://picsum.photos/200/150?6');"></div>
                <div class="photo p7" style="background-image: url('https://picsum.photos/200/150?7');"></div>
                <div class="photo p8" style="background-image: url('https://picsum.photos/200/150?8');"></div>
            </div>

            <div class="rotating-meta">
                <svg viewBox="0 0 200 200">
                    <path id="innerPath" d="M 100, 100 m -70, 0 a 70,70 0 1,1 140,0 a 70,70 0 1,1 -140,0" fill="none"/>
                    <text>
                        <textPath href="#innerPath">
                             • מורשת משפחתית • סיפור חיים • חותם שנשאר לדורות •
                        </textPath>
                    </text>
                </svg>
            </div>

            <a href="#" class="center-btn">
                <span>התחל</span>
                <span style="font-size: 1.5rem;">👇</span>
            </a>
        </div>
    </div>

</body>
</html>
