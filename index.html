<!doctype html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>hotam.vip | חותם - מורשת חיה</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #efe7db; --accent: #7a5a2b; --gold: #c5a059; }
        
        body { 
            margin: 0; background: var(--bg); 
            background-image: url("https://www.transparenttextures.com/patterns/aged-paper.png");
            font-family: 'Assistant', sans-serif; 
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }

        .container {
            display: flex; width: 100%; max-width: 1400px;
            align-items: center; justify-content: space-around; padding: 20px;
            flex-direction: row-reverse;
        }

        .side-text { flex: 0 0 350px; text-align: right; z-index: 50; }
        .side-text h1 { font-size: 2.5rem; font-weight: 800; margin: 0; color: #1a1a1a; }
        .side-text p { font-size: 1.5rem; color: #444; margin-top: 10px; }
        .highlight { color: var(--accent); font-weight: 800; border-bottom: 2px solid var(--gold); }

        /* מבנה הדיסק */
        .stage {
            position: relative;
            width: min(88vmin, 680px);
            aspect-ratio: 1/1;
            display: flex; justify-content: center; align-items: center;
        }

        .disc-body {
            position: absolute; inset: 0;
            background: radial-gradient(circle, #222 0%, #000 100%);
            border-radius: 50%;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
            background-image: repeating-radial-gradient(circle, transparent 0, transparent 2px, rgba(255,255,255,0.03) 3px);
            border: 2px solid #111;
        }

        .photo-gallery { position: absolute; inset: 0; z-index: 5; }

        /* עיצוב התמונות/סרטונים בתוך הדיסק */
        .memory-item {
            position: absolute;
            width: 22%; height: 16%;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.2);
            overflow: hidden;
            display: flex; align-items: flex-end;
        }

        .memory-item video, .memory-item img {
            width: 100%; height: 100%; object-fit: cover;
            position: absolute; top: 0; left: 0;
        }

        .memory-item .caption {
            position: relative; z-index: 2;
            color: white; font-size: 0.65rem; font-weight: bold; 
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            width: 100%; text-align: right; padding: 15px 5px 3px 5px;
        }

        /* סידור 6 תמונות במעגל צמוד */
        .pos-1 { top: 10%; left: 50%; transform: translateX(-50%); } 
        .pos-2 { top: 30%; right: 10%; } 
        .pos-3 { bottom: 30%; right: 10%; } 
        .pos-4 { bottom: 10%; left: 50%; transform: translateX(-50%); } 
        .pos-5 { bottom: 30%; left: 10%; } 
        .pos-6 { top: 30%; left: 10%; } 

        /* טבעת טקסט מסתובבת */
        .text-ring {
            position: absolute; width: 44%; height: 44%;
            z-index: 10; animation: rotateRing 40s linear infinite;
        }
        @keyframes rotateRing { to { transform: rotate(360deg); } }

        /* מרכז הדיסק */
        .center-hub {
            position: absolute; z-index: 20;
            width: 26%; height: 26%;
            background: radial-gradient(circle, #ffffff 50%, #e0e0e0 100%);
            border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-decoration: none; box-shadow: 0 5px 20px rgba(0,0,0,0.4);
            border: 4px solid #f0f0f0; cursor: pointer;
        }
        .center-hub b { color: #000; font-size: 1.2rem; font-weight: 900; }

        svg { width: 100%; height: 100%; overflow: visible; }
        text { fill: rgba(255,255,255,0.95); font-size: 13px; font-weight: 700; }

        /* מודאל */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            display: none; place-items: center; z-index: 100;
        }
        .modal-content {
            background: var(--bg); padding: 40px; border-radius: 15px;
            max-width: 500px; text-align: center; border: 2px solid var(--gold);
        }

        @media (max-width: 900px) {
            .container { flex-direction: column; text-align: center; gap: 40px; }
            .stage { width: 95vw; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="side-text">
            <h1>הפעם זה לא עוד<br>אלבום תמונות.</h1>
            <p>הפעם זה <span class="highlight">חותם</span> שנשאר לדורות.</p>
        </div>

        <div class="stage">
            <div class="disc-body"></div>
            
            <div class="photo-gallery">
                <div class="memory-item pos-1">
                    <video autoplay muted loop playsinline><source src="faith4.mp4" type="video/mp4"></video>
                    <div class="caption">שבת בבית סבא<br>עונג שלווה</div>
                </div>
                <div class="memory-item pos-2">
                    <img src="still4_real.jpg" alt="תפילין">
                    <div class="caption">תפילין<br>האות שמתחבר</div>
                </div>
                <div class="memory-item pos-3">
                    <img src="still1_real.jpg" alt="סבא ונכד">
                    <div class="caption">מורשת<br>סבא ונכד</div>
                </div>
                <div class="memory-item pos-4">
                    <video autoplay muted loop playsinline><source src="faith2.mp4" type="video/mp4"></video>
                    <div class="caption">מתיקות התורה<br>של סבא</div>
                </div>
                <div class="memory-item pos-5">
                    <img src="still2_real.jpg" alt="מסירות נפש">
                    <div class="caption">המחשבת גבורה<br>ומסירות נפש</div>
                </div>
                <div class="memory-item pos-6">
                    <video autoplay muted loop playsinline><source src="faith1.mp4" type="video/mp4"></video>
                    <div class="caption">זיכרון אבות<br>שלא יאבד</div>
                </div>
            </div>

            <div class="text-ring">
                <svg viewBox="0 0 200 200">
                    <path id="ringPath" d="M 100, 100 m -78, 0 a 78,78 0 1,1 156,0 a 78,78 0 1,1 -156,0" fill="none"/>
                    <text><textPath href="#ringPath">• סיפורי משפחה ומורשת • המחשבת גבורה ומסירות נפש • חותם שנשאר לדורות •</textPath></text>
                </svg>
            </div>

            <div class="center-hub" onclick="openModal()">
                <b>התחל</b>
                <span style="font-size: 1.5rem;">📜</span>
            </div>
        </div>
    </div>

    <div class="modal" id="infoModal">
        <div class="modal-content">
            <h2 style="color:var(--accent);">הסיפור שלכם מתחיל כאן</h2>
            <p>הצטרפו לקהילת "חותם" והבטיחו שהמורשת המשפחתית תישמר לנצח.</p>
            <a href="https://hotam.vip/forum" style="display:inline-block; padding:15px 30px; background:var(--accent); color:white; text-decoration:none; border-radius:5px; font-weight:bold;">מעבר לפורום והרשמה</a>
            <br><br>
            <button onclick="closeModal()" style="background:none; border:none; color:gray; cursor:pointer;">סגור</button>
        </div>
    </div>

    <script>
        function openModal() { document.getElementById('infoModal').style.display = 'grid'; }
        function closeModal() { document.getElementById('infoModal').style.display = 'none'; }
    </script>

</body>
</html>
