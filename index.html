<!doctype html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>hotam.vip | חותם - מורשת נצחית</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #efe7db; --accent: #7a5a2b; --gold: #c5a059; --disc-edge: #2c241a; }
        
        body { 
            margin: 0; background: var(--bg); 
            background-image: url("https://www.transparenttextures.com/patterns/aged-paper.png");
            font-family: 'Assistant', sans-serif; 
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
        }

        /* כותרת עליונה צמודה ועוטפת */
        .top-header-svg {
            width: min(90vw, 550px);
            height: 80px;
            margin-bottom: -20px;
            z-index: 50;
        }

        .stage {
            position: relative;
            width: min(85vmin, 600px); /* גודל קבוע למניעת בריחת תמונות */
            height: min(85vmin, 600px);
            display: flex; justify-content: center; align-items: center;
        }

        /* גוף הדיסק - צבע עתיק עם שוליים */
        .disc-body {
            position: absolute; inset: 0;
            background: radial-gradient(circle, #222 0%, #0a0a0a 80%, var(--disc-edge) 100%);
            border-radius: 50%;
            box-shadow: 0 30px 70px rgba(0,0,0,0.6), inset 0 0 50px rgba(122, 90, 43, 0.1);
            border: 6px solid #1a1a1a;
        }

        /* חריצי תקליט */
        .disc-body::after {
            content: ""; position: absolute; inset: 0; border-radius: 50%;
            background: repeating-radial-gradient(circle, transparent 0, transparent 2px, rgba(255,255,255,0.02) 3px);
            pointer-events: none;
        }

        .photo-gallery { position: absolute; inset: 0; z-index: 5; }

        .memory-item {
            position: absolute;
            width: 20%; height: 15%; /* גודל מבוקר */
            border-radius: 6px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.15);
            overflow: hidden;
            background: #000;
        }

        .memory-item video, .memory-item img {
            width: 100%; height: 100%; object-fit: cover;
        }

        /* מיקומים פנימיים - מבטיח ששום תמונה לא נוגעת בקצה */
        .pos-1 { top: 12%; left: 50%; transform: translateX(-50%); } 
        .pos-2 { top: 22%; right: 12%; } 
        .pos-3 { top: 50%; right: 8%; transform: translateY(-50%); } 
        .pos-4 { bottom: 22%; right: 12%; } 
        .pos-5 { bottom: 12%; left: 50%; transform: translateX(-50%); } 
        .pos-6 { bottom: 22%; left: 12%; } 
        .pos-7 { top: 50%; left: 8%; transform: translateY(-50%); } 
        .pos-8 { top: 22%; left: 12%; } 

        /* המלל המסתובב המבוקש באמצע */
        .inner-text-ring {
            position: absolute; width: 44%; height: 44%;
            z-index: 10; animation: rotateRing 40s linear infinite;
            pointer-events: none;
        }
        @keyframes rotateRing { to { transform: rotate(360deg); } }

        /* ליבת הדיסק - כפתור התחל */
        .center-hub {
            position: absolute; z-index: 20;
            width: 26%; height: 26%;
            background: radial-gradient(circle, #ffffff 50%, #f0f0f0 100%);
            border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            border: 4px solid #fff;
            text-decoration: none;
            transition: transform 0.2s;
        }
        .center-hub:hover { transform: scale(1.05); }
        .center-hub b { color: #000; font-size: 1.1rem; font-weight: 900; }

        svg { width: 100%; height: 100%; overflow: visible; }
        .curved-title { fill: #222; font-size: 19px; font-weight: 800; }
        .highlight { fill: var(--accent); }
        .ring-text { fill: rgba(255,255,255,0.85); font-size: 13px; font-weight: 700; letter-spacing: 0.5px; }

        @media (max-width: 600px) {
            .top-header-svg { width: 95vw; margin-bottom: -10px; }
            .stage { width: 92vw; height: 92vw; }
            .curved-title { font-size: 16px; }
        }
    </style>
</head>
<body>

    <svg class="top-header-svg" viewBox="0 0 500 100">
        <path id="headerPath" d="M 50,85 A 200,80 0 0,1 450,85" fill="none" />
        <text class="curved-title">
            <textPath href="#headerPath" startOffset="50%" text-anchor="middle">
                הפעם זה לא עוד אלבום תמונות. הפעם זה <tspan class="highlight">חותם</tspan> שנשאר לדורות.
            </textPath>
        </text>
    </svg>

    <div class="stage">
        <div class="disc-body"></div>
        
        <div class="photo-gallery">
            <div class="memory-item pos-1"><video autoplay muted loop playsinline><source src="faith1.mp4" type="video/mp4"></video></div>
            <div class="memory-item pos-2"><img src="still1_real.jpg"></div>
            <div class="memory-item pos-3"><img src="still3_real.jpg"></div>
            <div class="memory-item pos-4"><video autoplay muted loop playsinline><source src="faith2.mp4" type="video/mp4"></video></div>
            <div class="memory-item pos-5"><video autoplay muted loop playsinline><source src="faith3.mp4" type="video/mp4"></video></div>
            <div class="memory-item pos-6"><img src="still2_real.jpg"></div>
            <div class="memory-item pos-7"><video autoplay muted loop playsinline><source src="faith4.mp4" type="video/mp4"></video></div>
            <div class="memory-item pos-8"><img src="still4_real.jpg"></div>
        </div>

        <div class="inner-text-ring">
            <svg viewBox="0 0 200 200">
                <path id="ringPath" d="M 100, 100 m -75, 0 a 75,75 0 1,1 150,0 a 75,75 0 1,1 -150,0" fill="none"/>
                <text class="ring-text">
                    <textPath href="#ringPath">
                         • סיפורי משפחה ומורשת • חותם שנשאר לדורות • זיכרון אבות שלא יאבד •
                    </textPath>
                </text>
            </svg>
        </div>

        <a href="https://hotam.vip/forum" class="center-hub">
            <b>התחל</b>
            <span style="font-size: 1.2rem;">📜</span>
        </a>
    </div>

</body>
</html>
