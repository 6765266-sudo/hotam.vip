<!doctype html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>hotam.vip | חותם נצחי</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700;800&family=Platypi:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg: #efe7db; 
            --accent: #7a5a2b; 
            --gold: #c5a059;
        }

        body { 
            margin: 0; 
            background: var(--bg); 
            background-image: url("https://www.transparenttextures.com/patterns/aged-paper.png");
            font-family: 'Assistant', sans-serif; 
            min-height: 100svh; 
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .main-container {
            display: flex;
            flex-direction: row-reverse;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            gap: 5vw;
        }

        /* קופי שיווקי מעודן */
        .copy-content {
            flex: 0 1 400px;
            text-align: right;
            z-index: 10;
        }

        .copy-content h1 {
            font-size: clamp(1.8rem, 3vw, 2.8rem);
            line-height: 1.1;
            margin: 0;
            font-weight: 800;
            color: #1a1a1a;
        }

        .copy-content p {
            font-size: clamp(1.1rem, 1.5vw, 1.5rem);
            margin-top: 15px;
            color: #444;
        }

        .hotam-word {
            color: var(--accent);
            font-weight: 700;
            position: relative;
            display: inline-block;
        }

        .hotam-word::after {
            content: "";
            position: absolute;
            bottom: 2px; left: 0; right: 0;
            height: 2px;
            background: var(--gold);
            opacity: 0.6;
        }

        /* ויזואליה של הדיסק */
        .visual-frame {
            flex: 0 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .stage { 
            width: min(70vmin, 520px); 
            aspect-ratio: 1/1; 
            position: relative; 
        }

        .disc-base { 
            position: absolute; 
            inset: 0; 
            border-radius: 50%; 
            background: radial-gradient(circle, #2a2a2a 0%, #050505 100%); 
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), inset 0 0 100px rgba(255,255,255,0.05); 
            border: 1px solid #000;
        }

        /* חריצי תקליט עדינים */
        .disc-base::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: repeating-radial-gradient(
                circle,
                transparent 0,
                transparent 2px,
                rgba(255,255,255,0.02) 3px
            );
        }

        .rotating-ring { 
            position: absolute; 
            inset: 0; 
            z-index: 5; 
        }

        .rotating-ring svg { 
            width: 100%; height: 100%; 
            overflow: visible; 
        }

        .spin-anim { 
            animation: diskSpin 25s linear infinite; 
            transform-origin: center; 
        }

        @keyframes diskSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* מרכז הדיסק - כפתור "התחל" */
        .center-label { 
            position: absolute; 
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 32%; height: 32%; 
            background: #fff;
            background: radial-gradient(circle, #ffffff 60%, #f0f0f0 100%);
            border-radius: 50%; 
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2), inset 0 0 15px rgba(0,0,0,0.05);
            text-decoration: none;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .center-label:hover { transform: translate(-50%, -50%) scale(1.08); }

        .center-label span { 
            color: #000; 
            font-weight: 800; 
            font-size: clamp(0.9rem, 1.2vw, 1.2rem); 
            letter-spacing: 1px;
        }

        /* טקסט ה-SVG */
        text {
            fill: rgba(255,255,255,0.7);
            font-size: 11px;
            font-weight: 300;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* התאמה לניידים */
        @media (max-width: 850px) {
            body { overflow-y: auto; }
            .main-container { 
                flex-direction: column; 
                text-align: center; 
                padding: 40px 20px;
                gap: 40px;
            }
            .copy-content { text-align: center; order: 2; }
            .visual-frame { order: 1; }
            .stage { width: 85vw; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <div class="copy-content">
            <h1>הפעם זה לא עוד<br>אלבום תמונות.</h1>
            <p>הפעם זה <span class="hotam-word">חותם</span> שנשאר לדורות.</p>
        </div>

        <div class="visual-frame">
            <div class="stage">
                <div class="disc-base"></div>
                
                <div class="rotating-ring">
                    <svg viewBox="0 0 300 300">
                        <defs>
                            <path id="textPath" d="M 150, 150 m -120, 0 a 120,120 0 1,1 240,0 a 120,120 0 1,1 -240,0"/>
                        </defs>
                        <g class="spin-anim">
                            <text>
                                <textPath href="#textPath">
                                    • חותם שנשאר לדורות • סיפורי משפחה ומורשת • זיכרון דיגיטלי נצחי • מנציחים את הסיפור שלכם •
                                </textPath>
                            </text>
                        </g>
                    </svg>
                </div>

                <a href="https://hotam.vip/start" class="center-label">
                    <span>התחל</span>
                    <span style="font-size: 1.8rem; margin-top: 5px;">📜</span>
                </a>
            </div>
        </div>

    </div>

</body>
</html>
