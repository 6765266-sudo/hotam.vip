<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>חותם שנשאר לדורות</title>
  <style>
    :root{
      --bg:#e9e0d6;
      --disk:#0b0b0b;
      --disk2:#101010;

      /* קוטר הדיסק רספונסיבי */
      --diskSize: min(92vw, 820px);

      /* רדיוס למסלול הכרטיסים (קטן מספיק כדי להישאר בתוך הדיסק) */
      --ringR: calc(var(--diskSize) * 0.36);

      /* גודל כרטיס */
      --cardW: clamp(170px, calc(var(--diskSize) * 0.23), 240px);
      --cardH: clamp(100px, calc(var(--diskSize) * 0.14), 150px);

      /* מרכז */
      --hub: clamp(120px, calc(var(--diskSize) * 0.22), 190px);
      --hubInner: clamp(58px, calc(var(--diskSize) * 0.10), 85px);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", Arial;
      background: radial-gradient(1200px 800px at 50% 35%, #f3ece4 0%, var(--bg) 55%, #e3d7cb 100%);
      min-height:100vh;
      display:grid;
      place-items:center;
      overflow-x:hidden;
      color:#111;
    }

    /* רקע “ישן/עדין” כמו נייר (אפשר לבטל אם לא רוצים) */
    body:before{
      content:"";
      position:fixed; inset:0;
      background:
        radial-gradient(900px 600px at 30% 20%, rgba(0,0,0,.05), transparent 60%),
        radial-gradient(900px 600px at 70% 80%, rgba(0,0,0,.06), transparent 60%),
        repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 2px, rgba(0,0,0,.02) 2px 4px);
      mix-blend-mode: multiply;
      opacity:.35;
      pointer-events:none;
    }

    .stage{
      width: var(--diskSize);
      height: var(--diskSize);
      position:relative;
      filter: drop-shadow(0 22px 45px rgba(0,0,0,.25));
    }

    .disk{
      width:100%;
      height:100%;
      border-radius:50%;
      position:absolute; inset:0;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.08) 0 8%, transparent 9% 100%),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.03) 0 35%, rgba(0,0,0,.15) 60%, rgba(0,0,0,.35) 100%),
        repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.05) 0 2px, rgba(255,255,255,.00) 2px 7px),
        linear-gradient(145deg, var(--disk2), var(--disk));
      overflow:hidden;
    }

    /* “חור דיסק” — מרכז */
    .hub{
      position:absolute;
      left:50%; top:50%;
      width: var(--hub);
      height: var(--hub);
      transform: translate(-50%,-50%);
      border-radius:50%;
      background: radial-gradient(circle, rgba(255,255,255,.92) 0%, rgba(255,255,255,.88) 35%, rgba(235,235,235,.95) 100%);
      box-shadow: 0 10px 25px rgba(0,0,0,.25);
      display:grid;
      place-items:center;
      z-index:5;
    }

    .hubInner{
      width: var(--hubInner);
      height: var(--hubInner);
      border-radius:50%;
      background: rgba(30,30,30,.28);
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.22);
      display:grid;
      place-items:center;
      cursor:pointer;
      transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
      color:#fff;
      font-weight:700;
      letter-spacing:.5px;
    }
    .hubInner:hover{
      background: rgba(255,255,255,.22);
      box-shadow: 0 0 0 6px rgba(255,255,255,.08), inset 0 0 0 1px rgba(255,255,255,.25);
      transform: scale(1.05);
    }

    /* טקסט מעגלי סביב הכפתור */
    .ringText{
      position:absolute;
      left:50%; top:50%;
      width: calc(var(--hub) * 1.55);
      height: calc(var(--hub) * 1.55);
      transform: translate(-50%,-50%);
      z-index:6;
      pointer-events:none;
      opacity:.9;
    }
    .ringText text{
      fill: rgba(255,255,255,.75);
      font-weight:600;
      font-size: 14px;
      letter-spacing: 2px;
    }

    /* כרטיסים סביב הדיסק */
    .card{
      position:absolute;
      left:50%; top:50%;
      width: var(--cardW);
      height: var(--cardH);
      transform:
        translate(-50%,-50%)
        translate(calc(cos(var(--a)) * var(--ringR)), calc(sin(var(--a)) * var(--ringR)));
      border-radius:16px;
      overflow:hidden;
      background: rgba(0,0,0,.35);
      box-shadow: 0 10px 26px rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.06);
      z-index:3;
    }

    /* כדי “להעמיק” למראה תלת־ממדי */
    .card:after{
      content:"";
      position:absolute; inset:0;
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.20));
      pointer-events:none;
    }

    .card img,
    .card video{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      filter: contrast(1.02) saturate(.95);
    }

    .label{
      position:absolute;
      right:10px;
      bottom:10px;
      left:10px;
      color:#fff;
      text-shadow: 0 2px 10px rgba(0,0,0,.8);
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:10px;
      z-index:2;
    }

    .label .title{
      font-weight:800;
      font-size: clamp(12px, 1.4vw, 16px);
      line-height:1.05;
      margin:0;
    }
    .label .sub{
      font-weight:600;
      opacity:.9;
      font-size: clamp(10px, 1.1vw, 13px);
      margin:0;
      line-height:1.1;
    }

    /* רקע עדין לכיתוב כדי שלא ייחתך/ייעלם */
    .labelBox{
      padding:8px 10px;
      border-radius:12px;
      background: rgba(0,0,0,.35);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,.08);
      max-width: 100%;
    }

    /* “סימטריה מושלמת”: 8 זוויות בדיוק כמו שעון */
    /* 12:00 = -90deg, ואז כל 45deg */
    .a0{ --a: -90deg; } /* 12 */
    .a1{ --a: -45deg; } /* 1:30 */
    .a2{ --a: 0deg; }   /* 3 */
    .a3{ --a: 45deg; }  /* 4:30 */
    .a4{ --a: 90deg; }  /* 6 */
    .a5{ --a: 135deg; } /* 7:30 */
    .a6{ --a: 180deg; } /* 9 */
    .a7{ --a: 225deg; } /* 10:30 */

    /* מובייל: מקטינים מרכז, רדיוס, וכרטיסים כדי שלא “יתפוצץ” הלבן */
    @media (max-width: 520px){
      :root{
        --diskSize: 96vw;
        --ringR: calc(var(--diskSize) * 0.34);
        --cardW: clamp(140px, calc(var(--diskSize) * 0.28), 200px);
        --cardH: clamp(86px, calc(var(--diskSize) * 0.16), 120px);
        --hub: clamp(95px, calc(var(--diskSize) * 0.20), 140px);
        --hubInner: clamp(52px, calc(var(--diskSize) * 0.11), 70px);
      }
      .ringText text{ font-size: 12px; letter-spacing: 1.5px; }
    }

    /* תמיכה ל-cos/sin ב-Chrome/Edge מודרני.
       אם אצלך זה לא נתמך, אגיד לך חלופה עם JS (אבל לרוב זה עובד). */
  </style>
</head>
<body>
  <div class="stage">
    <div class="disk"></div>

    <!-- 8 כרטיסים מסביב לדיסק (תמונות + וידאו) -->
    <!-- שים לב: השתמשתי בשמות שיש לך עכשיו בתיקיית assets -->
    <div class="card a0">
      <video src="assets/faith1.mp4" muted autoplay loop playsinline></video>
      <div class="label"><div class="labelBox">
        <p class="title">אמונה</p><p class="sub">רגע קטן מאיר</p>
      </div></div>
    </div>

    <div class="card a1">
      <img src="assets/still1_real.jpg" alt="still1" />
      <div class="label"><div class="labelBox">
        <p class="title">משפחה</p><p class="sub">מכתב שנשמר</p>
      </div></div>
    </div>

    <div class="card a2">
      <video src="assets/faith2.mp4" muted autoplay loop playsinline></video>
      <div class="label"><div class="labelBox">
        <p class="title">בית של פעם</p><p class="sub">שבת, אור ושקט</p>
      </div></div>
    </div>

    <div class="card a3">
      <img src="assets/still2_real.jpg" alt="still2" />
      <div class="label"><div class="labelBox">
        <p class="title">זיכרון חי</p><p class="sub">שלא הולך לאיבוד</p>
      </div></div>
    </div>

    <div class="card a4">
      <video src="assets/faith3.mp4" muted autoplay loop playsinline></video>
      <div class="label"><div class="labelBox">
        <p class="title">לימוד</p><p class="sub">דף ועוד דף</p>
      </div></div>
    </div>

    <div class="card a5">
      <img src="assets/still3_real.jpg" alt="still3" />
      <div class="label"><div class="labelBox">
        <p class="title">לב</p><p class="sub">רגע שמחבר</p>
      </div></div>
    </div>

    <div class="card a6">
      <video src="assets/faith4.mp4" muted autoplay loop playsinline></video>
      <div class="label"><div class="labelBox">
        <p class="title">שבת</p><p class="sub">אור בבית</p>
      </div></div>
    </div>

    <div class="card a7">
      <img src="assets/still4_real.jpg" alt="still4" />
      <div class="label"><div class="labelBox">
        <p class="title">חותם</p><p class="sub">שנשאר לדורות</p>
      </div></div>
    </div>

    <!-- מרכז -->
    <div class="hub" aria-label="מרכז">
      <!-- טקסט מעגלי סביב הכפתור -->
      <svg class="ringText" viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <path id="circlePath" d="M100,100 m-70,0 a70,70 0 1,1 140,0 a70,70 0 1,1 -140,0"/>
        </defs>
        <text>
          <textPath href="#circlePath" startOffset="50%" text-anchor="middle">
            חותם שנשאר לדורות • זיכרונות • ערכים • אמונה • משפחה •
          </textPath>
        </text>
      </svg>

      <div class="hubInner" id="pressBtn">לחץ</div>
    </div>
  </div>

  <script>
    // אם הדפדפן חוסם autoplay לוידאו – ננסה להפעיל שוב בלחיצה.
    document.getElementById('pressBtn').addEventListener('click', () => {
      document.querySelectorAll('video').forEach(v => {
        v.muted = true;
        const p = v.play();
        if (p && p.catch) p.catch(()=>{});
      });
    });
  </script>
</body>
</html>
