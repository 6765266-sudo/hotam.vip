<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>hotam.vip</title>

  <style>
    :root{
      /* ========= כיוונון עדין (תזיז רק את זה אם צריך) ========= */
      --shift-x: 12px;   /* הזזה של כל הדיסק ימינה/שמאלה */
      --shift-y: 0px;    /* הזזה למעלה/למטה */
      --ring-radius: clamp(240px, 34vmin, 380px); /* כמה הכרטיסים רחוקים מהמרכז */
      --disc-size: clamp(560px, 86vmin, 940px);   /* גודל הדיסק */

      /* מרכז */
      --center-pct: 44%; /* העיגול הלבן מתוך הדיסק (דסקטופ) */

      /* כרטיסים */
      --slot-w: clamp(190px, 22vmin, 260px);
      --slot-h: clamp(112px, 13vmin, 150px);
      --slot-radius: 18px;

      /* צבעים */
      --bg: #efe7db;
      --disc: #070707;
      --muted: rgba(0,0,0,0.65);

      --shadow: 0 18px 45px rgba(0,0,0,0.35);
      --soft: 0 10px 25px rgba(0,0,0,0.25);
      --center-shadow: 0 16px 40px rgba(0,0,0,0.25);

      --font: system-ui, -apple-system, "Segoe UI", Arial, "Heebo", "Rubik", sans-serif;
    }

    /* ========= מובייל ========= */
    @media (max-width: 720px){
      :root{
        --shift-x: 0px;
        --shift-y: 0px;
        --disc-size: 94vmin;                 /* דיסק כמעט מסך */
        --ring-radius: clamp(160px, 33vmin, 270px);
        --slot-w: clamp(150px, 44vw, 190px);
        --slot-h: clamp(92px, 26vw, 120px);
        --center-pct: 34%;                   /* <- כאן הקטנתי את הלבן במובייל */
      }
    }

    html,body{height:100%;}
    body{
      margin:0;
      font-family: var(--font);
      background: radial-gradient(1200px 700px at 50% 35%, #fff6ea 0%, var(--bg) 55%, #e8ddcf 100%);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    .stage{
      width:100vw;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 18px;
      box-sizing:border-box;
    }

    .disc-wrap{
      position:relative;
      width: var(--disc-size);
      height: var(--disc-size);
      transform: translate(var(--shift-x), var(--shift-y));
    }

    .disc{
      position:absolute;
      inset:0;
      border-radius:50%;
      background:
        repeating-radial-gradient(circle at 50% 50%, var(--disc) 0 6px, rgba(255,255,255,0.02) 6px 7px),
        radial-gradient(circle at 50% 50%, #111 0%, #050505 60%, #000 100%);
      box-shadow: var(--shadow);
    }

    .center{
      position:absolute;
      left:50%;
      top:50%;
      width: var(--center-pct);
      height: var(--center-pct);
      transform: translate(-50%,-50%);
      border-radius:50%;
      background: radial-gradient(circle at 35% 30%, #ffffff 0%, #f2f2f2 55%, #e9e9e9 100%);
      box-shadow: var(--center-shadow);
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding: 18px;
      box-sizing:border-box;
    }

    .center-inner{
      width: 100%;
      max-width: 360px;
      display:flex;
      flex-direction:column;
      gap: 10px;
      align-items:center;
      justify-content:center;
    }

    .title{
      font-size: clamp(18px, 2.4vmin, 34px);
      font-weight: 800;
      line-height: 1.15;
      margin:0;
      color:#0b0b0b;
    }
    .subtitle{
      margin:0;
      font-size: clamp(12px, 1.5vmin, 16px);
      color: var(--muted);
      line-height: 1.35;
    }
    .cta{
      border:0;
      background: #111;
      color:#fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 700;
      cursor:pointer;
      box-shadow: var(--soft);
      font-size: 14px;
    }
    .brand{
      font-size: 12px;
      color: rgba(0,0,0,0.45);
      margin-top: 2px;
    }

    /* ========= Slots ========= */
    .slot{
      position:absolute;
      left:50%;
      top:50%;
      width: var(--slot-w);
      height: var(--slot-h);
      transform:
        translate(-50%,-50%)
        rotate(var(--a))
        translateX(var(--ring-radius))
        rotate(calc(var(--a) * -1));

      border-radius: var(--slot-radius);
      overflow:hidden;
      background: rgba(255,255,255,0.06);
      box-shadow: var(--soft);
      outline: 1px solid rgba(255,255,255,0.08);
    }

    .media{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
      transform: scale(1.01);
    }

    .slot::before{
      content:"";
      position:absolute;
      inset:0;
      background: linear-gradient(180deg, rgba(0,0,0,0.18) 0%, rgba(0,0,0,0.02) 45%, rgba(0,0,0,0.62) 100%);
      pointer-events:none;
      z-index: 2;
    }

    .label{
      position:absolute;
      right: 12px;
      left: 12px;
      bottom: 10px;
      z-index: 3;
      color:#fff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.55);
    }
    .label .h{
      font-weight: 800;
      font-size: 14px;
      margin:0;
      line-height: 1.1;
    }
    .label .p{
      margin: 4px 0 0;
      font-size: 12px;
      opacity: 0.9;
      line-height: 1.2;
    }

    .fallback{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background: rgba(0,0,0,0.55);
      color: rgba(255,255,255,0.9);
      font-size: 12px;
      z-index: 5;
      padding: 10px;
      text-align:center;
    }
  </style>
</head>

<body>
  <div class="stage">
    <div class="disc-wrap">
      <div class="disc"></div>
      <div id="slotsRoot"></div>

      <div class="center">
        <div class="center-inner">
          <h1 class="title">חותם שנשאר לדורות</h1>
          <p class="subtitle">זכרונות ערכיים, אמונה, משפחה וזיכרון.</p>
          <button class="cta" onclick="alert('כאן יגיע השאלון/המשך');">להתחיל בשאלון קצר</button>
          <div class="brand">© hotam.vip</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const ASSET_BASE = "./assets/";

    // לפי הצילום שלך (מדויק!)
    const items = [
      { type: "video", src: "faith1.mp4", title: "אמונה", sub: "רגע קטן מאיר" },
      { type: "video", src: "faith2.mp4", title: "בית של פעם", sub: "שבת, אור ושקט" },
      { type: "video", src: "faith3.mp4", title: "לימוד", sub: "דף ועוד דף" },
      { type: "video", src: "faith4.mp4", title: "שבת", sub: "אור בבית" },

      { type: "image", src: "still1_real.jpg", title: "זיכרון חי", sub: "שלא הולך לאיבוד" },
      { type: "image", src: "still2_real.jpg", title: "משפחה", sub: "מכתב שנשמר" },
      { type: "image", src: "still3_real.jpg", title: "לב", sub: "רגע שמחבר" },
      { type: "image", src: "still4_real.jpg", title: "חותם", sub: "שנשאר לדורות" },
    ];

    // 8 נקודות סביב הדיסק (לשמור יציב)
    // סדר: למעלה, ימין-למעלה, ימין, ימין-למטה, למטה, שמאל-למטה, שמאל, שמאל-למעלה
    const angles = [270, 315, 0, 45, 90, 135, 180, 225];

    const slotsRoot = document.getElementById("slotsRoot");

    function makeSlot(item, angleDeg){
      const slot = document.createElement("div");
      slot.className = "slot";
      slot.style.setProperty("--a", angleDeg + "deg");

      const label = document.createElement("div");
      label.className = "label";
      label.innerHTML = `
        <p class="h">${escapeHtml(item.title || "")}</p>
        <p class="p">${escapeHtml(item.sub || "")}</p>
      `;

      const fullSrc = ASSET_BASE + item.src;

      if(item.type === "video"){
        const v = document.createElement("video");
        v.className = "media";
        v.src = fullSrc;
        v.muted = true;
        v.loop = true;
        v.playsInline = true;
        v.autoplay = true;
        v.preload = "metadata";

        v.addEventListener("canplay", () => {
          const p = v.play();
          if (p && typeof p.catch === "function") p.catch(() => {});
        });
        v.addEventListener("error", () => showFallback(slot, "וידאו לא נטען (בדוק שם/סיומת)"));
        slot.appendChild(v);
      } else {
        const img = document.createElement("img");
        img.className = "media";
        img.src = fullSrc;
        img.alt = item.title || "תמונה";
        img.loading = "lazy";
        img.decoding = "async";
        img.addEventListener("error", () => showFallback(slot, "תמונה לא נטענה (בדוק שם/סיומת)"));
        slot.appendChild(img);
      }

      slot.appendChild(label);
      return slot;
    }

    function showFallback(slot, text){
      if (slot.querySelector(".fallback")) return;
      const fb = document.createElement("div");
      fb.className = "fallback";
      fb.textContent = text;
      slot.appendChild(fb);
    }

    function escapeHtml(str){
      return String(str).replace(/[&<>"']/g, s => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[s]));
    }

    items.slice(0, 8).forEach((item, i) => {
      const angle = angles[i] ?? (i * 45);
      slotsRoot.appendChild(makeSlot(item, angle));
    });
  </script>
</body>
</html>
