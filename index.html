<!doctype html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>hotam.vip | חותם - זיכרון דיגיטלי</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #efe7db; --accent: #7a5a2b; --gold: #c5a059; }
        
        body { 
            margin: 0; background: var(--bg); 
            background-image: url("https://www.transparenttextures.com/patterns/aged-paper.png");
            font-family: 'Assistant', sans-serif; 
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }

        /* הקופסה ששומרת שהכל יישאר ביחד */
        .master-container {
            position: relative;
            width: 600px;
            height: 700px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* כותרת עליונה צמודה ומעוגלת */
        .header-arc {
            width: 100%;
            height: 120px;
            margin-bottom: -50px;
            z-index: 50;
        }

        /* הדיסק השחור - הבסיס להכל */
        .main-disc {
            position: relative;
            width: 520px;
            height: 520px;
            background: radial-gradient(circle, #222 0%, #000 100%);
            border-radius: 50%;
            box-shadow: 0 40px 100px rgba(0,0,0,0.6);
            border: 4px solid #111;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* חריצי תקליט יוקרתיים */
        .main-disc::before {
            content: ""; position: absolute; inset: 0; border-radius: 50%;
            background: repeating-radial-gradient(circle, transparent 0, transparent 2px, rgba(255,255,255,0.02) 3px);
            pointer-events: none;
        }

        /* עיצוב המדיה בתוך הדיסק */
        .media-slot {
            position: absolute;
            width: 110px;
            height: 85px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.8);
            border: 1.5px solid rgba(255,255,255,0.2);
            background: #000;
            z-index: 10;
        }
        .media-slot video, .media-slot img { width: 100%; height: 100%; object-fit: cover; }

        /* מיקומים מדויקים בתוך הדיסק (מחושב לפי 520px) */
        .p1 { top: 40px; left: 205px; } 
        .p2 { top: 110px; right: 50px; } 
        .p3 { bottom: 110px; right: 50px; } 
        .p4 { bottom: 40px; left: 205px; } 
        .p5 { bottom: 110px; left: 50px; } 
        .p6 { top: 110px; left: 50px; } 

        /* מלל מסתובב באמצע */
        .rotating-ring {
            position: absolute;
            width: 260px;
            height: 260px;
            z-index: 5;
            animation: rotateText 40s linear infinite;
        }
        @keyframes rotateText { to { transform: rotate(360deg); } }

        /* כפתור התחל מרכזי */
        .start-btn {
            position: absolute;
            z-index: 100;
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, #ffffff 40%, #f0f0f0 100%);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 4px solid #fff;
            transition: transform 0.2s;
        }
        .start-btn:hover { transform: scale(1.05); }
        .start-btn b { color: #000; font-size: 1.3rem; font-weight: 900; }

        svg { width: 100%; height: 100%; overflow: visible; }
        .arc-text { font-size: 22px; font-weight: 800; fill: #1a1a1a; letter-spacing: -0.5px; }
        .inner-ring-text { font-size: 13px; font-weight: 700; fill: rgba(255,255,255,0.85); }

        @media (max-width: 650px) {
            .master-container { transform: scale(0.6); }
        }
    </style>
</head>
<body>

    <div class="master-container">
        <div class="header-arc">
            <svg viewBox="0 0 600 120">
                <path id="curvePath" d="M 60,110 A 240,100 0 0,1 540,110" fill="none" />
                <text class="arc-text">
                    <textPath href="#curvePath" startOffset="50%" text-anchor="middle">
                        הפעם זה לא עוד אלבום תמונות. הפעם זה <tspan fill="#7a5a2b">חותם</tspan> שנשאר לדורות.
                    </textPath>
                </text>
            </svg>
        </div>

        <div class="main-disc">
            <div class="media-slot p1"><video autoplay muted loop playsinline><source src="faith1.mp4" type="video/mp4"></video></div>
            <div class="media-slot p2"><img src="still1_real.jpg"></div>
            <div class="media-slot p3"><video autoplay muted loop playsinline><source src="faith2.mp4" type="video/mp4"></video></div>
            <div class="media-slot p4"><img src="still2_real.jpg"></div>
            <div class="media-slot p5"><video autoplay muted loop playsinline><source src="faith3.mp4" type="video/mp4"></video></div>
            <div class="media-slot p6"><img src="still4_real.jpg"></div>

            <div class="rotating-ring">
                <svg viewBox="0 0 200 200">
                    <path id="ringPath" d="M 100, 100 m -85, 0 a 85,85 0 1,1 170,0 a 85,85 0 1,1 -170,0" fill="none" />
                    <text class="inner-ring-text">
                        <textPath href="#ringPath">
                            • סיפורי משפחה ומורשת • חותם שנשאר לדורות • זיכרון אבות •
                        </textPath>
                    </text>
                </svg>
            </div>

            <a href="https://hotam.vip/forum" class="start-btn">
                <b>התחל</b>
                <span style="font-size: 1.8rem;">📜</span>
            </a>
        </div>
    </div>

</body>
</html>
