<!doctype html>

    <style>

            font-family: 'Assistant', sans-serif; 
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }

        .main-container {
            width: min(95vw, 700px);
            aspect-ratio: 1/1;
            position: relative;
        }

        svg { width: 100%; height: 100%; display: block; overflow: visible; }

        /* אנימציית סיבוב לטקסט הפנימי */
        .rotating { transform-origin: center; animation: spin 40s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* כפתור מרכזי */
        .center-link { cursor: pointer; transition: transform 0.3s; }
        .center-link:hover { transform: scale(1.05); }
        
        /* עיצוב התמונות בתוך ה-SVG */
        .memory-photo { clip-path: inset(0 round 8px); pointer-events: none; }
    </style>
</head>
