<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>חותם</title>

  <style>
    :root{
      --bg:#efe7dc;
      --discBase:#0e0f10;

      --cardW:20.5%;
      --cardRadius:14px;
      --orbit:67%;

      /* סיבוב טקסט מעגלי – קטן יותר = יותר מהר */
      --spinSeconds:60s;

      --hubSize:24%;
      --hubOuter:#d7d7d7;
      --hubInner:#bdbdbd;

      --shadow:0 22px 55px rgba(0,0,0,.35);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:radial-gradient(1200px 800px at 50% 30%,#fff6ea 0%,var(--bg) 55%,#e6ddcf 100%);
      font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
    }

    .stage{
      width:min(980px,92vw);
      position:relative;
    }
    .stage::before{content:"";display:block;padding-top:100%}

    .disc{
      position:absolute;
      inset:0;
      border-radius:50%;
      background:
        repeating-radial-gradient(circle at 50% 50%,
          rgba(255,255,255,.045) 0 2px,
          rgba(255,255,255,0) 2px 8px),
        radial-gradient(circle at 50% 50%,#121314 0%,var(--discBase) 72%,#070708 100%);
      box-shadow:var(--shadow);
      overflow:hidden;
      transform:translateZ(0);
    }

    /* טקסט מעגלי */
    .ring{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      pointer-events:none;
      z-index:3;
    }
    .ring svg{
      width:48%;
      height:48%;
      aspect-ratio:1/1;
      display:block;
    }
    .ring-spin{
      transform-origin:50% 50%;
      animation:spin var(--spinSeconds) linear infinite;
    }
    @keyframes spin{
      from{transform:rotate(0)}
      to{transform:rotate(360deg)}
    }

    /* טקסט מרכזי (הוחזר) */
    .centerCopy{
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      width:min(380px,40%);
      text-align:center;
      z-index:4;
      pointer-events:none;
      color:rgba(255,255,255,.92);
      text-shadow:0 2px 18px rgba(0,0,0,.55);
    }
    .centerCopy .title{
      font-weight:950;
      letter-spacing:.2px;
      font-size:clamp(16px,2.2vw,22px);
      margin:0 0 6px;
    }
    .centerCopy .sub{
      margin:0;
      font-weight:800;
      font-size:clamp(12px,1.5vw,14px);
      opacity:.92;
    }
    .centerCopy .hint{
      margin:10px 0 0;
      font-weight:800;
      font-size:clamp(11px,1.4vw,12px);
      opacity:.85;
    }

    /* תמונות/וידאו על הדיסק */
    .slot{
      position:absolute;
      width:var(--cardW);
      aspect-ratio:16/9;
      border-radius:var(--cardRadius);
      overflow:hidden;
      box-shadow:0 18px 30px rgba(0,0,0,.35);
      background:rgba(255,255,255,.06);
      transform:translate(-50%,-50%);
      z-index:2;
    }
    .slot img,.slot video{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    /* כיתוב על התמונות – ימין למטה + רספונסיבי */
    .caption{
      position:absolute;
      right:10px;
      bottom:10px;
      left:10px;  /* מאפשר שורות להישבר בלי להיעלם */
      display:flex;
      flex-direction:column;
      gap:2px;
      align-items:flex-end;
      text-align:right;
      color:rgba(255,255,255,.97);
      text-shadow:0 2px 12px rgba(0,0,0,.75);
      pointer-events:none;
    }

    /* במקום ... : מאפשר 2 שורות */
    .cap-title,
    .cap-sub{
      max-width:100%;
      display:-webkit-box;
      -webkit-box-orient:vertical;
      overflow:hidden;
      white-space:normal;
    }
    .cap-title{
      font-weight:950;
      font-size:clamp(12px,1.25vw,14px);
      line-height:1.15;
      -webkit-line-clamp:2;
    }
    .cap-sub{
      font-weight:850;
      font-size:clamp(10.5px,1.1vw,12px);
      line-height:1.15;
      opacity:.96;
      -webkit-line-clamp:2;
    }

    /* מרכז דיסק */
    .hub{
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      width:var(--hubSize);
      aspect-ratio:1/1;
      border-radius:50%;
      z-index:5;
      display:grid;
      place-items:center;
    }
    .hub-outer{
      width:100%;
      height:100%;
      border-radius:50%;
      background:radial-gradient(circle at 50% 50%,#f1f1f1 0 40%,var(--hubOuter) 40% 100%);
      box-shadow:0 10px 28px rgba(0,0,0,.28);
      display:grid;
      place-items:center;
    }
    .hub-inner{
      width:72%;
      height:72%;
      border-radius:50%;
      background:radial-gradient(circle at 50% 50%,#d7d7d7 0 35%,var(--hubInner) 35% 100%);
      box-shadow:
        inset 0 0 0 2px rgba(0,0,0,.10),
        inset 0 16px 22px rgba(0,0,0,.12);
      display:grid;
      place-items:center;
    }
    .startBtn{
      width:44%;
      height:44%;
      border-radius:50%;
      border:none;
      cursor:pointer;
      background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.28),rgba(0,0,0,.08));
      box-shadow:
        inset 0 0 0 2px rgba(0,0,0,.12),
        0 6px 14px rgba(0,0,0,.22);
      color:rgba(0,0,0,.78);
      font-weight:950;
      font-size:13px;
      letter-spacing:.3px;
      transition:transform .15s ease, filter .15s ease;
    }
    .startBtn:hover{filter:brightness(1.05);transform:translateY(-1px)}
    .startBtn:active{transform:translateY(0) scale(.98)}

    /* מובייל */
    @media(max-width:640px){
      :root{
        --cardW:25.5%;
        --orbit:70%;
        --spinSeconds:70s; /* טיפה יותר איטי במובייל */
        --hubSize:36%;
      }
      .ring svg{width:62%;height:62%}
      .centerCopy{width:min(320px,62%)}
      .caption{right:8px;bottom:8px;left:8px}
    }
  </style>
</head>

<body>
  <div class="stage">
    <div class="disc" id="disc">

      <!-- ✅ טקסט מעגלי (בלי CSS vars בתוך SVG כדי שיעבוד באייפון) -->
      <div class="ring" aria-hidden="true">
        <svg viewBox="0 0 300 300" preserveAspectRatio="xMidYMid meet">
          <defs>
            <!-- r=108 => היקף ~ 678.58 -->
            <path id="circlePath"
              d="M150,150 m-108,0 a108,108 0 1,1 216,0 a108,108 0 1,1 -216,0"/>
          </defs>

          <g class="ring-spin">
            <text
              fill="rgba(255,255,255,.78)"
              font-size="15"
              font-weight="900"
              letter-spacing=".2"
              lengthAdjust="spacing"
              textLength="679"
              style="paint-order:stroke; stroke: rgba(0,0,0,.45); stroke-width:1px;"
              direction="rtl"
              unicode-bidi="plaintext">
              <textPath href="#circlePath" startOffset="0%">
                • חותם שנשאר לדורות • מי היו סבא וסבתא • סיפורי משפחה ומורשת • המחשת גבורה ומסירות נפש •
              </textPath>
            </text>
          </g>
        </svg>
      </div>

      <!-- ✅ הטקסט במרכז (הוחזר) -->
      <div class="centerCopy" aria-hidden="true">
        <p class="title">חותם שנשאר לדורות</p>
        <p class="sub">סיפורי משפחה ומורשת • רגעים של רגש</p>
        <p class="hint">לחצו על “התחל” כדי להמשיך</p>
      </div>

      <div class="hub">
        <div class="hub-outer">
          <div class="hub-inner">
            <button class="startBtn" id="startBtn" type="button" title="התחל">התחל</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // 8 נקודות בשעון
    const anglesDeg = Array.from({length:8}, (_,i)=>-90 + i*45);

    // שמות קבצים לפי מה שיש אצלך בגיטהאב
    const items = [
      {type:"video",src:"assets/faith1.mp4",title:"זיכרון אבות",sub:"שלא יאבד"},
      {type:"img",  src:"assets/still2_real.jpg",title:"חותם שנשאר לדורות",sub:"שהנכדים ידעו"},
      {type:"video",src:"assets/faith2.mp4",title:"מתיקות התורה",sub:"של סבא"},
      {type:"img",  src:"assets/still3_real.jpg",title:"להעביר מורשת",sub:"מדור לדור"},
      {type:"img",  src:"assets/still4_real.jpg",title:"תפילין",sub:"האות שמחבר"},
      {type:"img",  src:"assets/still1_real.jpg",title:"מורשת",sub:"סבא ונכד"},
      {type:"video",src:"assets/faith4.mp4",title:"שבת בבית סבא",sub:"עונג, שלווה"},
      {type:"video",src:"assets/faith3.mp4",title:"מסירות נפש",sub:"רגע שמתחבר"},
    ];

    const disc = document.getElementById("disc");

    function createSlot(it){
      const s = document.createElement("div");
      s.className = "slot";

      if(it.type==="video"){
        const v=document.createElement("video");
        v.src=it.src;
        v.autoplay=true; v.muted=true; v.loop=true; v.playsInline=true;
        v.setAttribute("playsinline","");
        v.preload="metadata";
        s.appendChild(v);
      } else {
        const i=document.createElement("img");
        i.src=it.src;
        i.alt="";
        s.appendChild(i);
      }

      const c=document.createElement("div");
      c.className="caption";

      const t=document.createElement("div");
      t.className="cap-title";
      t.textContent=it.title;
      c.appendChild(t);

      if(it.sub && it.sub.trim()){
        const sb=document.createElement("div");
        sb.className="cap-sub";
        sb.textContent=it.sub;
        c.appendChild(sb);
      }

      s.appendChild(c);
      return s;
    }

    function layout(){
      const size = disc.clientWidth;
      const orbit = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--orbit"))/100;
      const R = (size/2) * orbit;
      const cx=size/2, cy=size/2;

      disc.querySelectorAll(".slot").forEach((s,i)=>{
        const a = anglesDeg[i]*Math.PI/180;
        s.style.left = (cx + R*Math.cos(a)) + "px";
        s.style.top  = (cy + R*Math.sin(a)) + "px";
      });
    }

    // נקה סלוטים קודמים אם רעננת/הדבקת שוב
    disc.querySelectorAll(".slot").forEach(x=>x.remove());
    items.forEach(it=>disc.appendChild(createSlot(it)));

    layout();
    window.addEventListener("resize", layout);

    document.getElementById("startBtn").onclick = () => {
      // שנה ל-form.html אם זה שם הקובץ שלך בפועל
      location.href = "form.html";
    };
  </script>
</body>
</html>
