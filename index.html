<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hotam.vip</title>

  <style>
    :root{
      --bg: #efe7dc;

      --discA:#0f0f10;
      --discB:#101012;

      --cardW: 20.5%;
      --cardRadius: 14px;
      --orbit: 67%;

      --ringText: rgba(255,255,255,.74);
      --ringGlow: rgba(255,255,255,.20);
      --ringFont: 15px;

      --spinSeconds: 80s;

      --hubSize: 24%;

      --shadow: 0 22px 55px rgba(0,0,0,.35);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background: radial-gradient(1200px 800px at 50% 30%, #fff6ea 0%, var(--bg) 55%, #e6ddcf 100%);
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    }

    .stage{
      width:min(980px, 92vw);
      position:relative;
    }
    .stage::before{
      content:"";
      display:block;
      padding-top:100%;
    }

    /* ✅ עיגול נקי גם באייפון (מונע “חיתוך רועד” מסביב) */
    .disc{
      position:absolute;
      inset:0;
      border-radius:50%;
      background:
        repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.055) 0 2px, rgba(255,255,255,.00) 2px 8px),
        radial-gradient(circle at 50% 50%, var(--discA) 0%, var(--discB) 70%, #070708 100%);
      box-shadow: var(--shadow);
      overflow:hidden;
      transform: translateZ(0);
      -webkit-mask-image: -webkit-radial-gradient(white, black); /* iOS anti-jitter */
      will-change: transform;
    }

    /* --- טבעת טקסט מסתובבת --- */
    .ring{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      pointer-events:none;
      z-index: 3;
    }
    .ring svg{
      width:48%;
      height:48%;
      overflow:visible;
      filter: drop-shadow(0 1px 0 var(--ringGlow));
    }
    .ring-spin{
      transform-origin: 50% 50%;
      animation: spin var(--spinSeconds) linear infinite;
    }
    @keyframes spin{
      from{ transform: rotate(0deg); }
      to{ transform: rotate(360deg); }
    }

    /* --- כרטיסים --- */
    .slot{
      position:absolute;
      width: var(--cardW);
      aspect-ratio: 16 / 9;
      border-radius: var(--cardRadius);
      overflow:hidden;
      box-shadow: 0 18px 30px rgba(0,0,0,.35);
      background: rgba(255,255,255,.06);
      z-index: 2;
      transform: translate(-50%,-50%);
    }
    .slot img, .slot video{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    /* כתוביות – שמאל למטה, בלי רקע */
    .caption{
      position:absolute;
      left:10px;
      bottom:10px;
      right:10px;
      display:flex;
      flex-direction:column;
      gap:2px;
      align-items:flex-start;
      text-align:left;
      pointer-events:none;
      color: rgba(255,255,255,.95);
      text-shadow: 0 2px 10px rgba(0,0,0,.65);
    }
    .cap-title{
      font-weight:900;
      font-size:14px;
      line-height:1.1;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:100%;
    }
    .cap-sub{
      font-weight:800;
      font-size:12px;
      line-height:1.15;
      opacity:.95;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:100%;
    }

    /* --- מרכז דיסק (יותר CD-ROM) --- */
    .hub{
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      width: var(--hubSize);
      aspect-ratio:1/1;
      border-radius:50%;
      z-index: 4;
      display:grid;
      place-items:center;
      pointer-events:auto;
    }

    .hub-outer{
      width:100%;
      height:100%;
      border-radius:50%;
      background:
        radial-gradient(circle at 50% 38%,
          rgba(255,255,255,.95) 0 36%,
          rgba(235,235,235,.92) 36% 55%,
          rgba(255,255,255,.30) 55% 65%,
          rgba(255,255,255,.00) 65% 100%
        );
      box-shadow: 0 12px 34px rgba(0,0,0,.30);
      display:grid;
      place-items:center;
      position:relative;
      overflow:hidden;
    }
    /* היילייט עדין כמו פלסטיק */
    .hub-outer::before{
      content:"";
      position:absolute;
      inset:-20%;
      background: radial-gradient(circle at 35% 28%, rgba(255,255,255,.45), rgba(255,255,255,0) 55%);
      transform: rotate(-12deg);
      pointer-events:none;
    }

    .hub-mid{
      width:70%;
      aspect-ratio:1/1;
      border-radius:50%;
      background:
        radial-gradient(circle at 50% 35%, rgba(255,255,255,.18), rgba(130,130,130,.55));
      box-shadow:
        inset 0 0 0 2px rgba(0,0,0,.10),
        inset 0 18px 26px rgba(0,0,0,.12);
      display:grid;
      place-items:center;
      position:relative;
    }

    /* חור פנימי של דיסק */
    .hub-hole{
      position:absolute;
      width:34%;
      aspect-ratio:1/1;
      border-radius:50%;
      background:
        radial-gradient(circle at 50% 35%, rgba(255,255,255,.35), rgba(0,0,0,.12));
      box-shadow:
        inset 0 0 0 2px rgba(0,0,0,.14),
        0 6px 16px rgba(0,0,0,.20);
      display:grid;
      place-items:center;
    }

    .start{
      width:100%;
      height:100%;
      border-radius:50%;
      border:none;
      background: transparent;
      color: rgba(255,255,255,.92);
      cursor:pointer;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:6px;
      padding:8px;
      user-select:none;
      transition: transform .15s ease, filter .15s ease;
    }
    .start:hover{ filter: brightness(1.08); transform: translateY(-1px); }
    .start:active{ transform: translateY(0) scale(.98); }

    .hand{ font-size:20px; line-height:1; }
    .start-label{ font-weight:900; font-size:13px; }
    .start-sub{ font-weight:800; font-size:11px; opacity:.9; }

    /* מובייל */
    @media (max-width: 640px){
      :root{
        --cardW: 25.5%;
        --orbit: 70%;
        --spinSeconds: 92s;
        --ringFont: 12.5px;
        --hubSize: 36%;
      }
      .ring svg{ width:60%; height:60%; }
      .cap-title{ font-size:13px; }
      .cap-sub{ font-size:11px; }
    }
  </style>
</head>

<body>
  <div class="stage">
    <div class="disc" id="disc">

      <!-- טבעת טקסט מסתובבת (RTL יציב יותר) -->
      <div class="ring" aria-hidden="true">
        <svg viewBox="0 0 300 300">
          <defs>
            <path id="circlePath" d="M150,150 m-108,0 a108,108 0 1,1 216,0 a108,108 0 1,1 -216,0" />
          </defs>

          <g class="ring-spin">
            <text
              fill="var(--ringText)"
              font-size="var(--ringFont)"
              font-weight="900"
              letter-spacing="1.05"
              direction="rtl"
              unicode-bidi="plaintext"
            >
              <textPath href="#circlePath" startOffset="50%" text-anchor="middle">
                חותם שנשאר לדורות • מי היו סבא וסבתא • סיפורי משפחה ומורשת • המחשת גבורה ומסירות נפש •
              </textPath>
            </text>
          </g>
        </svg>
      </div>

      <!-- מרכז דיסק -->
      <div class="hub">
        <div class="hub-outer">
          <div class="hub-mid">
            <div class="hub-hole">
              <button class="start" id="startBtn" type="button" title="התחל">
                <div class="hand">👆</div>
                <div class="start-label">התחל</div>
                <div class="start-sub">חותם</div>
              </button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    /*
      ✅ סימטריה מלאה: 8 פריטים סביב הדיסק כל 45°
      סדר לפי כיוון השעון:
      12, 1:30, 3, 4:30, 6, 7:30, 9, 10:30
    */

    const items = [
      // 12:00
      { type:"video", src:"assets/faith1.mp4",      title:"זיכרון אבות",           sub:"שלא יאבד" },

      // 1:30 (סבא ונכד – נשאר בצד ימין למעלה)
      { type:"img",   src:"assets/still2_real.jpg", title:"חותם שנשאר לדורות",     sub:"שהנכדים ידעו" },

      // 3:00 (סבא לומד)
      { type:"video", src:"assets/faith2.mp4",      title:"מתיקות התורה",          sub:"של סבא" },

      // 4:30 (מורשת מדור לדור)
      { type:"img",   src:"assets/still3_real.jpg", title:"להעביר מורשת",          sub:"מדור לדור" },

      // 6:00 ✅ כאן שמתי את “סבא ונכד” ובכותרת “מורשת”
      { type:"img",   src:"assets/still4_real.jpg", title:"מורשת",                sub:"סבא ונכד" },

      // 7:30 (תפילין)
      { type:"img",   src:"assets/still1_real.jpg", title:"תפילין",               sub:"האות שמחבר" },

      // 9:00 (נרות שבת)
      { type:"video", src:"assets/faith4.mp4",      title:"שבת",                  sub:"עונג, רוגע, שלווה" },

      // 10:30 (מסירות נפש / ידיים)
      { type:"video", src:"assets/faith3.mp4",      title:"מסירות נפש",           sub:"רגע שמתחבר" },
    ];

    const anglesDeg = Array.from({length: 8}, (_, i) => -90 + i * 45);

    const disc = document.getElementById("disc");

    function createSlot(item){
      const slot = document.createElement("div");
      slot.className = "slot";

      if(item.type === "video"){
        const v = document.createElement("video");
        v.src = item.src;
        v.autoplay = true;
        v.muted = true;
        v.loop = true;
        v.playsInline = true;
        v.setAttribute("playsinline", "");
        v.preload = "metadata";
        slot.appendChild(v);
      } else {
        const img = document.createElement("img");
        img.src = item.src;
        img.alt = "";
        slot.appendChild(img);
      }

      const cap = document.createElement("div");
      cap.className = "caption";

      const t = document.createElement("div");
      t.className = "cap-title";
      t.textContent = item.title;

      const s = document.createElement("div");
      s.className = "cap-sub";
      s.textContent = item.sub;

      cap.appendChild(t);
      cap.appendChild(s);
      slot.appendChild(cap);

      return slot;
    }

    function layout(){
      const size = disc.clientWidth;
      const cx = size / 2;
      const cy = size / 2;

      const orbitStr = getComputedStyle(document.documentElement).getPropertyValue("--orbit").trim();
      const orbitPercent = parseFloat(orbitStr) || 67;
      const R = (size / 2) * (orbitPercent / 100);

      const slots = disc.querySelectorAll(".slot");
      slots.forEach((slot, i) => {
        const a = anglesDeg[i] * Math.PI / 180;
        const x = cx + R * Math.cos(a);
        const y = cy + R * Math.sin(a);
        slot.style.left = x + "px";
        slot.style.top  = y + "px";
      });
    }

    items.forEach(it => disc.appendChild(createSlot(it)));

    layout();
    window.addEventListener("resize", layout);
    window.addEventListener("load", () => requestAnimationFrame(layout));

    // ✅ אחרי שתרצה – נחבר לפורום
    document.getElementById("startBtn").addEventListener("click", () => {
      window.location.href = "form.html";
    });
  </script>
</body>
</html>
