<!doctype html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>hotam.vip | חותם נצחי</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;700;800&family=Platypi:wght@800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #efe7db; --accent: #7a5a2b; --gold: #c5a059; }
        
        body { 
            margin: 0; 
            background: var(--bg); 
            background-image: url("https://www.transparenttextures.com/patterns/aged-paper.png");
            font-family: 'Assistant', sans-serif; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* מבנה המחלק את המסך ל-2 */
        .wrapper {
            display: flex;
            width: 95%;
            max-width: 1100px;
            align-items: center;
            justify-content: space-between;
            gap: 50px;
        }

        /* קופי שיווקי */
        .content {
            flex: 1;
            text-align: right;
            z-index: 10;
        }

        .content h1 {
            font-size: clamp(2rem, 4vw, 3rem);
            margin: 0;
            line-height: 1.2;
            font-weight: 800;
        }

        .content p {
            font-size: clamp(1.2rem, 2.5vw, 1.8rem);
            margin-top: 10px;
        }

        /* אזור הדיסק - מוגבל בגודל כדי שלא ישתלט */
        .visual {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .stage { 
            width: min(65vmin, 480px); 
            height: min(65vmin, 480px);
            position: relative; 
        }

        .disc { 
            position: absolute; 
            inset: 0; 
            border-radius: 50%; 
            background: radial-gradient(circle, #222 0%, #000 100%); 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 2px solid #111;
        }

        /* חריצי תקליט */
        .disc::before {
            content: "";
            position: absolute;
            inset: 2px;
            border-radius: 50%;
            background: repeating-radial-gradient(circle, transparent 0, transparent 3px, rgba(255,255,255,0.02) 4px);
        }

        .ring { 
            position: absolute; 
            inset: 0; 
            display: grid; 
            place-items: center; 
        }

        /* אנימציית סיבוב */
        .ring-spin { 
            animation: rotateDisk 20s linear infinite; 
            transform-origin: center;
            width: 100%;
            height: 100%;
        }

        @keyframes rotateDisk { to { transform: rotate(360deg); } }

        /* מרכז הדיסק - כפתור "התחל" */
        .center-hub { 
            position: absolute; 
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 30%; 
            height: 30%; 
            background: radial-gradient(circle, #fff 0%, #e0e0e0 100%); 
            border-radius: 50%; 
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid #ccc;
            transition: all 0.3s ease;
        }

        .center-hub:hover { transform: translate(-50%, -50%) scale(1.05); box-shadow: 0 6px 15px rgba(0,0,0,0.4); }
        .center-hub span { color: #000; font-weight: 800; font-size: 1.1rem; }

        /* הגדרות SVG לטקסט המעגלי */
        svg { width: 100%; height: 100%; overflow: visible; }
        text { fill: rgba(255,255,255,0.8); font-size: 13px; font-weight: 300; letter-spacing: 1px; }

        /* רספונסיביות לנייד */
        @media (max-width: 768px) {
            .wrapper { flex-direction: column-reverse; text-align: center; gap: 30px; }
            .content { text-align: center; }
            .stage { width: 80vw; height: 80vw; }
            body { overflow-y: auto; padding: 40px 0; }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="content">
            <h1>הפעם זה לא עוד<br>אלבום תמונות.</h1>
            <p>הפעם זה <span style="color:var(--accent); font-weight:800; border-bottom: 2px solid var(--gold);">חותם</span> שנשאר לדורות.</p>
        </div>

        <div class="visual">
            <main class="stage">
                <div class="disc"></div>
                
                <div class="ring">
                    <svg viewBox="0 0 300 300">
                        <defs>
                            <path id="circlePath" d="M 150, 150 m -125, 0 a 125,125 0 1,1 250,0 a 125,125 0 1,1 -250,0"/>
                        </defs>
                        <g class="ring-spin">
                            <text>
                                <textPath href="#circlePath">
                                    • חותם שנשאר לדורות • סיפורי משפחה ומורשת • מי היו סבא וסבתא • זיכרון דיגיטלי נצחי •
                                </textPath>
                            </text>
                        </g>
                    </svg>
                </div>

                <a href="#" class="center-hub">
                    <span>התחל</span>
                    <span style="font-size: 1.5rem;">📜</span>
                </a>
            </main>
        </div>
    </div>

</body>
</html>
