<!doctype html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>hotam.vip | חותם</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #efe7db; --accent: #7a5a2b; }
        body { 
            margin: 0; background: var(--bg); 
            background-image: url("https://www.transparenttextures.com/patterns/aged-paper.png");
            font-family: 'Assistant', sans-serif; 
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }

        /* הקופסה שנועלת הכל יחד */
        .master-holder {
            position: relative;
            width: 600px;
            height: 650px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* כותרת עוטפת צמודה */
        .header-svg {
            width: 100%;
            height: 120px;
            margin-bottom: -40px;
            z-index: 10;
        }

        /* הדיסק השחור */
        .disc-wrap {
            position: relative;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #222 0%, #000 100%);
            border-radius: 50%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            border: 4px solid #111;
            display: grid;
            place-items: center;
        }

        /* חריצי תקליט */
        .disc-wrap::after {
            content: ""; position: absolute; inset: 0; border-radius: 50%;
            background: repeating-radial-gradient(circle, transparent 0, transparent 2px, rgba(255,255,255,0.02) 3px);
        }

        /* מיקום התמונות/סרטונים - נעול בפיקסלים כדי שלא יברחו */
        .memory-item {
            position: absolute;
            width: 110px; height: 85px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            z-index: 5;
        }
        .memory-item video, .memory-item img { width: 100%; height: 100%; object-fit: cover; }

        /* קואורדינטות מדויקות בתוך העיגול (500px) */
        .p1 { top: 40px; left: 195px; } 
        .p2 { top: 90px; right: 50px; } 
        .p3 { top: 207px; right: 20px; } 
        .p4 { bottom: 90px; right: 50px; } 
        .p5 { bottom: 40px; left: 195px; } 
        .p6 { bottom: 90px; left: 50px; } 
        .p7 { top: 207px; left: 20px; } 
        .p8 { top: 90px; left: 50px; } 

        /* מלל מסתובב סביב המרכז */
        .spin-layer {
            position: absolute; width: 240px; height: 240px;
            z-index: 8; animation: spinText 30s linear infinite;
        }
        @keyframes spinText { to { transform: rotate(360deg); } }

        /* כפתור התחל */
        .start-btn {
            position: absolute; z-index: 20;
            width: 130px; height: 130px;
            background: #fff; border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-decoration: none; color: #000; font-weight: 900;
            box-shadow: 0 0 20px rgba(0,0,0,0.3); border: none; cursor: pointer;
        }

        svg { width: 100%; height: 100%; overflow: visible; }
        .arc-text { font-size: 21px; font-weight: 800; fill: #111; }
        .inner-txt { font-size: 13px; font-weight: 700; fill: rgba(255,255,255,0.8); }

        @media (max-width: 650px) {
            .master-holder { transform: scale(0.65); }
        }
    </style>
</head>
<body>

    <div class="master-holder">
        <div class="header-svg">
            <svg viewBox="0 0 600 120">
                <path id="curve" d="M 80,110 A 220,90 0 0,1 520,110" fill="none" />
                <text class="arc-text">
                    <textPath href="#curve" startOffset="50%" text-anchor="middle">
                        הפעם זה לא עוד אלבום תמונות. הפעם זה <tspan fill="#7a5a2b">חותם</tspan> שנשאר לדורות.
                    </textPath>
                </text>
            </svg>
        </div>

        <div class="disc-wrap">
            <div class="memory-item p1"><video autoplay muted loop playsinline><source src="faith1.mp4" type="video/mp4"></video></div>
            <div class="memory-item p2"><img src="still1_real.jpg"></div>
            <div class="memory-item p3"><img src="still3_real.jpg"></div>
            <div class="memory-item p4"><video autoplay muted loop playsinline><source src="faith2.mp4" type="video/mp4"></video></div>
            <div class="memory-item p5"><video autoplay muted loop playsinline><source src="faith3.mp4" type="video/mp4"></video></div>
            <div class="memory-item p6"><img src="still2_real.jpg"></div>
            <div class="memory-item p7"><video autoplay muted loop playsinline><source src="faith4.mp4" type="video/mp4"></video></div>
            <div class="memory-item p8"><img src="still4_real.jpg"></div>

            <div class="spin-layer">
                <svg viewBox="0 0 200 200">
                    <path id="ring" d="M 100, 100 m -80, 0 a 80,80 0 1,1 160,0 a 80,80 0 1,1 -160,0" fill="none" />
                    <text class="inner-txt">
                        <textPath href="#ring">
                            • סיפורי משפחה ומורשת • חותם שנשאר לדורות • זיכרון אבות •
                        </textPath>
                    </text>
                </svg>
            </div>

            <a href="https://hotam.vip/forum" class="start-btn">
                <span>התחל</span>
                <span style="font-size: 1.5rem;">📜</span>
            </a>
        </div>
    </div>

</body>
</html>
