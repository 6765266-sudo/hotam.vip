<!doctype html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>hotam.vip | חותם - זיכרון דיגיטלי</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #efe7db; --accent: #7a5a2b; --gold: #c5a059; }
        
        body { 
            margin: 0; background: var(--bg); 
            background-image: url("https://www.transparenttextures.com/patterns/aged-paper.png");
            font-family: 'Assistant', sans-serif; 
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            overflow-x: hidden;
        }

        .container {
            display: flex; width: 100%; max-width: 1400px;
            align-items: center; justify-content: space-around; padding: 20px;
            flex-direction: row-reverse; /* טקסט בימין, דיסק בשמאל בדסקטופ */
        }

        /* קופי שיווקי */
        .side-text {
            flex: 0 0 350px; text-align: right; z-index: 50;
        }
        .side-text h1 { font-size: 2.5rem; font-weight: 800; margin: 0; color: #1a1a1a; line-height: 1.1; }
        .side-text p { font-size: 1.5rem; color: #444; margin-top: 10px; }
        .highlight { color: var(--accent); font-weight: 800; border-bottom: 2px solid var(--gold); }

        /* אזור הדיסק המרכזי */
        .stage {
            position: relative;
            width: min(85vmin, 650px);
            aspect-ratio: 1/1;
            display: flex; justify-content: center; align-items: center;
        }

        /* הדיסק עם חריצי התקליט */
        .disc-body {
            position: absolute; inset: 0;
            background: radial-gradient(circle, #222 0%, #000 100%);
            border-radius: 50%;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
            background-image: repeating-radial-gradient(circle, transparent 0, transparent 2px, rgba(255,255,255,0.03) 3px);
            border: 2px solid #111;
        }

        /* גלריית תמונות בתוך הדיסק */
        .photo-gallery {
            position: absolute; inset: 0;
            z-index: 5;
        }

        .memory-card {
            position: absolute;
            width: 22%; height: 16%;
            background-size: cover; background-position: center;
            border-radius: 6px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.15);
            display: flex; align-items: flex-end; padding: 5px;
            overflow: hidden;
        }

        .memory-card span {
            color: white; font-size: 0.6rem; font-weight: bold; background: rgba(0,0,0,0.5);
            width: 100%; text-align: center; padding: 2px 0;
        }

        /* מיקום תמונות במעגל מושלם */
        .pos-1 { top: 8%; left: 50%; transform: translateX(-50%); }
        .pos-2 { top: 22%; right: 10%; }
        .pos-3 { top: 50%; right: 4%; transform: translateY(-50%); }
        .pos-4 { bottom: 22%; right: 10%; }
        .pos-5 { bottom: 8%; left: 50%; transform: translateX(-50%); }
        .pos-6 { bottom: 22%; left: 10%; }
        .pos-7 { top: 50%; left: 4%; transform: translateY(-50%); }
        .pos-8 { top: 22%; left: 10%; }

        /* הטבעת המסתובבת של הטקסט */
        .text-ring {
            position: absolute; width: 42%; height: 42%;
            z-index: 10; animation: rotateRing 30s linear infinite;
        }

        @keyframes rotateRing { to { transform: rotate(360deg); } }

        /* ליבת הדיסק - כפתור התחל */
        .center-hub {
            position: absolute; z-index: 20;
            width: 28%; height: 28%;
            background: radial-gradient(circle, #ffffff 50%, #e0e0e0 100%);
            border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-decoration: none; box-shadow: inset 0 0 15px rgba(0,0,0,0.1), 0 5px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .center-hub:hover { transform: scale(1.1); }
        .center-hub b { color: #000; font-size: 1.2rem; font-weight: 900; }
        .center-hub .emoji { font-size: 1.8rem; margin-top: 5px; }

        svg { width: 100%; height: 100%; overflow: visible; }
        text { fill: rgba(255,255,255,0.9); font-size: 14px; font-weight: 700; letter-spacing: 1.2px; }

        @media (max-width: 900px) {
            .container { flex-direction: column; text-align: center; gap: 40px; }
            .side-text { text-align: center; flex: none; }
            .stage { width: 90vw; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="side-text">
            <h1>הפעם זה לא עוד<br>אלבום תמונות.</h1>
            <p>הפעם זה <span class="highlight">חותם</span> שנשאר לדורות.</p>
        </div>

        <div class="stage">
            <div class="disc-body"></div>
            
            <div class="photo-gallery">
                <div class="memory-card pos-1" style="background-image: url('https://picsum.photos/id/10/200/150');"><span>זיכרון אבות</span></div>
                <div class="memory-card pos-2" style="background-image: url('https://picsum.photos/id/20/200/150');"><span>חותם לדורות</span></div>
                <div class="memory-card pos-3" style="background-image: url('https://picsum.photos/id/30/200/150');"><span>להעביר מורשת</span></div>
                <div class="memory-card pos-4" style="background-image: url('https://picsum.photos/id/40/200/150');"><span>מתיקות התורה</span></div>
                <div class="memory-card pos-5" style="background-image: url('https://picsum.photos/id/50/200/150');"><span>גבורה ומסירות</span></div>
                <div class="memory-card pos-6" style="background-image: url('https://picsum.photos/id/60/200/150');"><span>מורשת סבא</span></div>
                <div class="memory-card pos-7" style="background-image: url('https://picsum.photos/id/70/200/150');"><span>שבת בבית</span></div>
                <div class="memory-card pos-8" style="background-image: url('https://picsum.photos/id/80/200/150');"><span>תפילין ואור</span></div>
            </div>

            <div class="text-ring">
                <svg viewBox="0 0 200 200">
                    <path id="ringPath" d="M 100, 100 m -75, 0 a 75,75 0 1,1 150,0 a 75,75 0 1,1 -150,0" fill="none"/>
                    <text>
                        <textPath href="#ringPath">
                             • סיפורי משפחה • מורשת נצחית • זיכרונות אבות •
                        </textPath>
                    </text>
                </svg>
            </div>

            <a href="https://hotam.vip/start" class="center-hub">
                <b>התחל</b>
                <span class="emoji">📜</span>
            </a>
        </div>
    </div>

</body>
</html>
