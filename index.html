<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hotam.vip</title>

  <style>
    :root{
      --bg: #efe7dc;

      --discA:#0f0f10;
      --discB:#101012;

      --ringText: rgba(255,255,255,.72);
      --ringGlow: rgba(255,255,255,.18);

      --shadow: 0 22px 55px rgba(0,0,0,.35);

      /* כרטיסים */
      --cardW: 22%;
      --cardRadius: 14px;

      /* ✅ זה מה שמסדר את הבעיה: יותר גדול = הכרטיסים יותר החוצה */
      --orbit: 46%;

      /* ✅ סיבוב איטי יותר */
      --spinSeconds: 52s;

      /* טבעת טקסט – גודל בסיס */
      --ringFont: 16px;

      /* מרכז דיסק */
      --hubSize: 28%;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background: radial-gradient(1200px 800px at 50% 30%, #fff6ea 0%, var(--bg) 55%, #e6ddcf 100%);
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    }

    .stage{
      width:min(980px, 92vw);
      aspect-ratio: 1 / 1;
      position:relative;
      display:grid;
      place-items:center;
    }

    .disc{
      width:100%;
      height:100%;
      border-radius:50%;
      background:
        repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.055) 0 2px, rgba(255,255,255,.00) 2px 8px),
        radial-gradient(circle at 50% 50%, var(--discA) 0%, var(--discB) 70%, #070708 100%);
      box-shadow: var(--shadow);
      position:relative;
      overflow:hidden;
    }

    /* --- 8 כרטיסים על מעגל --- */
    .slot{
      position:absolute;
      width: var(--cardW);
      aspect-ratio: 16 / 9;
      border-radius: var(--cardRadius);
      overflow:hidden;
      box-shadow: 0 18px 30px rgba(0,0,0,.35);
      background: rgba(255,255,255,.06);
      z-index: 2;

      transform: translate(-50%,-50%);
      will-change: transform, left, top;
    }
    .slot img, .slot video{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    /* כיתוב – צד שמאל למטה, בלי רקע */
    .caption{
      position:absolute;
      left:10px;
      bottom:10px;
      right:10px;
      display:flex;
      flex-direction:column;
      gap:2px;
      align-items:flex-start;
      text-align:left;
      pointer-events:none;
      color: rgba(255,255,255,.95);
      text-shadow: 0 2px 10px rgba(0,0,0,.65);
    }
    .cap-title{
      font-weight:900;
      font-size:14px;
      line-height:1.1;
      display:-webkit-box;
      -webkit-line-clamp: 1; /* ✅ מקסימום שורה אחת לכותרת */
      -webkit-box-orient: vertical;
      overflow:hidden;
      max-width:100%;
    }
    .cap-sub{
      font-weight:800;
      font-size:12px;
      line-height:1.15;
      opacity:.95;
      display:-webkit-box;
      -webkit-line-clamp: 1; /* ✅ מקסימום שורה אחת לתת-כותרת */
      -webkit-box-orient: vertical;
      overflow:hidden;
      max-width:100%;
    }

    /* --- טבעת טקסט מסתובבת --- */
    .ring{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      pointer-events:none;
      z-index: 3;
    }
    .ring svg{
      width:46%;
      height:46%;
      overflow:visible;
      filter: drop-shadow(0 1px 0 var(--ringGlow));
    }
    .ring-spin{
      transform-origin: 50% 50%;
      animation: spin var(--spinSeconds) linear infinite;
    }
    @keyframes spin{
      from{ transform: rotate(0deg); }
      to{ transform: rotate(360deg); }
    }

    /* --- מרכז דיסק סימטרי --- */
    .hub{
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      width: var(--hubSize);
      aspect-ratio:1/1;
      border-radius:50%;
      z-index: 4;
      display:grid;
      place-items:center;
    }

    .hub-outer{
      width:100%;
      height:100%;
      border-radius:50%;
      background: radial-gradient(circle at 50% 45%,
        rgba(255,255,255,.88) 0 44%,
        rgba(255,255,255,.70) 44% 64%,
        rgba(255,255,255,.00) 64% 100%
      );
      box-shadow: 0 10px 30px rgba(0,0,0,.28);
      display:grid;
      place-items:center;
    }

    .hub-mid{
      width:58%;
      aspect-ratio:1/1;
      border-radius:50%;
      background: radial-gradient(circle at 50% 40%,
        rgba(255,255,255,.16),
        rgba(120,120,120,.42)
      );
      box-shadow: inset 0 0 0 2px rgba(0,0,0,.08);
      display:grid;
      place-items:center;
    }

    .start{
      width:72%;
      aspect-ratio:1/1;
      border-radius:50%;
      border: 2px solid rgba(0,0,0,.16);
      background:
        radial-gradient(circle at 50% 35%, rgba(255,255,255,.18), rgba(255,255,255,.03)),
        linear-gradient(180deg, rgba(0,0,0,.22), rgba(0,0,0,.10));
      color: rgba(255,255,255,.92);
      cursor:pointer;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:6px;
      padding:10px;
      box-shadow:
        0 10px 22px rgba(0,0,0,.25),
        inset 0 0 0 1px rgba(255,255,255,.10);
      transition: transform .15s ease, filter .15s ease;
      user-select:none;
    }
    .start:hover{ filter: brightness(1.12); transform: translateY(-1px); }
    .start:active{ transform: translateY(0) scale(.98); }

    .hand{ font-size:22px; line-height:1; }
    .start-label{ font-weight:900; font-size:14px; }
    .start-sub{ font-weight:800; font-size:11px; opacity:.9; }

    /* ✅ מובייל: הקטנת הטקסט המעגלי כדי שלא ייחתך */
    @media (max-width: 640px){
      :root{
        --cardW: 28%;
        --orbit: 48%;
        --spinSeconds: 58s;
        --ringFont: 13px;   /* ✅ קטן יותר */
        --hubSize: 38%;
      }
      .ring svg{ width:58%; height:58%; }
      .cap-title{ font-size:13px; }
      .cap-sub{ font-size:11px; }
    }
  </style>
</head>

<body>
  <div class="stage">
    <div class="disc" id="disc">

      <!-- טבעת טקסט מסתובבת -->
      <div class="ring" aria-hidden="true">
        <svg viewBox="0 0 300 300">
          <defs>
            <path id="circlePath" d="M150,150 m-108,0 a108,108 0 1,1 216,0 a108,108 0 1,1 -216,0" />
          </defs>
          <g class="ring-spin">
            <text fill="var(--ringText)" font-size="var(--ringFont)" font-weight="900" letter-spacing="1.1">
              <textPath href="#circlePath" startOffset="50%" text-anchor="middle">
                חותם שנשאר לדורות • מי היו סבא וסבתא? • סיפורי משפחה ומורשת • המחשת סיפורי גבורה ומסירות נפש •
              </textPath>
            </text>
          </g>
        </svg>
      </div>

      <!-- מרכז דיסק -->
      <div class="hub">
        <div class="hub-outer">
          <div class="hub-mid">
            <button class="start" id="startBtn" type="button" title="התחל">
              <div class="hand">👆</div>
              <div class="start-label">התחל</div>
              <div class="start-sub">חותם</div>
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // סדר המיקומים: 12, 2, 3, 5, 6, 7, 9, 10 (עם כיוון השעון)
    const items = [
      // 12:00
      { type:"video", src:"assets/faith1.mp4",  title:"זיכרון אבות",           sub:"שלא יאבד" },

      // 2:00 (סבא+נכד / חותם)
      { type:"img",   src:"assets/still2_real.jpg", title:"חותם שנשאר לדורות", sub:"שהנכדים ידעו" },

      // 3:00 (סבא לומד – עדכון טקסט שביקשת)
      { type:"video", src:"assets/faith2.mp4",  title:"מתיקות התורה",          sub:"של סבא" },

      // 5:00 (סבא+נכד)
      { type:"img",   src:"assets/still3_real.jpg", title:"שיירשת לדורות",     sub:"סבא ונכד" },

      // 6:00 (ידיים / מסירות נפש)
      { type:"video", src:"assets/faith3.mp4",  title:"מסירות נפש",            sub:"רגע שמתחבר" },

      // 7:00 (תפילין)
      { type:"img",   src:"assets/still1_real.jpg", title:"תפילין",            sub:"האות שמחבר" },

      // 9:00 (נרות שבת – עדכון טקסט שביקשת)
      { type:"video", src:"assets/faith4.mp4",  title:"שבת",                   sub:"בבית סבא" },

      // 10:00 (תמונה נוספת – אם תרצה להחליף, פשוט מחליפים קובץ כאן)
      { type:"img",   src:"assets/still4_real.jpg", title:"להעביר מורשת",      sub:"מדור לדור" },
    ];

    // זוויות “שעון”: 12, 2, 3, 5, 6, 7, 9, 10
    const anglesDeg = [-90, -30, 0, 60, 90, 120, 180, -150];

    const disc = document.getElementById("disc");

    function createSlot(item){
      const slot = document.createElement("div");
      slot.className = "slot";

      if(item.type === "video"){
        const v = document.createElement("video");
        v.src = item.src;
        v.autoplay = true;
        v.muted = true;
        v.loop = true;
        v.playsInline = true;
        v.preload = "metadata";
        slot.appendChild(v);
      }else{
        const img = document.createElement("img");
        img.src = item.src;
        img.alt = "";
        slot.appendChild(img);
      }

      const cap = document.createElement("div");
      cap.className = "caption";

      const t = document.createElement("div");
      t.className = "cap-title";
      t.textContent = item.title;

      const s = document.createElement("div");
      s.className = "cap-sub";
      s.textContent = item.sub;

      cap.appendChild(t);
      cap.appendChild(s);
      slot.appendChild(cap);

      return slot;
    }

    function layout(){
      const rect = disc.getBoundingClientRect();

      const orbitStr = getComputedStyle(document.documentElement).getPropertyValue("--orbit");
      const orbitPercent = parseFloat(orbitStr) || 46; // ✅ ברירת מחדל חזקה

      const R = (Math.min(rect.width, rect.height) / 2) * (orbitPercent / 100);
      const cx = rect.width / 2;
      const cy = rect.height / 2;

      const slots = disc.querySelectorAll(".slot");
      slots.forEach((slot, i) => {
        const a = anglesDeg[i] * Math.PI / 180;
        const x = cx + R * Math.cos(a);
        const y = cy + R * Math.sin(a);
        slot.style.left = x + "px";
        slot.style.top  = y + "px";
      });
    }

    // בונים כרטיסים
    items.forEach(it => disc.appendChild(createSlot(it)));

    // ✅ מרנדרים פעמיים: מיד + אחרי טעינת משאבים (מונע "קפיצה למרכז" בחלק מהמכשירים)
    layout();
    window.addEventListener("resize", layout);
    window.addEventListener("load", () => requestAnimationFrame(layout));

    // קישור כפתור
    const FORM_URL = "form.html";
    document.getElementById("startBtn").addEventListener("click", () => {
      window.location.href = FORM_URL;
    });
  </script>
</body>
</html>
