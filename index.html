<!doctype html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>hotam.vip | חותם - מורשת נצחית</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #efe7db; --accent: #7a5a2b; --gold: #c5a059; }
        
        body { 
            margin: 0; background: var(--bg); 
            background-image: url("https://www.transparenttextures.com/patterns/aged-paper.png");
            font-family: 'Assistant', sans-serif; 
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
        }

        /* כותרת קשתית מעל הדיסק */
        .top-header-svg {
            width: 600px; height: 100px; margin-bottom: -40px; z-index: 10;
        }

        .stage {
            position: relative;
            width: min(90vmin, 700px);
            aspect-ratio: 1/1;
            display: flex; justify-content: center; align-items: center;
        }

        .disc-body {
            position: absolute; inset: 0;
            background: radial-gradient(circle, #222 0%, #000 100%);
            border-radius: 50%;
            box-shadow: 0 40px 100px rgba(0,0,0,0.6);
            background-image: repeating-radial-gradient(circle, transparent 0, transparent 2px, rgba(255,255,255,0.03) 3px);
            border: 2px solid #111;
        }

        /* גלריית 8 תחנות (כמו במקור) */
        .photo-gallery { position: absolute; inset: 0; z-index: 5; }
        .memory-item {
            position: absolute; width: 22%; height: 16%;
            border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.2); overflow: hidden;
        }
        .memory-item video, .memory-item img { width: 100%; height: 100%; object-fit: cover; }
        .memory-item .caption {
            position: absolute; bottom: 0; width: 100%; color: white; font-size: 0.6rem; 
            font-weight: bold; background: linear-gradient(transparent, rgba(0,0,0,0.9));
            text-align: right; padding: 10px 5px 3px 5px;
        }

        /* מיקומים מדויקים מסביב לטבעת */
        .pos-1 { top: 6%; left: 50%; transform: translateX(-50%); } 
        .pos-2 { top: 18%; right: 10%; } 
        .pos-3 { top: 50%; right: 4%; transform: translateY(-50%); } 
        .pos-4 { bottom: 18%; right: 10%; } 
        .pos-5 { bottom: 6%; left: 50%; transform: translateX(-50%); } 
        .pos-6 { bottom: 18%; left: 10%; } 
        .pos-7 { top: 50%; left: 4%; transform: translateY(-50%); } 
        .pos-8 { top: 18%; left: 10%; } 

        /* המלל המסתובב באמצע (סביב ההתחל) */
        .inner-text-ring {
            position: absolute; width: 42%; height: 42%;
            z-index: 10; animation: rotateRing 30s linear infinite;
        }
        @keyframes rotateRing { to { transform: rotate(360deg); } }

        /* ליבת הדיסק */
        .center-hub {
            position: absolute; z-index: 20;
            width: 26%; height: 26%;
            background: radial-gradient(circle, #ffffff 50%, #e0e0e0 100%);
            border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4); border: 4px solid #f0f0f0; cursor: pointer;
        }
        .center-hub b { color: #000; font-size: 1.1rem; font-weight: 900; }

        /* הגדרות SVG */
        svg { width: 100%; height: 100%; overflow: visible; }
        .curved-title { fill: #1a1a1a; font-size: 22px; font-weight: 800; }
        .highlight { fill: var(--accent); }
        .ring-text { fill: rgba(255,255,255,0.9); font-size: 13px; font-weight: 700; }

        @media (max-width: 700px) {
            .top-header-svg { width: 90vw; }
            .stage { width: 95vw; }
        }
    </style>
</head>
<body>

    <svg class="top-header-svg" viewBox="0 0 600 100">
        <path id="headerPath" d="M 50,90 A 250,100 0 0,1 550,90" fill="none" />
        <text class="curved-title">
            <textPath href="#headerPath" startOffset="50%" text-anchor="middle">
                הפעם זה לא עוד אלבום תמונות. הפעם זה <tspan class="highlight">חותם</tspan> שנשאר לדורות.
            </textPath>
        </text>
    </svg>

    <div class="stage">
        <div class="disc-body"></div>
        
        <div class="photo-gallery">
            <div class="memory-item pos-1">
                <video autoplay muted loop playsinline><source src="faith1.mp4" type="video/mp4"></video>
                <div class="caption">זיכרון אבות<br>שלא יאבד</div>
            </div>
            <div class="memory-item pos-2">
                <img src="still1_real.jpg" alt="חותם שנשאר">
                <div class="caption">חותם שנשאר לדורות<br>שהנכדים ידעו</div>
            </div>
            <div class="memory-item pos-3">
                <img src="still3_real.jpg" alt="מורשת">
                <div class="caption">להעביר מורשת<br>מדור לדור</div>
            </div>
            <div class="memory-item pos-4">
                <video autoplay muted loop playsinline><source src="faith2.mp4" type="video/mp4"></video>
                <div class="caption">מתיקות התורה<br>של סבא</div>
            </div>
            <div class="memory-item pos-5">
                <video autoplay muted loop playsinline><source src="faith3.mp4" type="video/mp4"></video>
                <div class="caption">המחשבת גבורה<br>ומסירות נפש</div>
            </div>
            <div class="memory-item pos-6">
                <img src="still2_real.jpg" alt="סבא ונכד">
                <div class="caption">מורשת<br>סבא ונכד</div>
            </div>
            <div class="memory-item pos-7">
                <video autoplay muted loop playsinline><source src="faith4.mp4" type="video/mp4"></video>
                <div class="caption">שבת בבית סבא<br>עונג שלווה</div>
            </div>
            <div class="memory-item pos-8">
                <img src="still4_real.jpg" alt="תפילין">
                <div class="caption">תפילין<br>האות שמתחבר</div>
            </div>
        </div>

        <div class="inner-text-ring">
            <svg viewBox="0 0 200 200">
                <path id="ringPath" d="M 100, 100 m -78, 0 a 78,78 0 1,1 156,0 a 78,78 0 1,1 -156,0" fill="none"/>
                <text class="ring-text">
                    <textPath href="#ringPath">
                         • סיפורי משפחה ומורשת • המחשבת גבורה ומסירות נפש • חותם שנשאר לדורות •
                    </textPath>
                </text>
            </svg>
        </div>

        <div class="center-hub" onclick="window.location.href='https://hotam.vip/forum'">
            <b>התחל</b>
            <span style="font-size: 1.2rem;">📜</span>
        </div>
    </div>

</body>
</html>
