<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>חותם שנשאר לדורות</title>

  <!-- Fonts (Hebrew) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg1:#f4efe6;
      --bg2:#e7ddcf;
      --disk:#0b0b0c;
      --slot:#0e0f10;
      --slotBorder:rgba(255,255,255,.12);
      --text:#101010;
      --muted:#3b3b3b;
      --shadow: 0 20px 60px rgba(0,0,0,.22);
      --slotShadow: 0 14px 30px rgba(0,0,0,.45);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"Assistant", system-ui, -apple-system, Segoe UI, Arial, sans-serif;
      background: radial-gradient(1200px 800px at 50% 20%, #ffffff 0%, var(--bg1) 45%, var(--bg2) 100%);
      min-height:100svh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      color:var(--text);
    }

    .stage{
      width:min(980px, 100%);
      display:flex;
      justify-content:center;
      align-items:center;
    }

    /* Disk wrapper */
    .diskWrap{
      position:relative;
      width:min(860px, 92vw);
      aspect-ratio: 1 / 1;
      filter: drop-shadow(var(--shadow));
    }

    /* Vinyl/CD look */
    .disk{
      position:absolute;
      inset:0;
      border-radius:999px;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.05) 0 2%, transparent 3%),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.05) 0 12%, transparent 13%),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.04) 0 22%, transparent 23%),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.03) 0 32%, transparent 33%),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.025) 0 42%, transparent 43%),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.02) 0 52%, transparent 53%),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.018) 0 62%, transparent 63%),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.016) 0 72%, transparent 73%),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.014) 0 82%, transparent 83%),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.012) 0 92%, transparent 93%),
        radial-gradient(circle at 50% 50%, #111 0 45%, #070707 70%, #000 100%);
      overflow:hidden;
    }

    /* Dark outer rim like a real disc */
    .disk::before{
      content:"";
      position:absolute;
      inset:-2px;
      border-radius:999px;
      background:
        radial-gradient(circle at 50% 50%, transparent 0 90%, rgba(0,0,0,.85) 100%),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.06), transparent 60%);
      pointer-events:none;
      mix-blend-mode: multiply;
    }

    /* Center label */
    .label{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      pointer-events:none;
    }

    .labelInner{
      width: 38%;
      min-width: 240px;
      max-width: 360px;
      aspect-ratio: 1 / 1;
      border-radius:999px;
      background: radial-gradient(circle at 50% 35%, #ffffff 0%, #f3f3f3 40%, #e9e9e9 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.7), inset 0 -12px 30px rgba(0,0,0,.10);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:22px;
      text-align:center;
    }

    .labelContent{
      width:100%;
      pointer-events:auto;
    }

    .brand{
      font-weight:800;
      font-size: clamp(22px, 2.6vw, 34px);
      line-height:1.1;
      margin:0 0 8px;
      letter-spacing:-0.2px;
    }

    .sub{
      margin:0 0 14px;
      font-size: clamp(14px, 1.35vw, 16px);
      color:var(--muted);
      line-height:1.5;
    }

    .cta{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      border:none;
      border-radius:999px;
      padding:12px 18px;
      font-weight:700;
      background:#111;
      color:#fff;
      cursor:pointer;
      box-shadow: 0 10px 20px rgba(0,0,0,.18);
      transition: transform .15s ease, box-shadow .15s ease;
      font-size: 15px;
    }
    .cta:hover{ transform: translateY(-1px); box-shadow: 0 14px 24px rgba(0,0,0,.22); }
    .tiny{
      margin-top:10px;
      font-size:12px;
      color:#6b6b6b;
    }

    /* Slots orbit */
    .orbit{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      pointer-events:auto;
    }

    .slot{
      position:absolute;
      width: 24%;
      aspect-ratio: 16 / 10;
      border-radius:14px;
      overflow:hidden;
      background: var(--slot);
      border: 1px solid var(--slotBorder);
      box-shadow: var(--slotShadow);
      transform: translate(-50%, -50%);
      will-change: transform;
    }

    /* actual media */
    .slot img,
    .slot video{
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      filter: contrast(1.05) grayscale(.05);
    }

    /* subtle vignette so it looks nostalgic */
    .slot::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 50% 40%, transparent 0 55%, rgba(0,0,0,.35) 100%),
        linear-gradient(to bottom, rgba(0,0,0,.18), transparent 30%, rgba(0,0,0,.25));
      pointer-events:none;
      mix-blend-mode: multiply;
      opacity:.75;
    }

    /* positions (8 around) */
    .p1{ left:50%; top:12%; }
    .p2{ left:78%; top:24%; }
    .p3{ left:88%; top:50%; }
    .p4{ left:78%; top:76%; }
    .p5{ left:50%; top:88%; }
    .p6{ left:22%; top:76%; }
    .p7{ left:12%; top:50%; }
    .p8{ left:22%; top:24%; }

    /* Mobile tweaks */
    @media (max-width: 700px){
      body{ padding:14px; }
      .diskWrap{ width:min(520px, 96vw); }
      .slot{ width: 28%; border-radius:12px; }
      .labelInner{
        width: 46%;
        min-width: 200px;
      }
    }

    @media (max-width: 420px){
      .slot{ width: 30%; }
      .labelInner{ width: 52%; min-width: 180px; padding:18px; }
      .cta{ padding:11px 16px; font-size:14px; }
    }
  </style>
</head>

<body>
  <main class="stage">
    <section class="diskWrap" aria-label="חותם שנשאר לדורות">
      <div class="disk"></div>

      <!-- Orbit slots -->
      <div class="orbit">

        <!-- 1 VIDEO -->
        <div class="slot p1">
          <video src="assets/faith1.mp4" autoplay muted loop playsinline preload="metadata"></video>
        </div>

        <!-- 2 IMAGE -->
        <div class="slot p2">
          <img src="assets/still1.jpg" alt="זיכרון 1" loading="lazy">
        </div>

        <!-- 3 VIDEO -->
        <div class="slot p3">
          <video src="assets/faith2.mp4" autoplay muted loop playsinline preload="metadata"></video>
        </div>

        <!-- 4 IMAGE -->
        <div class="slot p4">
          <img src="assets/still2.jpg" alt="זיכרון 2" loading="lazy">
        </div>

        <!-- 5 VIDEO -->
        <div class="slot p5">
          <video src="assets/faith3.mp4" autoplay muted loop playsinline preload="metadata"></video>
        </div>

        <!-- 6 IMAGE -->
        <div class="slot p6">
          <img src="assets/still3.jpg" alt="זיכרון 3" loading="lazy">
        </div>

        <!-- 7 VIDEO -->
        <div class="slot p7">
          <video src="assets/faith4.mp4" autoplay muted loop playsinline preload="metadata"></video>
        </div>

        <!-- 8 IMAGE -->
        <div class="slot p8">
          <img src="assets/still4.jpg" alt="זיכרון 4" loading="lazy">
        </div>

      </div>

      <!-- Center label -->
      <div class="label">
        <div class="labelInner">
          <div class="labelContent">
            <h1 class="brand">חותם שנשאר לדורות</h1>
            <p class="sub">זכרונות ערכיים, אמונה, משפחה וזיכרון.</p>
            <button class="cta" onclick="alert('כאן נפתח טופס / וואטסאפ / צור קשר')">להתחיל בשאלון קצר</button>
            <div class="tiny">© hotam.vip</div>
          </div>
        </div>
      </div>

    </section>
  </main>

  <script>
    // אם דפדפן חוסם אוטופליי (נדיר כשהוא muted), ננסה להפעיל
    document.querySelectorAll('video').forEach(v => {
      v.addEventListener('error', () => console.warn('Video failed:', v.src));
      const p = v.play();
      if (p && typeof p.catch === 'function') p.catch(()=>{});
    });
  </script>
</body>
</html>
