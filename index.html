<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>התחלה | hotam.vip</title>
  <style>
    body{
      margin:0;
      min-height:100svh;
      display:grid;
      place-items:center;
      background:#efe7db;
      font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
      padding:20px;
    }
    .card{
      width:min(860px, 94vw);
      background:rgba(255,255,255,.8);
      border:1px solid rgba(0,0,0,.08);
      border-radius:18px;
      padding:22px;
      box-shadow:0 18px 50px rgba(0,0,0,.15);
      backdrop-filter: blur(8px);
    }
    h1{ margin:0 0 8px; font-size:24px; }
    p{ margin:0 0 18px; color:#333; line-height:1.4; }
    form{ display:grid; gap:12px; }
    label{ font-weight:800; font-size:14px; }
    input, textarea{
      width:100%;
      padding:12px 12px;
      border-radius:12px;
      border:1px solid rgba(0,0,0,.18);
      background:#fff;
      font-size:16px;
      outline:none;
    }
    textarea{ min-height:120px; resize:vertical; }
    .row{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
    @media (max-width:700px){ .row{ grid-template-columns:1fr; } }

    .actions{
      display:flex;
      gap:10px;
      justify-content:flex-start;
      flex-wrap:wrap;
      margin-top:6px;
    }
    .btn{
      cursor:pointer;
      border:0;
      border-radius:999px;
      padding:12px 18px;
      font-weight:900;
      font-size:15px;
      box-shadow:0 12px 26px rgba(0,0,0,.16);
      transition:transform .12s ease, filter .12s ease;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      gap:8px;
    }
    .btn:hover{ transform: translateY(-1px); filter: brightness(1.03); }
    .btn:active{ transform: translateY(0px) scale(.98); }

    .primary{ background:#111; color:#fff; }
    .ghost{ background:rgba(255,255,255,.75); color:#111; border:1px solid rgba(0,0,0,.12); }
    .note{ font-size:12px; color:#444; opacity:.9; margin-top:10px; }
    .ok{ margin-top:12px; font-weight:900; color:#0a6a2a; display:none; }
  </style>
</head>
<body>
  <main class="card">
    <h1>רגע לפני שמתחילים</h1>
    <p>
      מעניין איך יזכרו אותך? מה היית רוצה להשאיר לדורות?
      אם זה חשוב לך—בוא נתחיל בכמה שאלות קצרות.
    </p>

    <!-- כרגע זה "דמו": לא נשלח לשום מקום עד שנחבר אותו -->
    <form id="hotamForm">
      <div class="row">
        <div>
          <label>שם מלא</label>
          <input name="fullName" placeholder="לדוגמה: ישראל ישראלי" required />
        </div>
        <div>
          <label>טלפון / אימייל</label>
          <input name="contact" placeholder="050-0000000 / name@mail.com" />
        </div>
      </div>

      <div class="row">
        <div>
          <label>מי היו סבא וסבתא?</label>
          <input name="grandparents" placeholder="שמות / סיפור קצר" />
        </div>
        <div>
          <label>חותם שנשאר לדורות</label>
          <input name="legacy" placeholder="מה היית רוצה שישאר?" />
        </div>
      </div>

      <div>
        <label>סיפורי משפחה ומורשת</label>
        <textarea name="familyStory" placeholder="כתוב פה את הסיפור..."></textarea>
      </div>

      <div>
        <label>המחשת גבורה ומסירות נפש</label>
        <textarea name="courageStory" placeholder="סיפור/דוגמה שממחישה..."></textarea>
      </div>

      <div class="actions">
        <button class="btn primary" type="submit">שליחה</button>
        <a class="btn ghost" href="index.html">חזרה לדיסק</a>
      </div>

      <div class="note">
        הערה: כרגע הטופס לא שומר נתונים בשום מקום. בשלב הבא נחבר אותו למייל/Google Form/Sheets או שרת.
      </div>

      <div class="ok" id="okMsg">נשלח (דמו). בשלב הבא נחבר לשמירה אמיתית ✅</div>
    </form>
  </main>

  <script>
    // דמו: מונע רענון ומראה הודעה
    document.getElementById('hotamForm').addEventListener('submit', (e) => {
      e.preventDefault();
      document.getElementById('okMsg').style.display = 'block';
      window.scrollTo({top:0, behavior:'smooth'});
    });
  </script>
</body>
</html>
