<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hotam.vip</title>

  <style>
    :root{
      --bg: #efe7dc;
      --disc: #0f0f10;
      --disc2: #101012;

      --ringText: rgba(255,255,255,.72);
      --ringTextGlow: rgba(255,255,255,.18);

      --hubOuter: rgba(255,255,255,.92);
      --hubInner: rgba(140,140,140,.35);
      --hubShadow: 0 10px 30px rgba(0,0,0,.28);

      --startBase: rgba(0,0,0,.18);
      --startHover: rgba(0,0,0,.05);
      --startBorder: rgba(0,0,0,.18);
      --startText: rgba(255,255,255,.92);
      --startTextHover: rgba(30,30,30,.92);

      --shadow: 0 22px 55px rgba(0,0,0,.35);
    }

    *{ box-sizing: border-box; }
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background: radial-gradient(1200px 800px at 50% 30%, #fff6ea 0%, var(--bg) 55%, #e6ddcf 100%);
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    }

    .stage{
      width:min(980px, 92vw);
      aspect-ratio: 1 / 1;
      position:relative;
      display:grid;
      place-items:center;
    }

    .disc{
      width:100%;
      height:100%;
      border-radius:50%;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.06) 0 18%, transparent 18% 100%),
        repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.06) 0 2px, rgba(255,255,255,.00) 2px 8px),
        radial-gradient(circle at 50% 50%, var(--disc) 0%, var(--disc2) 70%, #070708 100%);
      box-shadow: var(--shadow);
      position:relative;
      overflow:hidden;
    }

    /* טבעת הטקסט המסתובבת */
    .ring{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      pointer-events:none;
    }
    .ring svg{
      width:52%;
      height:52%;
      overflow:visible;
      filter: drop-shadow(0 1px 0 var(--ringTextGlow));
    }
    .ring-spin{
      transform-origin: 50% 50%;
      animation: spin 24s linear infinite; /* <-- פי 2 יותר לאט */
    }
    @keyframes spin{
      from{ transform: rotate(0deg); }
      to{ transform: rotate(360deg); }
    }

    /* מרכז הדיסק */
    .hub{
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      width:34%;
      aspect-ratio:1/1;
      border-radius:50%;
      background:
        radial-gradient(circle at 50% 45%, #ffffff 0 46%, rgba(255,255,255,.82) 46% 74%, rgba(255,255,255,0) 74% 100%);
      display:grid;
      place-items:center;
      box-shadow: var(--hubShadow);
    }

    .hub .hub-inner{
      width:46%;
      aspect-ratio:1/1;
      border-radius:50%;
      background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.22), var(--hubInner));
      display:grid;
      place-items:center;
      position:relative;
      box-shadow: inset 0 0 0 2px rgba(0,0,0,.08);
    }

    /* כפתור "התחל" – עיצוב עגול כמו שהיה */
    .start-circle{
      width:72%;
      aspect-ratio:1/1;
      border-radius:50%;
      border: 2px solid var(--startBorder);
      background:
        radial-gradient(circle at 50% 35%, rgba(255,255,255,.14), rgba(255,255,255,.02)),
        linear-gradient(180deg, rgba(0,0,0,.26), rgba(0,0,0,.14));
      color: var(--startText);
      cursor:pointer;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:6px;
      box-shadow:
        0 10px 22px rgba(0,0,0,.28),
        inset 0 0 0 1px rgba(255,255,255,.10);
      transition: transform .15s ease, background .15s ease, color .15s ease, box-shadow .15s ease;
      user-select:none;
      padding:10px;
    }
    .start-circle:hover{
      background:
        radial-gradient(circle at 50% 35%, rgba(255,255,255,.45), rgba(255,255,255,.16)),
        linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.10));
      color: var(--startTextHover);
      transform: translateY(-1px);
      box-shadow:
        0 14px 28px rgba(0,0,0,.30),
        inset 0 0 0 1px rgba(255,255,255,.18);
    }
    .start-circle:active{
      transform: translateY(0px) scale(.98);
    }
    .start-circle .hand{
      font-size:22px;
      line-height:1;
    }
    .start-circle .label{
      font-weight:800;
      font-size:14px;
      letter-spacing:.2px;
    }

    /* (דמו) תמונות מסביב – תשאיר/תחליף לשלך */
    .slot{
      position:absolute;
      width: 22%;
      aspect-ratio: 16 / 9;
      border-radius: 14px;
      overflow:hidden;
      box-shadow: 0 18px 30px rgba(0,0,0,.35);
      background: rgba(255,255,255,.06);
      backdrop-filter: blur(2px);
    }
    .slot img, .slot video{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    /* מיקומים כמו שעון */
    .p12{ left:50%; top:6.5%; transform:translateX(-50%); }
    .p2 { right:8%; top:18%; }
    .p3 { right:2%; top:41%; }
    .p5 { right:12%; bottom:14%; }
    .p6 { left:50%; bottom:6.5%; transform:translateX(-50%); }
    .p7 { left:12%; bottom:14%; }
    .p9 { left:2%; top:41%; }
    .p10{ left:8%; top:18%; }

    /* רספונסיביות */
    @media (max-width: 640px){
      .stage{ width: 96vw; }
      .hub{ width:40%; }
      .ring svg{ width:60%; height:60%; }
      .slot{ width: 28%; border-radius: 12px; }
      .start-circle .label{ font-size:13px; }
    }
  </style>
</head>

<body>
  <div class="stage">
    <div class="disc">

      <!-- דמו תמונות (תוכל להחליף לקבצים שלך) -->
      <div class="slot p12"><img src="assets/still1_real.jpg" alt=""></div>
      <div class="slot p2"><img src="assets/still2_real.jpg" alt=""></div>
      <div class="slot p3"><img src="assets/still3_real.jpg" alt=""></div>
      <div class="slot p5"><img src="assets/still4_real.jpg" alt=""></div>
      <div class="slot p6"><img src="assets/still1_real.jpg" alt=""></div>
      <div class="slot p7"><img src="assets/still2_real.jpg" alt=""></div>
      <div class="slot p9"><img src="assets/still3_real.jpg" alt=""></div>
      <div class="slot p10"><img src="assets/still4_real.jpg" alt=""></div>

      <!-- טבעת טקסט מסתובבת (רק זה מסתובב) -->
      <div class="ring" aria-hidden="true">
        <svg viewBox="0 0 300 300">
          <defs>
            <path id="circlePath" d="M150,150 m-108,0 a108,108 0 1,1 216,0 a108,108 0 1,1 -216,0" />
          </defs>

          <g class="ring-spin">
            <text fill="var(--ringText)" font-size="16" font-weight="800" letter-spacing="1.2">
              <textPath href="#circlePath" startOffset="50%" text-anchor="middle">
                חותם שנשאר לדורות • מי היו סבא וסבתא? • סיפורי משפחה ומורשת • המחשת סיפורי גבורה ומסירות נפש •
              </textPath>
            </text>
          </g>
        </svg>
      </div>

      <!-- מרכז + כפתור -->
      <div class="hub">
        <div class="hub-inner">
          <button class="start-circle" id="startBtn" type="button" title="התחל">
            <div class="hand">👆</div>
            <div class="label">התחל</div>
          </button>
        </div>
      </div>

    </div>
  </div>

  <script>
    // יעד הכפתור – תעדכן לפורום שלך:
    const FORM_URL = "form.html";
    document.getElementById("startBtn").addEventListener("click", () => {
      window.location.href = FORM_URL;
    });
  </script>
</body>
</html>
