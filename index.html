<!doctype html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>hotam.vip | חותם - מורשת נצחית</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #efe7db; --accent: #7a5a2b; --gold: #c5a059; }
        
        body { 
            margin: 0; background: var(--bg); 
            background-image: url("https://www.transparenttextures.com/patterns/aged-paper.png");
            font-family: 'Assistant', sans-serif; 
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
        }

        /* כותרת עוטפת צמודה מאוד לדיסק */
        .header-wrap {
            width: min(95vw, 600px);
            height: 120px;
            margin-bottom: -50px; /* הצמדה לדיסק */
            z-index: 100;
        }

        .stage {
            position: relative;
            width: min(82vmin, 580px); /* צמצום קל של הרדיוס הכללי */
            aspect-ratio: 1/1;
            display: flex; justify-content: center; align-items: center;
        }

        /* גוף הדיסק עם צבע עתיק עמוק */
        .disc-body {
            position: absolute; inset: 0;
            background: radial-gradient(circle, #222 0%, #050505 85%, #1a150f 100%);
            border-radius: 50%;
            box-shadow: 0 25px 60px rgba(0,0,0,0.7);
            border: 4px solid #111;
        }

        /* חריצים על הדיסק */
        .disc-body::after {
            content: ""; position: absolute; inset: 0; border-radius: 50%;
            background: repeating-radial-gradient(circle, transparent 0, transparent 2px, rgba(255,255,255,0.02) 3px);
        }

        .gallery { position: absolute; inset: 0; z-index: 5; }

        .item {
            position: absolute;
            width: 22%; height: 16%;
            border-radius: 6px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.9);
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
            background: #000;
        }

        .item video, .item img { width: 100%; height: 100%; object-fit: cover; }

        /* מיקומים פנימיים - חישוב חדש למניעת בריחה */
        .pos-1 { top: 12%; left: 50%; transform: translateX(-50%); } 
        .pos-2 { top: 24%; right: 14%; } 
        .pos-3 { top: 50%; right: 10%; transform: translateY(-50%); } 
        .pos-4 { bottom: 24%; right: 14%; } 
        .pos-5 { bottom: 12%; left: 50%; transform: translateX(-50%); } 
        .pos-6 { bottom: 24%; left: 14%; } 
        .pos-7 { top: 50%; left: 10%; transform: translateY(-50%); } 
        .pos-8 { top: 24%; left: 14%; } 

        /* טקסט מסתובב סביב ההתחל */
        .spin-ring {
            position: absolute; width: 42%; height: 42%;
            z-index: 10; animation: rotateRing 45s linear infinite;
        }
        @keyframes rotateRing { to { transform: rotate(360deg); } }

        /* מרכז הדיסק */
        .hub {
            position: absolute; z-index: 20;
            width: 26%; height: 26%;
            background: radial-gradient(circle, #fff 50%, #e0e0e0 100%);
            border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            border: 4px solid #fff;
            text-decoration: none;
            transition: transform 0.2s;
        }
        .hub:hover { transform: scale(1.05); }
        .hub b { color: #000; font-size: 1.1rem; font-weight: 900; }

        svg { width: 100%; height: 100%; overflow: visible; }
        .curved-text { fill: #222; font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
        .accent-color { fill: var(--accent); }
        .inner-text { fill: rgba(255,255,255,0.8); font-size: 13px; font-weight: 700; }

        @media (max-width: 600px) {
            .header-wrap { height: 90px; margin-bottom: -30px; }
            .curved-text { font-size: 16px; }
            .stage { width: 92vw; height: 92vw; }
        }
    </style>
</head>
<body>

    <div class="header-wrap">
        <svg viewBox="0 0 500 120">
            <path id="curve" d="M 60,100 A 190,70 0 0,1 440,100" fill="none" />
            <text class="curved-text">
                <textPath href="#curve" startOffset="50%" text-anchor="middle">
                    הפעם זה לא עוד אלבום תמונות. הפעם זה <tspan class="accent-color">חותם</tspan> שנשאר לדורות.
                </textPath>
            </text>
        </svg>
    </div>

    <div class="stage">
        <div class="disc-body"></div>
        
        <div class="gallery">
            <div class="item pos-1"><video autoplay muted loop playsinline><source src="faith1.mp4" type="video/mp4"></video></div>
            <div class="item pos-2"><img src="still1_real.jpg"></div>
            <div class="item pos-3"><img src="still3_real.jpg"></div>
            <div class="item pos-4"><video autoplay muted loop playsinline><source src="faith2.mp4" type="video/mp4"></video></div>
            <div class="item pos-5"><video autoplay muted loop playsinline><source src="faith3.mp4" type="video/mp4"></video></div>
            <div class="item pos-6"><img src="still2_real.jpg"></div>
            <div class="item pos-7"><video autoplay muted loop playsinline><source src="faith4.mp4" type="video/mp4"></video></div>
            <div class="item pos-8"><img src="still4_real.jpg"></div>
        </div>

        <div class="spin-ring">
            <svg viewBox="0 0 200 200">
                <path id="ring" d="M 100, 100 m -75, 0 a 75,75 0 1,1 150,0 a 75,75 0 1,1 -150,0" fill="none"/>
                <text class="inner-text">
                    <textPath href="#ring">
                         • סיפורי משפחה ומורשת • חותם שנשאר לדורות • זיכרון אבות שלא יאבד •
                    </textPath>
                </text>
            </svg>
        </div>

        <a href="https://hotam.vip/forum" class="hub">
            <b>התחל</b>
            <span style="font-size: 1.2rem;">📜</span>
        </a>
    </div>

</body>
</html>
