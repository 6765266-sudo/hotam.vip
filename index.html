<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>hotam.vip</title>
  <style>
    :root{
      --bg:#efe7db;
      --discShadow: 0 28px 60px rgba(0,0,0,.25);
      --tileShadow: 0 14px 30px rgba(0,0,0,.35);
      --spinDur: 26s; /* מהיר יותר => מספר קטן יותר. איטי יותר => מספר גדול יותר */
      --tileW: clamp(138px, 22vw, 250px);
      --tileH: clamp(78px, 12vw, 140px);
      --radius: clamp(210px, 34vmin, 360px);
      --ringSize: clamp(220px, 36vmin, 410px);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100svh;
      background: radial-gradient(1200px 700px at 50% 35%, #f6f0e7 0%, var(--bg) 55%, #e8dfd1 100%);
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      display:grid;
      place-items:center;
      padding: 18px;
      overflow:hidden;
    }

    .stage{
      width: min(92vmin, 920px);
      aspect-ratio: 1/1;
      position:relative;
      display:grid;
      place-items:center;
    }

    /* הדיסק */
    .disc{
      position:absolute;
      inset:0;
      border-radius:50%;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.06) 0 34%, rgba(0,0,0,.0) 35% 100%),
        repeating-radial-gradient(circle at 50% 50%,
          rgba(255,255,255,.035) 0 2px,
          rgba(0,0,0,.0) 2px 7px
        ),
        radial-gradient(circle at 50% 50%,
          #141414 0%,
          #0c0c0c 52%,
          #080808 100%
        );
      box-shadow: var(--discShadow);
      filter: saturate(1.02) contrast(1.03);
    }

    /* שכבת טבעת הטקסט */
    .ring{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      pointer-events:none;
      z-index: 6;
    }
    .ring svg{
      width: var(--ringSize);
      height: var(--ringSize);
      display:block;
      overflow:visible;
    }
    .ring-spin{
      transform-origin: 150px 150px;
      animation: spin var(--spinDur) linear infinite;
      will-change: transform;
    }
    @keyframes spin{
      from{ transform: rotate(0deg); }
      to{ transform: rotate(360deg); }
    }

    /* מרכז (כמו CD/DVD) */
    .center{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      z-index: 7;
      pointer-events:none;
    }
    .hub{
      width: clamp(210px, 34vmin, 360px);
      height: clamp(210px, 34vmin, 360px);
      border-radius:50%;
      background:
        radial-gradient(circle at 50% 50%,
          rgba(255,255,255,.88) 0%,
          rgba(230,230,230,.92) 35%,
          rgba(200,200,200,.95) 58%,
          rgba(245,245,245,.92) 75%,
          rgba(255,255,255,.85) 100%
        );
      box-shadow:
        inset 0 12px 30px rgba(0,0,0,.22),
        inset 0 -14px 22px rgba(255,255,255,.55);
      display:grid;
      place-items:center;
    }
    .hub-inner{
      width: 62%;
      height: 62%;
      border-radius:50%;
      background:
        radial-gradient(circle at 50% 50%,
          #f5f5f5 0%,
          #e2e2e2 45%,
          #cfcfcf 70%,
          #efefef 100%
        );
      box-shadow:
        inset 0 10px 22px rgba(0,0,0,.18),
        0 10px 26px rgba(0,0,0,.15);
      display:grid;
      place-items:center;
      position:relative;
    }
    .start-btn{
      pointer-events:auto;
      width: 42%;
      height: 42%;
      border-radius: 999px;
      border: 0;
      cursor: pointer;
      display:grid;
      place-items:center;
      gap:6px;
      background: radial-gradient(circle at 50% 40%, #f7f7f7 0%, #e7e7e7 58%, #d6d6d6 100%);
      box-shadow:
        inset 0 10px 16px rgba(255,255,255,.9),
        inset 0 -12px 18px rgba(0,0,0,.14),
        0 10px 22px rgba(0,0,0,.18);
      text-decoration:none;
      color:#222;
      transform: translateZ(0);
      transition: transform .15s ease, filter .15s ease;
    }
    .start-btn:hover{ filter: brightness(1.06); transform: scale(1.02); }
    .start-btn:active{ transform: scale(.98); filter: brightness(1.03); }
    .hand{
      font-size: clamp(18px, 2.2vmin, 24px);
      line-height: 1;
    }
    .start-text{
      font-weight: 800;
      font-size: clamp(12px, 1.7vmin, 14px);
      letter-spacing: .2px;
    }

    /* הכרטיסים סביב הדיסק */
    .tiles{
      position:absolute;
      inset:0;
      z-index: 8;
      pointer-events:none;
    }
    .tile{
      position:absolute;
      width: var(--tileW);
      height: var(--tileH);
      border-radius: 16px;
      overflow:hidden;
      box-shadow: var(--tileShadow);
      transform:
        rotate(var(--a))
        translate(var(--radius))
        rotate(calc(var(--a) * -1));
      transform-origin: center;
      will-change: transform;
      pointer-events:auto;
      background:#111;
    }
    .tile .media{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
      filter: contrast(1.02) saturate(1.02);
    }

    /* שכבת קריאות לטקסט — שקוף מאוד, לא מסתיר פנים */
    .tile::after{
      content:"";
      position:absolute;
      inset:auto 0 0 0;
      height: 54%;
      background: linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0));
      pointer-events:none;
    }

    .cap{
      position:absolute;
      right: 10px;
      bottom: 10px;
      left: 10px;
      text-align:right;
      color:#fff;
      text-shadow: 0 2px 10px rgba(0,0,0,.75);
      font-weight: 800;
      line-height: 1.08;
      pointer-events:none;
    }
    .cap .t1{
      font-size: clamp(12px, 1.7vmin, 15px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cap .t2{
      margin-top: 4px;
      font-size: clamp(10px, 1.45vmin, 13px);
      font-weight: 700;
      opacity: .95;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* התאמות מובייל */
    @media (max-width: 640px){
      :root{
        --tileW: clamp(118px, 36vw, 170px);
        --tileH: clamp(68px, 20vw, 100px);
        --radius: clamp(165px, 33vmin, 240px);
        --ringSize: clamp(190px, 40vmin, 260px);
      }
      .cap .t1{ font-size: 12px; }
      .cap .t2{ font-size: 11px; }
    }

    /* נגישות: אם משתמש ביקש להפחית תנועה */
    @media (prefers-reduced-motion: reduce){
      .ring-spin{ animation: none; }
    }
  </style>
</head>

<body>
  <main class="stage">
    <div class="disc" aria-hidden="true"></div>

    <!-- הטקסט המעגלי (עם תאימות Safari/iPhone: גם href וגם xlink:href) -->
    <div class="ring" aria-hidden="true">
      <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
        <defs>
          <path id="circlePath"
            d="M150,150 m-108,0 a108,108 0 1,1 216,0 a108,108 0 1,1 -216,0"/>
        </defs>

        <g class="ring-spin">
          <text
            fill="rgba(255,255,255,0.78)"
            font-size="16"
            font-weight="900"
            letter-spacing="0.2"
            style="paint-order:stroke; stroke: rgba(0,0,0,0.45); stroke-width:1px;"
          >
            <textPath
              href="#circlePath"
              xlink:href="#circlePath"
              startOffset="50%"
              text-anchor="middle"
            >
              • חותם שנשאר לדורות • מי היו סבא וסבתא • סיפורי משפחה ומורשת • המחשת גבורה ומסירות נפש •
            </textPath>
          </text>
        </g>
      </svg>
    </div>

    <!-- המרכז (כפתור בסגנון דיסק) -->
    <div class="center">
      <div class="hub">
        <div class="hub-inner">
          <a class="start-btn" href="form.html" aria-label="התחל">
            <div class="hand">👆</div>
            <div class="start-text">התחל</div>
          </a>
        </div>
      </div>
    </div>

    <!-- 8 מדיות סביב הדיסק (סימטרי 45°) -->
    <section class="tiles" aria-label="בחירה">
      <!-- 12 -->
      <article class="tile" style="--a: 90deg">
        <video class="media" src="assets/faith1.mp4" autoplay muted loop playsinline preload="metadata"></video>
        <div class="cap">
          <div class="t1">זיכרון אבות</div>
          <div class="t2">שלא יאבד</div>
        </div>
      </article>

      <!-- 1:30 -->
      <article class="tile" style="--a: 45deg">
        <img class="media" src="assets/still1_real.jpg" alt="" loading="lazy" />
        <div class="cap">
          <div class="t1">חותם שנשאר לדורות</div>
          <div class="t2">שהנכדים ידעו</div>
        </div>
      </article>

      <!-- 3 -->
      <article class="tile" style="--a: 0deg">
        <video class="media" src="assets/faith2.mp4" autoplay muted loop playsinline preload="metadata"></video>
        <div class="cap">
          <div class="t1">להעביר מורשת</div>
          <div class="t2">מדור לדור</div>
        </div>
      </article>

      <!-- 4:30 -->
      <article class="tile" style="--a: -45deg">
        <img class="media" src="assets/still3_real.jpg" alt="" loading="lazy" />
        <div class="cap">
          <div class="t1">מתיקות התורה</div>
          <div class="t2">של סבא</div>
        </div>
      </article>

      <!-- 6 -->
      <article class="tile" style="--a: -90deg">
        <video class="media" src="assets/faith3.mp4" autoplay muted loop playsinline preload="metadata"></video>
        <div class="cap">
          <div class="t1">המחשת גבורה</div>
          <div class="t2">ומסירות נפש</div>
        </div>
      </article>

      <!-- 7:30 -->
      <article class="tile" style="--a: -135deg">
        <img class="media" src="assets/still2_real.jpg" alt="" loading="lazy" />
        <div class="cap">
          <div class="t1">מורשת</div>
          <div class="t2">סבא ונכד</div>
        </div>
      </article>

      <!-- 9 -->
      <article class="tile" style="--a: 180deg">
        <video class="media" src="assets/faith4.mp4" autoplay muted loop playsinline preload="metadata"></video>
        <div class="cap">
          <div class="t1">שבת בבית סבא</div>
          <div class="t2">עונג, שלווה</div>
        </div>
      </article>

      <!-- 10:30 -->
      <article class="tile" style="--a: 135deg">
        <img class="media" src="assets/still4_real.jpg" alt="" loading="lazy" />
        <div class="cap">
          <div class="t1">תפילין</div>
          <div class="t2">האות שמחבר</div>
        </div>
      </article>
    </section>
  </main>

  <script>
    // אם באייפון וידאו לא זז עד אינטראקציה – זה דוחף play שוב בעדינות
    window.addEventListener('load', () => {
      document.querySelectorAll('video.media').forEach(v => {
        v.muted = true;
        v.playsInline = true;
        const p = v.play();
        if (p && typeof p.catch === 'function') p.catch(() => {});
      });
    });

    // שינוי מהירות הסיבוב:
    // מהר יותר => מספר קטן יותר. לדוגמה: 18s
    // איטי יותר => מספר גדול יותר. לדוגמה: 34s
    // document.documentElement.style.setProperty('--spinDur', '22s');
  </script>
</body>
</html>
