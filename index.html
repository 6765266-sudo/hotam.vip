<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>hotam.vip</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100vh;
      background:#efe7db;
      font-family:"Heebo", Arial, sans-serif;
      overflow:hidden;
    }

    /* ===== LAYOUT ===== */
    .page{
      position:relative;
      width:100%;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    /* ===== SIDE TEXT (DESKTOP) ===== */
    .side-text{
      position:absolute;
      max-width:28vw;
      color:#444;
      font-size:clamp(18px,1.8vw,26px);
      line-height:1.3;
      white-space:nowrap;
    }

    .side-right{
      right:4vw;
      text-align:right;
      top:50%;
      transform:translateY(-50%);
      font-weight:600;
    }

    .side-left{
      display:none; /* בוטל לפי הדרישה */
    }

    .hotam-word{
      font-weight:800;
      font-style:italic;
      display:inline-block;
      transform:rotate(-5deg);
    }

    /* ===== DISC WRAPPER ===== */
    .stage{
      width:min(90vmin,720px);
      aspect-ratio:1/1;
      position:relative;
    }

    /* ===== DISC (לא נוגעים) ===== */
    .disc{
      position:absolute;
      inset:0;
      border-radius:50%;
      background:
        repeating-radial-gradient(circle at 50% 50%,
          rgba(255,255,255,.04) 0 2px,
          rgba(0,0,0,0) 2px 7px),
        radial-gradient(circle at 50% 50%,
          #141414 0%,
          #0c0c0c 55%,
          #080808 100%);
    }

    /* ===== ROTATING TEXT ===== */
    .ring{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      pointer-events:none;
      z-index:5;
    }

    .ring svg{
      width:82%;
      height:82%;
    }

    .ring-spin{
      animation:spin 18s linear infinite;
      transform-origin:50% 50%;
    }

    @keyframes spin{
      from{transform:rotate(0deg);}
      to{transform:rotate(360deg);}
    }

    /* ===== CENTER ===== */
    .center{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      z-index:6;
    }

    .hub{
      width:42%;
      height:42%;
      border-radius:50%;
      background:#eee;
      display:grid;
      place-items:center;
    }

    .start-btn{
      border:none;
      background:#fff;
      border-radius:999px;
      padding:14px 26px;
      font-weight:700;
      cursor:pointer;
    }

    /* ===================================================
       MOBILE ONLY – FIX
       =================================================== */
    @media (max-width:768px){

      body{ overflow:auto; }

      .page{
        flex-direction:column;
        justify-content:flex-start;
        padding-top:24px;
      }

      /* טקסטים חוזרים ונראים */
      .side-text{
        position:static;
        transform:none;
        max-width:100%;
        white-space:normal;
        text-align:center;
        font-size:20px;
        margin:12px 16px;
        display:block;
      }

      .side-right{
        order:1;
      }

      .stage{
        order:2;
        width:88vw;
        margin:10px auto;
      }

      .side-left{
        display:block;
        order:3;
        font-size:20px;
      }

      /* טקסט עגול – קטן וקריא */
      .ring{
        z-index:8;
      }

      .ring svg{
        width:78%;
        height:78%;
      }

      .ring text{
        font-size:12px;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <!-- TEXT RIGHT (DESKTOP) -->
    <div class="side-text side-right">
      הפעם זה לא עוד אלבום תמונות.<br>
      הפעם זה <span class="hotam-word">חותם</span> שנשאר לדורות.
    </div>

    <!-- DISC -->
    <main class="stage">

      <div class="disc"></div>

      <!-- ROTATING TEXT -->
      <div class="ring">
        <svg viewBox="0 0 300 300">
          <defs>
            <path id="circlePath"
              d="M150,150 m-120,0 a120,120 0 1,1 240,0 a120,120 0 1,1 -240,0"/>
          </defs>
          <g class="ring-spin">
            <text fill="#fff" font-weight="700" letter-spacing="1">
              <textPath href="#circlePath" startOffset="50%" text-anchor="middle">
                זיכרון אבות • סיפורי משפחה • מסירות נפש • חותם שנשאר לדורות • מורשת
              </textPath>
            </text>
          </g>
        </svg>
      </div>

      <!-- CENTER -->
      <div class="center">
        <div class="hub">
          <button class="start-btn">התחל</button>
        </div>
      </div>

    </main>

    <!-- TEXT BOTTOM (MOBILE) -->
    <div class="side-text side-left">
      הפעם זה <span class="hotam-word">חותם</span> שנשאר לדורות.
    </div>

  </div>
</body>
</html>
