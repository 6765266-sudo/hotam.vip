<!doctype html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>HOTAM VIP | טסט שיפוץ</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #0a0a0a, color: #fff, font-family: 'Assistant', sans-serif, text-align: center, margin: 0, padding: 0, }
        .container { padding: 50px, }
        .logo { width: 200px, margin-bottom: 30px, }
        .grid { display: grid, grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)), gap: 20px, max-width: 1000px, margin: 0 auto, }
        .box { background: #1a1a1a, border: 1px solid #c5a059, padding: 40px, color: #c5a059, font-weight: bold, font-size: 1.2rem, }
    </style>
</head>
<body>
    <div class="container">
        <img src="gold-seal.png" class="logo">
        <h1>דף טסט - שיפוץ אתר חותם</h1>
        <div class="grid">
            <div class="box">בר מצווה עלילתי</div>
            <div class="box">מורשת וזיכרון</div>
            <div class="box">בת מצווה מהסרטים</div>
            <div class="box">עסקים וסושיאל</div>
            <div class="box">מוסדות ועמותות</div>
            <div class="box">אירועים מיוחדים</div>
        </div>
    </div>
</body>
</html>
