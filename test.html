<!doctype html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>HOTAM VIP | להמחיש את הרגש</title>
    <link rel="icon" type="image/png" href="gold-seal.png">
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;400;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #c5a059; --dark: #050505; --soft-gold: rgba(197, 160, 89, 0.15); }
        
        body, html { 
            margin: 0; padding: 0; 
            background-color: var(--dark); 
            /* רקע עם טקסטורה יוקרתית עדינה */
            background-image: radial-gradient(circle at center, #111 0%, #050505 100%);
            color: #fff; 
            font-family: 'Assistant', sans-serif; 
            scroll-behavior: smooth; 
            overflow-x: hidden;
        }

        /* מסך פתיחה יוקרתי */
        .hero { 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            padding: 20px;
        }

        .main-seal { 
            width: clamp(250px, 35vw, 420px); 
            cursor: pointer; 
            transition: 0.8s cubic-bezier(0.2, 1, 0.3, 1); 
            filter: drop-shadow(0 0 20px rgba(197, 160, 89, 0.2)); 
        }
        
        .main-seal:hover { 
            transform: scale(1.04) rotate(1deg); 
            filter: drop-shadow(0 0 45px var(--gold)); 
        }

        .hero-tagline { 
            font-family: 'Playfair Display', serif; 
            color: var(--gold); 
            font-size: 1.7rem; 
            letter-spacing: 6px; 
            margin-top: 30px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* גריד שירותים משופר */
        .services { padding: 100px 5%; max-width: 1300px; margin: 0 auto; }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 30px; 
        }

        .card { 
            background: #0d0d0d; 
            border: 1px solid #1a1a1a; 
            position: relative; 
            aspect-ratio: 16/10; 
            overflow: hidden; 
            transition: 0.5s ease; 
            display: flex; 
            align-items: flex-end; 
            text-decoration: none; 
            border-radius: 2px;
        }

        .card:hover { 
            border-color: var(--gold); 
            transform: translateY(-10px); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card video { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            object-fit: cover; 
            opacity: 0.35; 
            transition: 0.6s;
        }

        .card:hover video { opacity: 0.8; transform: scale(1.05); }

        .card-label { 
            position: relative; 
            z-index: 2; 
            width: 100%; 
            background: linear-gradient(transparent, rgba(0,0,0,0.95)); 
            padding: 25px 15px; 
            color: var(--gold); 
            font-size: 1.4rem; 
            font-weight: 700; 
            text-align: center;
            letter-spacing: 1px;
        }

        .cta-area { text-align: center; margin-top: 80px; }
        
        .forum-btn { 
            display: inline-block; 
            padding: 22px 70px; 
            border: 2px solid var(--gold); 
            color: var(--gold); 
            text-decoration: none; 
            font-weight: 800; 
            font-size: 1.2rem; 
            transition: 0.4s; 
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .forum-btn:hover { 
            background: var(--gold); 
            color: #000; 
            box-shadow: 0 0 40px var(--gold); 
        }

        @media (max-width: 950px) { 
            .grid { grid-template-columns: 1fr; } 
            .hero-tagline { font-size: 1.2rem; letter-spacing: 3px; }
        }
    </style>
</head>
<body>

    <section class="hero" id="top">
        <img src="gold-seal.png" class="main-seal" alt="HOTAM VIP" onclick="document.getElementById('services-area').scrollIntoView()">
        <div class="hero-tagline">להמחיש את הרגש. להשאיר חותם.</div>
    </section>

    <section id="services-area" class="services">
        <div class="grid">
            <a href="forum.html" class="card">
                <video autoplay muted loop playsinline><source src="bar-mitzvah.mp4" type="video/mp4"></video>
                <div class="card-label">בר מצווה עלילתי</div>
            </a>
            <a href="forum.html" class="card"><div class="card-label">מורשת וזיכרון</div></a>
            <a href="forum.html" class="card"><div class="card-label">בת מצווה מהסרטים</div></a>
            <a href="forum.html" class="card"><div class="card-label">עסקים וסושיאל</div></a>
            <a href="forum.html" class="card"><div class="card-label">מוסדות ועמותות</div></a>
            <a href="forum.html" class="card"><div class="card-label">אירועים מיוחדים</div></a>
        </div>

        <div class="cta-area">
            <a href="forum.html" class="forum-btn">לבדיקת התאמה והזמנת הפקה</a>
        </div>
    </section>

    <script>
        // מבטיח שתמיד יתחיל מלמעלה
        if ('scrollRestoration' in history) { history.scrollRestoration = 'manual'; }
        window.scrollTo(0, 0);
    </script>
</body>
</html>
