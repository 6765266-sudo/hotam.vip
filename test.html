<!doctype html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>HOTAM VIP | להמחיש את הרגש</title>
    <link rel="icon" type="image/png" href="gold-seal.png">
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;400;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #c5a059; --dark: #050505; }
        body, html { margin: 0; padding: 0; background: var(--dark); color: #fff; font-family: 'Assistant', sans-serif; scroll-behavior: smooth; }
        .hero { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: radial-gradient(circle, #1a1a1a 0%, #000 100%); }
        .main-seal { width: clamp(250px, 35vw, 420px); cursor: pointer; transition: 0.8s; filter: drop-shadow(0 0 15px rgba(197, 160, 89, 0.2)); }
        .main-seal:hover { transform: scale(1.03); filter: drop-shadow(0 0 40px var(--gold)); }
        .hero-tagline { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.6rem; letter-spacing: 5px; margin-top: 20px; }
        .services { padding: 80px 5%; max-width: 1300px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; }
        .card { background: #0a0a0a; border: 1px solid #1a1a1a; position: relative; aspect-ratio: 16/10; overflow: hidden; transition: 0.5s; display: flex; align-items: flex-end; text-decoration: none; }
        .card:hover { border-color: var(--gold); transform: translateY(-8px); }
        .card video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.3; }
        .card:hover video { opacity: 0.7; }
        .card-label { position: relative; z-index: 2; width: 100%; background: linear-gradient(transparent, rgba(0,0,0,0.9)); padding: 20px; color: var(--gold); font-size: 1.3rem; font-weight: 700; text-align: center; }
        .cta-area { text-align: center; margin-top: 60px; }
        .forum-btn { display: inline-block; padding: 20px 60px; border: 2px solid var(--gold); color: var(--gold); text-decoration: none; font-weight: 800; font-size: 1.1rem; transition: 0.4s; }
        .forum-btn:hover { background: var(--gold); color: #000; box-shadow: 0 0 30px var(--gold); }
        @media (max-width: 850px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <section class="hero">
        <img src="gold-seal.png" class="main-seal" alt="HOTAM VIP" onclick="document.getElementById('services-area').scrollIntoView()">
        <div class="hero-tagline">להמחיש את הרגש. להשאיר חותם.</div>
    </section>
    <section id="services-area" class="services">
        <div class="grid">
            <a href="forum.html" class="card">
                <video autoplay muted loop playsinline><source src="bar-mitzvah.mp4" type="video/mp4"></video>
                <div class="card-label">בר מצווה עלילתי</div>
            </a>
            <a href="forum.html" class="card"><div class="card-label">מורשת וזיכרון</div></a>
            <a href="forum.html" class="card"><div class="card-label">בת מצווה מהסרטים</div></a>
            <a href="forum.html" class="card"><div class="card-label">עסקים וסושיאל</div></a>
            <a href="forum.html" class="card"><div class="card-label">מוסדות ועמותות</div></a>
            <a href="forum.html" class="card"><div class="card-label">אירועים מיוחדים</div></a>
        </div>
        <div class="cta-area">
            <a href="forum.html" class="forum-btn">לבדיקת התאמה והזמנת הפקה</a>
        </div>
    </section>
</body>
</html>
