<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>James | יוצר סרטי סושיאל וסיפורי חיים</title>
    <style>
        body {
            margin: 0,
            padding: 0,
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif,
            background-color: #050505,
            color: #ffffff,
            scroll-behavior: smooth,
        }

        /* מסך הבית - Hero */
        .hero {
            height: 100vh,
            display: flex,
            flex-direction: column,
            justify-content: center,
            align-items: center,
            text-align: center,
            background: radial-gradient(circle, #1a1a1a 0%, #050505 100%),
        }

        .gold-seal {
            width: 250px,
            height: 250px,
            cursor: pointer,
            transition: transform 0.3s ease,
            filter: drop-shadow(0px 0px 20px rgba(212, 175, 55, 0.5)),
        }

        .gold-seal:hover {
            transform: scale(1.05),
        }

        /* רשת הקוביות */
        .services-grid {
            display: grid,
            grid-template-columns: repeat(3, 1fr),
            gap: 20px,
            padding: 50px,
            max-width: 1200px,
            margin: 0 auto,
        }

        .service-card {
            background: #111,
            border: 1px solid #333,
            border-radius: 10px,
            padding: 15px,
            text-align: center,
            transition: border-color 0.3s ease,
        }

        .service-card:hover {
            border-color: #d4af37,
        }

        .service-card h3 {
            color: #d4af37,
            margin-bottom: 15px,
            font-size: 1.2rem,
        }

        /* מכולת הוידאו */
        .video-container {
            width: 100%,
            border-radius: 5px,
            overflow: hidden,
            background: #000,
            aspect-ratio: 16 / 9,
        }

        video {
            width: 100%,
            height: 100%,
            object-fit: cover,
        }

        /* התאמה לנייד */
        @media (max-width: 768px) {
            .services-grid {
                grid-template-columns: repeat(1, 1fr),
            }
        }
    </style>
</head>
<body>

    <section class="hero">
        <a href="#services">
            <img src="gold-seal.png" alt="James Gold Seal" class="gold-seal">
        </a>
        <h1 style="margin-top: 20px, color: #d4af37, letter-spacing: 2px,">JAMES</h1>
        <p style="font-size: 1.1rem, opacity: 0.8,">יוצר סרטי סושיאל וסיפורי חיים</p>
    </section>

    <section id="services" class="services-grid">
        
        <div class="service-card">
            <h3>בר מצווה עלילתי</h3>
            <div class="video-container">
                <video autoplay muted loop playsinline>
                    <source src="bar-mitzvah.mp4" type="video/mp4">
                </video>
            </div>
        </div>

        <div class="service-card">
            <h3>מורשת וזיכרון</h3>
            <div class="video-container">
                <video autoplay muted loop playsinline>
                    <source src="heritage.mp4" type="video/mp4">
                </video>
            </div>
        </div>

        <div class="service-card">
            <h3>בת מצווה מהסרטים</h3>
            <div class="video-container">
                <video autoplay muted loop playsinline>
                    <source src="bat-mitzvah.mp4" type="video/mp4">
                </video>
            </div>
        </div>

        <div class="service-card">
            <h3>עסקים וסושיאל</h3>
            <div class="video-container">
                <video autoplay muted loop playsinline>
                    <source src="business.mp4" type="video/mp4">
                </video>
            </div>
        </div>

        <div class="service-card">
            <h3>מוסדות ועמותות</h3>
            <div class="video-container">
                <video autoplay muted loop playsinline>
                    <source src="institutions.mp4" type="video/mp4">
                </video>
            </div>
        </div>

        <div class="service-card">
            <h3>אירועים מיוחדים</h3>
            <div class="video-container">
                <video autoplay muted loop playsinline>
                    <source src="events.mp4" type="video/mp4">
                </video>
            </div>
        </div>

    </section>

</body>
</html>
