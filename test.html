<!doctype html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>HOTAM VIP | להמחיש את הרגש</title>
    
    <link rel="icon" type="image/png" href="favicon.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;400;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #c5a059; --dark: #050505; }
        body, html { margin: 0; padding: 0; background: var(--dark); color: #fff; font-family: 'Assistant', sans-serif; scroll-behavior: smooth; }
        
        .hero { 
            height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            text-align: center; background: radial-gradient(circle, #151515 0%, #000 100%); padding: 20px;
        }
        .logo { font-family: 'Playfair Display', serif; font-size: clamp(2.5rem, 8vw, 4rem); color: var(--gold); letter-spacing: 8px; margin-bottom: 5px; }
        .tagline { font-size: 1.2rem; font-weight: 200; color: #aaa; margin-bottom: 40px; border-bottom: 1px solid var(--gold); padding-bottom: 10px; }

        .section { padding: 80px 10%; text-align: center; }
        .section h2 { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 2.2rem; margin-bottom: 20px; }
        
        .gallery { background: #000; padding: 60px 5%; border-top: 1px solid #111; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; justify-content: center; }
        .gallery-item { aspect-ratio: 16/9; background: #111; border: 1px solid #333; overflow: hidden; position: relative; max-width: 800px; margin: 0 auto; }
        .gallery-item video { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        .video-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.3); z-index: 1; pointer-events: none;
        }

        .cta-btn { 
            display: inline-block; margin-top: 30px; padding: 16px 45px; 
            border: 2px solid var(--gold); color: var(--gold); font-weight: 800; 
            text-decoration: none; transition: 0.4s;
        }
        .cta-btn:hover { background: var(--gold); color: #000; }
    </style>
</head>
<body>

    <section class="hero">
        <div class="logo">HOTAM VIP</div>
        <div class="tagline">להמחיש את הרגש. להשאיר חותם.</div>
    </section>

    <section class="gallery">
        <h2 style="text-align: center; color: var(--gold); margin-bottom: 30px;">הצצה ליצירה</h2>
        <div class="gallery-grid">
            <div class="gallery-item">
                <div class="video-overlay"></div>
                <video autoplay muted loop playsinline>
                    <source src="video1.mp4" type="video/mp4">
                    הדפדפן שלך לא תומך בנגן הוידאו.
                </video>
            </div>
        </div>
        <div style="text-align: center; margin-top: 40px;">
            <a href="https://hotam.vip/forum" class="cta-btn">לבדיקת התאמה והזמנת הפקה</a>
        </div>
    </section>

</body>
</html>
