<!doctype html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>HOTAM VIP | חותם - הפקה ויזואלית נצחית</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;400;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #c5a059; --dark: #0a0a0a; --gray: #1a1a1a; }
        body, html { margin: 0; padding: 0; background: var(--dark); color: #fff; font-family: 'Assistant', sans-serif; overflow-x: hidden; }
        
        /* רקע קולנועי */
        .hero { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: radial-gradient(circle, #1a1a1a 0%, #000 100%); position: relative; }
        .hero::before { content: ""; position: absolute; inset: 0; background-image: url('https://www.transparenttextures.com/patterns/carbon-fibre.png'); opacity: 0.2; }

        .logo { font-family: 'Playfair Display', serif; font-size: 4rem; color: var(--gold); letter-spacing: 5px; margin-bottom: 10px; text-transform: uppercase; }
        .tagline { font-size: 1.5rem; font-weight: 200; letter-spacing: 2px; color: #ccc; margin-bottom: 40px; }

        /* כרטיסי שירותים */
        .services { display: flex; gap: 20px; padding: 50px; justify-content: center; flex-wrap: wrap; }
        .card { width: 300px; height: 400px; background: var(--gray); border: 1px solid #333; position: relative; overflow: hidden; transition: 0.5s; cursor: pointer; display: flex; align-items: flex-end; padding: 20px; text-decoration: none; }
        .card:hover { border-color: var(--gold); transform: translateY(-10px); }
        .card h3 { font-size: 1.8rem; color: var(--gold); z-index: 2; margin: 0; }
        .card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, #000 0%, transparent 100%); z-index: 1; }

        /* הנעה לפעולה */
        .cta-section { padding: 100px 20px; text-align: center; background: #000; }
        .cta-section h2 { font-size: 2.5rem; margin-bottom: 20px; font-family: 'Playfair Display', serif; }
        .btn-vip { display: inline-block; padding: 15px 50px; background: transparent; border: 2px solid var(--gold); color: var(--gold); font-weight: 800; font-size: 1.2rem; text-decoration: none; transition: 0.3s; text-transform: uppercase; }
        .btn-vip:hover { background: var(--gold); color: #000; }

        @media (max-width: 768px) { .logo { font-size: 2.5rem; } .services { padding: 20px; } }
    </style>
</head>
<body>

    <section class="hero">
        <div class="logo">HOTAM VIP</div>
        <div class="tagline">הפעם זה לא עוד אלבום. הפעם זה חותם.</div>
        <a href="#contact" class="btn-vip">האם הסיפור שלך ראוי לחותם?</a>
    </section>

    <section class="services">
        <a href="#" class="card">
            <div style="position:absolute; inset:0; background:url('https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=400') center; background-size:cover; opacity:0.4;"></div>
            <h3>סרט בר מצווה<br>הוליוודי</h3>
        </a>
        <a href="#" class="card">
            <div style="position:absolute; inset:0; background:url('https://images.unsplash.com/photo-1505664194779-8beaceb93744?auto=format&fit=crop&w=400') center; background-size:cover; opacity:0.4;"></div>
            <h3>תיעוד מורשת<br>חותם נצחי</h3>
        </a>
        <a href="#" class="card">
            <div style="position:absolute; inset:0; background:url('https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=400') center; background-size:cover; opacity:0.4;"></div>
            <h3>הפקות VIP<br>ויזואליות</h3>
        </a>
    </section>

    <section class="cta-section" id="contact">
        <h2>הסיפור שלך מחכה לבמאי הנכון.</h2>
        <p>אנחנו לא מקבלים כל פרויקט. אנחנו מחפשים סיפורים עם נשמה.</p>
        <br>
        <a href="https://hotam.vip/forum" class="btn-vip">לבדיקת התאמה והשארת פרטים</a>
    </section>

</body>
</html>
