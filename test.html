<!doctype html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>HOTAM VIP | להמחיש את הרגש</title>
    
    <link rel="icon" type="image/png" href="favicon.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;400;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #c5a059; --dark: #050505; }
        body, html { margin: 0; padding: 0; background: var(--dark); color: #fff; font-family: 'Assistant', sans-serif; scroll-behavior: smooth; }
        
        .hero { 
            height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            text-align: center; background: radial-gradient(circle, #151515 0%, #000 100%); padding: 20px;
        }
        .logo-main { cursor: pointer; transition: 0.5s; }
        .logo-main:hover { transform: scale(1.05); filter: drop-shadow(0 0 15px var(--gold)); }
        
        .section { padding: 80px 10%; text-align: center; }
        .section h2 { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 2.2rem; margin-bottom: 40px; }

        /* גריד 6 הקוביות */
        .services-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 20px; 
            max-width: 1200px; 
            margin: 0 auto;
        }
        .service-card { 
            background: #111; border: 1px solid #222; padding: 0; transition: 0.4s; 
            text-decoration: none; color: inherit; overflow: hidden; position: relative;
            aspect-ratio: 16/10; display: flex; flex-direction: column; justify-content: flex-end;
        }
        .service-card:hover { border-color: var(--gold); transform: translateY(-5px); }
        .service-card h3 { 
            background: rgba(0,0,0,0.7); color: var(--gold); margin: 0; padding: 15px; 
            font-size: 1.3rem; z-index: 2; border-top: 1px solid var(--gold);
        }
        
        .video-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .video-container video { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }

        footer { padding: 30px; text-align: center; color: #333; font-size: 0.75rem; }
    </style>
</head>
<body>

    <section class="hero">
        <div class="logo-main" onclick="document.getElementById('services').scrollIntoView()">
            <img src="favicon.png" alt="HOTAM VIP" style="width: 250px; border: 2px solid var(--gold); border-radius: 15px;">
        </div>
        <div style="margin-top: 20px; color: var(--gold); font-size: 1.2rem; font-weight: 200; letter-spacing: 5px;">לחץ לחתימה אישית</div>
    </section>

    <section class="section" id="services">
        <h2>השירותים שלנו</h2>
        <div class="services-grid">
            
            <a href="#video-1" class="service-card">
                <div class="video-container">
                    <video autoplay muted loop playsinline><source src="bar-mitzvah-film.mp4" type="video/mp4"></video>
                </div>
                <h3>בר מצווה עלילתי</h3>
            </a>

            <a href="#video-2" class="service-card">
                <div class="video-container">
                    <video autoplay muted loop playsinline><source src="video1.mp4" type="video/mp4"></video>
                </div>
                <h3>מורשת וזיכרון</h3>
            </a>

            <div class="service-card"><h3>בת מצווה מהסרטים</h3></div>
            <div class="service-card"><h3>עסקים וסושיאל</h3></div>
            <div class="service-card"><h3>מוסדות ועמותות</h3></div>
            <div class="service-card"><h3>אירועים מיוחדים</h3></div>

        </div>
    </section>

    <footer>
        &copy; 2026 HOTAM VIP | חותם - להמחיש את הרגש
    </footer>

</body>
</html>
