<!doctype html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>השאירו פרטים | חותם VIP</title>
    <link rel="icon" type="image/png" href="gold-seal.png">
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;400;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #c5a059; --dark: #0a0a0a; }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; background-color: var(--dark); color: #fff; font-family: 'Assistant', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { width: 100%; max-width: 480px; padding: 60px 30px; text-align: center; }
        h1 { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 2rem; margin: 0 0 10px; letter-spacing: 2px; }
        .sub { color: #aaa; font-size: 1rem; font-weight: 200; margin: 0 0 40px; letter-spacing: 1px; }
        .form-group { margin-bottom: 20px; text-align: right; }
        label { display: block; color: var(--gold); font-size: 0.9rem; margin-bottom: 6px; letter-spacing: 1px; }
        input { width: 100%; padding: 16px; background: #111; border: 1px solid #333; color: #fff; font-family: 'Assistant', sans-serif; font-size: 1rem; outline: none; transition: border 0.3s; }
        input:focus { border-color: var(--gold); }
        .submit-btn { width: 100%; margin-top: 10px; padding: 18px; background: transparent; border: 2px solid var(--gold); color: var(--gold); font-family: 'Assistant', sans-serif; font-size: 1.1rem; font-weight: 800; letter-spacing: 2px; cursor: pointer; transition: 0.3s; }
        .submit-btn:hover { background: var(--gold); color: #000; }
        .back { display: block; margin-top: 30px; color: #555; text-decoration: none; font-size: 0.9rem; }
        .back:hover { color: var(--gold); }
        #success-area { display: none; }
        #success-area h2 { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.8rem; margin-bottom: 15px; }
        #success-area p { color: #aaa; font-size: 1rem; margin-bottom: 30px; }
        #success-area a { display: inline-block; padding: 14px 40px; border: 1px solid var(--gold); color: var(--gold); text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>
    <div class="container">
        <div id="form-area">
            <h1>נשמח לחזור אליך</h1>
            <p class="sub">השאירו שם ומספר — ונחזור אליכם בהקדם.</p>
            <form id="contact-form" action="https://formspree.io/f/xpqelbdr" method="POST">
                <div class="form-group">
                    <label>שם מלא</label>
                    <input type="text" name="name" placeholder="ישראל ישראלי" required />
                </div>
                <div class="form-group">
                    <label>טלפון</label>
                    <input type="tel" name="phone" placeholder="050-0000000" required />
                </div>
                <button type="submit" class="submit-btn">👆 שלח פרטים</button>
            </form>
            <a href="index.html" class="back">← חזרה לדף הבית</a>
        </div>
        <div id="success-area">
            <h2>תודה על פנייתך.</h2>
            <p>נחזור אליך בהקדם. 🕯️</p>
            <a href="index.html">חזרה לדף הבית</a>
        </div>
    </div>
    <script>
        document.getElementById('contact-form').addEventListener('submit', function(e) {
            e.preventDefault();
            fetch(this.action, {
                method: 'POST',
                body: new FormData(this),
                headers: { 'Accept': 'application/json' }
            }).then(function(r) {
                if (r.ok) {
                    document.getElementById('form-area').style.display = 'none';
                    document.getElementById('success-area').style.display = 'block';
                }
            });
        });
    </script>
</body>
</html>
