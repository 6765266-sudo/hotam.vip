name: Hotam payment recovery
on:
  workflow_dispatch:
  schedule:
    - cron: '3-58/5 * * * *'
permissions:
  id-token: write
concurrency:
  group: hotam-payment-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reconcile verified payments
        run: |
          node --input-type=module <<'JS'
          const endpoint = 'https://hotam-payment-notifications.tuvi1973.chatgpt.site/reconcile';
          const oidc = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          oidc.searchParams.set('audience', endpoint);
          const issued = await fetch(oidc, {
            redirect: 'error',
            headers: {Authorization: 'Bearer ' + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN},
            signal: AbortSignal.timeout(10000),
          });
          if (!issued.ok) throw new Error('Identity request failed: HTTP ' + issued.status);
          const {value} = await issued.json();
          const result = await fetch(endpoint, {
            method: 'POST', redirect: 'error',
            headers: {'X-Hotam-Workflow-Identity': value},
            signal: AbortSignal.timeout(55000),
          });
          if (result.status !== 204) throw new Error('Payment reconciliation failed: HTTP ' + result.status);
          JS
